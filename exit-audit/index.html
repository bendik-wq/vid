/**
 * One deal, structured properly.
 *
 * Every tranche gets a real schedule rather than a single average payment: a holiday before
 * the first instalment, payments sized over one period while the money is due at the end of a
 * shorter one, interest that rolls up when nothing is being paid. Those details are the whole
 * difference between a deal that funds itself and one that strangles you in year two, and an
 * average hides all of them.
 */


const within = (n, lo, hi) => Math.min(hi, Math.max(lo, n));

/**
 * Year-by-year for one tranche: what is paid, what is still owed, and the lump at the end.
 *
 * `mode` decides how the payment is sized. 'balloon' sizes it over `amortYears` while the
 * money falls due at `termYears`, which is the structure most vendor finance actually uses.
 */
function tranche(source, years) {
  const type = SOURCE_BY_ID[source.id];
  const amount = Math.max(0, source.amount || 0);
  const rate = Math.max(0, source.rate || 0);
  const term = Math.max(1, source.termYears || 1);
  const amort = Math.max(term, source.amortYears || term);
  const holidayMonths = within(Math.round(source.holidayMonths || 0), 0, term * 12);

  if (type?.kind !== 'debt' || amount <= 0) {
    // Equity pays no interest unless a preferred return was agreed, and never repays capital.
    const pref = amount * Math.max(0, source.prefRate || 0);
    const rows = Array.from({ length: years }, (_, i) => ({
      year: i + 1, payment: pref, interest: pref, principal: 0, balance: amount, balloon: 0,
    }));
    return { rows, balloon: 0, balloonYear: null, totalPaid: pref * years, amount, kind: 'equity' };
  }

  // Stepped monthly, because that is how the money actually moves. Annual stepping leaves a
  // rounding residue that reads as a balloon nobody agreed to.
  const r = rate / 12;
  const n = Math.round(amort * 12);
  const monthly = source.mode === 'interest' || source.mode === 'bullet'
    ? 0
    : (r === 0 ? amount / n : (amount * r) / (1 - Math.pow(1 + r, -n)));

  const rows = Array.from({ length: years }, (_, i) => ({
    year: i + 1, payment: 0, interest: 0, principal: 0, balance: 0, balloon: 0,
  }));

  let balance = amount;
  let totalPaid = 0;
  let balloon = 0;
  let balloonYear = null;
  const lastMonth = Math.round(term * 12);

  for (let month = 1; month <= years * 12; month += 1) {
    const row = rows[Math.ceil(month / 12) - 1];
    if (balance <= 0.005) { row.balance = 0; continue; }

    const interest = balance * r;
    let payment;
    if (month <= holidayMonths || source.mode === 'bullet') payment = 0;
    else if (source.mode === 'interest') payment = interest;
    else payment = Math.min(monthly, balance + interest);

    const unpaidInterest = Math.max(0, interest - payment);
    const principal = Math.max(0, payment - interest);
    // Interest nobody pays either rolls onto the balance or is waived. The seller decides
    // which, and over a nine-month holiday it changes what is owed by real money.
    balance = balance - principal + (source.accrueDuringHoliday ? unpaidInterest : 0);
    totalPaid += payment;

    row.payment += payment;
    row.interest += Math.min(interest, payment);
    row.principal += principal;

    if (month === lastMonth && balance > 0.005) {
      balloon = balance;
      balloonYear = row.year;
      row.balloon += balance;
      balance = 0;
    }
    row.balance = Math.max(0, balance);
  }

  return { rows, balloon, balloonYear, totalPaid, amount, kind: 'debt' };
}

/**
 * The whole stack against the business's own cash.
 *
 * @param {object} input price, fees, the sources, and what the business earns
 */
function runStack({
  price = 0,
  fees = 0,
  sources = [],
  ebitda = 0,
  taxRate = 0.25,
  capexPct = 0.1,
  years = 10,
  exitYear = 5,
  exitMultiple = 0,
} = {}) {
  const need = price + fees;
  const funded = sources.reduce((s, x) => s + Math.max(0, x.amount || 0), 0);
  const shortfall = need - funded;

  const tranches = sources
    .filter((x) => (x.amount || 0) > 0)
    .map((x) => ({ source: x, type: SOURCE_BY_ID[x.id], ...tranche(x, years) }));

  const freeCashFlow = Math.max(0, ebitda * (1 - capexPct) * (1 - taxRate));

  const schedule = Array.from({ length: years }, (_, i) => {
    const year = i + 1;
    const payment = tranches.reduce((s, t) => s + (t.rows[i]?.payment ?? 0), 0);
    const balloon = tranches.reduce((s, t) => s + (t.rows[i]?.balloon ?? 0), 0);
    const owed = payment + balloon;
    return {
      year,
      payment,
      balloon,
      owed,
      cash: freeCashFlow,
      surplus: freeCashFlow - owed,
      dscr: owed > 0 ? freeCashFlow / owed : Infinity,
      dscrBeforeBalloon: payment > 0 ? freeCashFlow / payment : Infinity,
      covers: owed === 0 || freeCashFlow / owed >= config.dscrFloor,
    };
  });

  // The tightest year is the one that decides whether this is fundable, and it is almost
  // never year one — that is exactly what a holiday is designed to hide.
  const servicing = schedule.filter((r) => r.payment > 0);
  const worst = servicing.reduce((a, b) => (b.dscrBeforeBalloon < a.dscrBeforeBalloon ? b : a), servicing[0] ?? null);
  const balloons = schedule.filter((r) => r.balloon > 0);

  const equity = tranches.filter((t) => t.type?.kind === 'equity');
  const equityTotal = equity.reduce((s, t) => s + t.amount, 0);
  const shares = equity.map((t) => ({
    id: t.source.id,
    name: t.type.name,
    amount: t.amount,
    pct: typeof t.source.equityPct === 'number' && isFinite(t.source.equityPct)
      ? within(t.source.equityPct, 0, 1)
      : (equityTotal > 0 ? t.amount / equityTotal : 0),
  }));
  const statedTotal = shares.reduce((s, x) => s + x.pct, 0);

  // Exit: what is left after the debt still outstanding, split by who owns what.
  const debtAtExit = tranches
    .filter((t) => t.type?.kind === 'debt')
    .reduce((s, t) => s + (t.rows[Math.min(years, exitYear) - 1]?.balance ?? 0), 0);
  const exitEnterprise = exitMultiple > 0 ? ebitda * exitMultiple : 0;
  const exitEquity = Math.max(0, exitEnterprise - debtAtExit);
  const split = shares.map((s) => ({ ...s, proceeds: exitEquity * (statedTotal > 0 ? s.pct / statedTotal : 0) }));
  const yours = split.find((s) => s.id === 'cash');

  return {
    need, funded, shortfall, balanced: Math.abs(shortfall) < 1,
    tranches, schedule, freeCashFlow,
    worst,
    minDscr: worst ? worst.dscrBeforeBalloon : Infinity,
    covers: schedule.every((r) => r.payment === 0 || r.dscrBeforeBalloon >= config.dscrFloor),
    balloons,
    totalBalloon: balloons.reduce((s, r) => s + r.balloon, 0),
    cashIn: sources.filter((x) => x.id === 'cash').reduce((s, x) => s + Math.max(0, x.amount || 0), 0),
    shares: split,
    statedTotal,
    debtAtExit,
    exitEnterprise,
    exitEquity,
    yourProceeds: yours?.proceeds ?? 0,
    yourShare: statedTotal > 0 && yours ? yours.pct / statedTotal : 0,
  };
}

// ── src/engine/repair.js ────────────────────────────────────────
/**
 * Restructuring: fixing a group that is already in the wrong shape.
 *
 * Most people arrive having bought well and structured badly — full price on bank terms, no
 * holiday, everything amortising at once. Nothing about those businesses has to change for
 * the group to become serviceable again; the debt does. This models the six things that can
 * actually be done about it, one at a time, so the effect of each is visible rather than
 * bundled into a single "refinanced" number.
 */



const REPAIR_ACTIONS = [
  {
    id: 'renegotiate',
    name: 'Go back to the sellers',
    plain: 'Ask everyone who left money in to take a lower rate.',
    detail: 'Cheapest thing on this list and the one people are most embarrassed to do. A seller already owed money would usually rather be paid slowly than not at all.',
    param: { key: 'rateCut', label: 'Take off the rate', kind: 'rate', value: 0.02, min: 0, max: 0.06 },
  },
  {
    id: 'extend',
    name: 'Give it longer to pay',
    plain: 'Stretch the remaining term so each payment is smaller.',
    detail: 'The same money, spread thinner. It costs more in total interest and it buys the room to keep trading.',
    param: { key: 'extraYears', label: 'Extra years', kind: 'number', value: 4, min: 0, max: 15 },
  },
  {
    id: 'interestOnly',
    name: 'Interest only for a while',
    plain: 'Pay only the interest until the business has caught its breath.',
    detail: 'The strongest single lever on cover, and the one that leaves the whole balance standing at the end. Use it to buy time, not to avoid the problem.',
    param: { key: 'years', label: 'For how many years', kind: 'number', value: 3, min: 1, max: 10 },
  },
  {
    id: 'refinance',
    name: 'Refinance the lot',
    plain: 'Replace every loan with one new facility.',
    detail: 'One rate, one term, one lender. Worth doing once the group is big enough to be interesting to a bank that would not have looked at any single site.',
    param: { key: 'rate', label: 'New rate', kind: 'rate', value: 0.075, min: 0.01, max: 0.2 },
    param2: { key: 'termYears', label: 'Over how many years', kind: 'number', value: 10, min: 3, max: 25 },
  },
  {
    id: 'divest',
    name: 'Sell the worst one',
    plain: 'Let go of the business that cannot pay for itself and use the money to clear its debt.',
    detail: 'Unsentimental and usually right. It takes its profit with it, but it takes more of its debt.',
    param: { key: 'count', label: 'How many to sell', kind: 'number', value: 1, min: 1, max: 6 },
  },
  {
    id: 'inject',
    name: 'Put money in',
    plain: 'Your own or an investor’s, straight against the debt.',
    detail: 'The only lever on this list that costs you cash. It is here so you can see how little it buys compared with the others.',
    param: { key: 'amount', label: 'How much', kind: 'number', value: 250_000, min: 0 },
  },
];

const ACTION_BY_ID = Object.fromEntries(REPAIR_ACTIONS.map((a) => [a.id, a]));

const blankRepair = () => ({
  chosen: [],
  params: Object.fromEntries(REPAIR_ACTIONS.map((a) => [
    a.id,
    { [a.param.key]: a.param.value, ...(a.param2 ? { [a.param2.key]: a.param2.value } : {}) },
  ])),
});

/** The debt book as it stands, one entry per tranche across every business in the group. */
function debtBook(built) {
  const book = [];
  for (const n of built.nodes) {
    const f = n.structure;
    if (n.bankDebt > 0) {
      book.push({
        nodeId: n.id, kind: 'bank', label: `${n.industry.name} — bank`,
        amount: n.bankDebt, rate: f.bankRate, termYears: f.bankTermYears, interestOnly: false,
      });
    }
    if (n.sellerNote > 0) {
      book.push({
        nodeId: n.id, kind: 'seller', label: `${n.industry.name} — seller`,
        amount: n.sellerNote, rate: f.sellerNoteRate, termYears: f.sellerNoteTermYears,
        interestOnly: Boolean(n.interestOnly),
      });
    }
  }
  return book;
}

const serviceOf = (book) =>
  book.reduce((s, t) => s + annualDebtService(t.amount, t.rate, t.termYears, t.interestOnly), 0);

/**
 * Apply the chosen actions in a fixed order and report the state after each.
 *
 * The order is not cosmetic: renegotiating before refinancing changes what you are
 * refinancing, and selling before injecting changes how much you need to inject. This runs
 * them cheapest-first, which is also the order anyone sensible would actually try them.
 */
function repairPlan(group, repair = blankRepair()) {
  const before = runBuild(group);
  const chosen = REPAIR_ACTIONS.filter((a) => repair.chosen.includes(a.id));
  const p = (id, key) => repair.params?.[id]?.[key] ?? ACTION_BY_ID[id].param.value;

  let book = debtBook(before);
  let profit = before.groupProfit;
  let cashIn = 0;
  let sold = [];
  let removedIds = new Set();

  const cash = (pf) => Math.max(0, pf * (1 - before.assumptions.capexPct) * (1 - before.assumptions.taxRate));
  const coverOf = (bk, pf) => {
    const svc = serviceOf(bk);
    return svc > 0 ? cash(pf) / svc : Infinity;
  };

  const steps = [{
    id: 'now',
    name: 'As it stands',
    detail: `${before.nodes.filter((n) => !n.passes).length} of ${before.nodes.length} cannot pay for themselves.`,
    debt: book.reduce((s, t) => s + t.amount, 0),
    service: serviceOf(book),
    profit,
    cover: coverOf(book, profit),
  }];

  for (const action of chosen) {
    if (action.id === 'renegotiate') {
      const cut = p('renegotiate', 'rateCut');
      book = book.map((t) => (t.kind === 'seller' ? { ...t, rate: Math.max(0, t.rate - cut) } : t));
    } else if (action.id === 'extend') {
      const extra = p('extend', 'extraYears');
      book = book.map((t) => ({ ...t, termYears: t.termYears + extra }));
    } else if (action.id === 'interestOnly') {
      book = book.map((t) => ({ ...t, interestOnly: true }));
    } else if (action.id === 'refinance') {
      const total = book.reduce((s, t) => s + t.amount, 0);
      book = total > 0 ? [{
        nodeId: null, kind: 'bank', label: 'One consolidated facility',
        amount: total, rate: p('refinance', 'rate'), termYears: p('refinance', 'termYears'), interestOnly: false,
      }] : [];
    } else if (action.id === 'divest') {
      const count = Math.max(0, Math.round(p('divest', 'count')));
      const worst = [...before.nodes].sort((a, b) => a.dscr - b.dscr)
        .filter((n) => !removedIds.has(n.id)).slice(0, count);
      for (const n of worst) {
        removedIds.add(n.id);
        sold.push(n);
        profit -= n.contributed;
        // Sold at what its own cash can carry, and the proceeds clear its debt first.
        const proceeds = n.ebitda * Math.max(0, n.maxMultiple);
        const owed = book.filter((t) => t.nodeId === n.id).reduce((s, t) => s + t.amount, 0);
        book = book.filter((t) => t.nodeId !== n.id);
        const spare = proceeds - owed;
        if (spare > 0) book = payDown(book, spare);
        else cashIn += -spare;
      }
    } else if (action.id === 'inject') {
      const amount = Math.max(0, p('inject', 'amount'));
      cashIn += amount;
      book = payDown(book, amount);
    }

    steps.push({
      id: action.id,
      name: action.name,
      detail: action.plain,
      debt: book.reduce((s, t) => s + t.amount, 0),
      service: serviceOf(book),
      profit,
      cover: coverOf(book, profit),
    });
  }

  const last = steps[steps.length - 1];
  const after = { ...last, book, sold, cashIn };

  return {
    before: steps[0],
    steps,
    after,
    book,
    sold,
    cashIn,
    fixed: last.cover >= config.dscrFloor,
    coverGain: last.cover - steps[0].cover,
    serviceSaved: steps[0].service - last.service,
    // Interest only and a longer term both push money into the future rather than removing it.
    deferred: chosen.some((a) => a.id === 'interestOnly' || a.id === 'extend'),
  };
}

/** Spend a lump against the book, most expensive money first. */
function payDown(book, amount) {
  let left = amount;
  return [...book]
    .sort((a, b) => b.rate - a.rate)
    .map((t) => {
      if (left <= 0) return t;
      const paid = Math.min(left, t.amount);
      left -= paid;
      return { ...t, amount: t.amount - paid };
    })
    .filter((t) => t.amount > 1);
}

/**
 * Worked examples, computed rather than written.
 *
 * Every figure on the examples screen comes out of the same engines the tool uses on a real
 * case. If a delta is tuned or a floor is moved, the examples move with it — which is the only
 * way a worked example stays honest once anyone starts editing the assumptions behind it.
 */






const auditOf = (scenario) => ({
  business: { ...scenario.audit.business },
  askingPrice: scenario.audit.askingPrice ?? 0,
  financials: { ...DEFAULT_FINANCIALS, ...scenario.audit.financials },
  structure: undefined,
  applySizePremium: true,
  scores: {
    ...Object.fromEntries(CRITERIA.filter((c) => c.impact.kind !== 'computed').map((c) => [c.id, 3])),
    ...(scenario.audit.scores ?? {}),
  },
});

const groupOf = (scenario, holdcoEbitda) => ({
  holdcoEbitda,
  holdcoIndustry: scenario.audit.business.sector,
  nodes: scenario.group?.nodes ?? [],
  nextId: scenario.group?.nextId ?? 1,
  assumptions: {},
});

/**
 * One example: the situation, what it looks like now, what one change does, and the lesson.
 * Every `rows` entry is a before/after pair ready to draw.
 */
function workedExample(scenario) {
  const audit = runAudit(auditOf(scenario));
  const remedy = scenario.remedy ?? { kind: 'none', label: '—' };
  const base = {
    id: scenario.id,
    voice: scenario.voice,
    pain: scenario.pain,
    detail: scenario.detail,
    remedy: remedy.label,
    audit,
  };

  if (remedy.kind === 'scale') {
    const scale = requiredScale({
      targetPrice: audit.askingPrice,
      currentProfit: audit.defensibleEbitda,
      industryId: scenario.audit.business.sector,
      avgDealProfit: remedy.avgDealProfit,
      dealsPerYear: remedy.dealsPerYear,
    });
    return {
      ...base,
      kind: 'scale',
      scale,
      rows: [
        { label: 'Profit you can prove', before: audit.defensibleEbitda, after: scale.requiredProfit, fmt: 'money' },
        { label: 'What buyers pay for it', before: audit.achievableMultiple, after: scale.requiredMultiple, fmt: 'turns' },
        { label: 'What it is worth', before: audit.achievableValue, after: audit.askingPrice, fmt: 'money' },
        { label: 'Who is bidding', before: scale.todayBand.who, after: scale.band.who, fmt: 'text' },
      ],
      lesson: `The number was never the problem. ${scale.businesses} more businesses over ${scale.years} `
        + `year${scale.years === 1 ? '' : 's'} and the same trade sells into a different room.`,
    };
  }

  if (remedy.kind === 'reprice') {
    const health = portfolioHealth(groupOf(scenario, audit.defensibleEbitda));
    return {
      ...base,
      kind: 'reprice',
      health,
      rows: [
        { label: 'Businesses that cannot pay for themselves', before: `${health.failing.length} of ${health.nodes.length}`, after: '0', fmt: 'text' },
        { label: 'Group cover', before: health.dscr, after: health.repriced.dscr, fmt: 'turns' },
        { label: 'What the group is worth', before: health.equityValue, after: health.repriced.equityValue, fmt: 'money' },
        { label: 'Overpaid', before: health.overpaid, after: 0, fmt: 'money' },
      ],
      lesson: `The average said the group was fine. Priced one at a time, ${health.failing.length} of them `
        + `were eating what the rest earned — worth ${health.drag > 0 ? Math.round(health.drag) : 0} in group value.`,
    };
  }

  if (remedy.kind === 'structure') {
    const options = capitalOptions(0, { industryId: remedy.industryId });
    const deposit = options.find((o) => o.needsCash);
    const vendor = options.find((o) => !o.needsCash);
    const industry = SECTORS_BY_ID[remedy.industryId] ?? SECTORS_BY_ID.generic;
    const dealPrice = audit.defensibleEbitda * industry.low;
    return {
      ...base,
      kind: 'structure',
      options,
      rows: [
        { label: 'Cash needed to buy one like yours', before: dealPrice * 0.2, after: 0, fmt: 'money' },
        { label: 'What limits how much you can pay', before: 'your cash', after: 'the price and the terms', fmt: 'text' },
        { label: 'Deals you can do at once', before: 'one, if that', after: 'as many as cover allows', fmt: 'text' },
        // The lever is the terms, not the structure: the same money stretched buys a much higher price.
        { label: 'Most you can pay, if the seller takes interest only', before: vendor.plainMultiple, after: vendor.stretchedMultiple, fmt: 'turns' },
      ],
      lesson: 'Cover does not care how big the business is. It cares what you pay and how long you get '
        + 'to pay it — and neither of those is your bank balance.',
    };
  }

  if (remedy.kind === 'repair') {
    const group = groupOf(scenario, audit.defensibleEbitda);
    const plan = repairPlan(group, { ...blankRepair(), chosen: remedy.actions });
    return {
      ...base,
      kind: 'repair',
      plan,
      rows: [
        { label: 'Owed', before: plan.before.debt, after: plan.after.debt, fmt: 'money' },
        { label: 'Repayments a year', before: plan.before.service, after: plan.after.service, fmt: 'money' },
        { label: 'Cover', before: plan.before.cover, after: plan.after.cover, fmt: 'turns' },
        { label: 'Cash it cost', before: 0, after: plan.cashIn, fmt: 'money' },
      ],
      lesson: `Nothing about the sites changed. ${Math.round(plan.serviceSaved).toLocaleString()} a year `
        + `stopped leaving the business because the terms changed, not the trading.`,
    };
  }

  if (remedy.kind === 'build') {
    const h = horizon({
      startingProfit: audit.defensibleEbitda,
      todayValue: audit.achievableValue,
      industryId: scenario.audit.business.sector,
      dealsPerYear: scenario.future?.dealsPerYear ?? 2,
      avgDealProfit: scenario.future?.avgDealProfit ?? 400_000,
      maxBusinesses: scenario.future?.maxBusinesses ?? 10,
      structureId: scenario.future?.structureId ?? 'vendor',
      synergyRate: scenario.future?.synergyRate ?? 0.15,
      advisoryCost: scenario.future?.advisoryCost ?? 0,
      years: remedy.years ?? 10,
    });
    const end = h.rows[h.rows.length - 1];
    return {
      ...base,
      kind: 'build',
      horizon: h,
      rows: [
        { label: 'Profit', before: audit.defensibleEbitda, after: end.groupProfit, fmt: 'money' },
        { label: 'Businesses', before: '1', after: String(end.businesses + 1), fmt: 'text' },
        { label: `Worth in year ${end.year}`, before: end.aloneValue, after: end.groupEquity, fmt: 'money' },
        { label: 'Your money in', before: 0, after: h.totalCashIn, fmt: 'money' },
      ],
      lesson: `An established business is the strongest thing anyone can buy from: its own profit is what `
        + `covers the first few deals until they cover themselves.`,
    };
  }

  if (remedy.kind === 'merge') {
    const group = groupOf(scenario, audit.defensibleEbitda);
    const target = group.nodes[0];
    const fit = industryFit(scenario.audit.business.sector, target?.industryId ?? 'generic');
    const apart = runBuild({ ...group, nodes: group.nodes.map((n) => ({ ...n, levers: [] })) });
    const together = runBuild(group);
    return {
      ...base,
      kind: 'merge',
      fit,
      rows: [
        { label: 'Things that genuinely merge', before: '0', after: String(fit.shared.length), fmt: 'text' },
        { label: 'Profit together', before: apart.groupProfit, after: together.groupProfit, fmt: 'money' },
        { label: 'Cover on the new one', before: apart.nodes[0]?.dscr ?? Infinity, after: together.nodes[0]?.dscr ?? Infinity, fmt: 'turns' },
        { label: 'What the group is worth', before: apart.equityValue, after: together.equityValue, fmt: 'money' },
      ],
      lesson: fit.same
        ? 'Same trade, so one office, one yard and one set of vans do the work of two.'
        : `Only ${fit.shared.length} of the savings carry across. Claim the rest and you are buying a `
          + 'second company, not a bigger one.',
    };
  }

  return { ...base, kind: 'none', rows: [], lesson: '' };
}

const allExamples = (scenarios) => scenarios.map(workedExample);

// ── src/ui/format.js ────────────────────────────────────────────
/** Presentation helpers. Currency symbol is a display concern only — the engine is unitless. */

const state_currency = { symbol: '$' };

const money = (n) => {
  if (!isFinite(n)) return '—';
  const sign = n < 0 ? '-' : '';
  return sign + state_currency.symbol + Math.round(Math.abs(n)).toLocaleString('en-US');
};

const moneyShort = (n) => {
  if (!isFinite(n)) return '—';
  const a = Math.abs(n);
  const sign = n < 0 ? '-' : '';
  const s = state_currency.symbol;
  if (a >= 1e9) return `${sign}${s}${(a / 1e9).toFixed(2)}b`;
  if (a >= 1e6) return `${sign}${s}${(a / 1e6).toFixed(2)}m`;
  if (a >= 1e3) return `${sign}${s}${Math.round(a / 1e3)}k`;
  return `${sign}${s}${Math.round(a)}`;
};

const turns = (n) => (isFinite(n) ? `${n.toFixed(2)}x` : '—');
const pct = (n, dp = 1) => (isFinite(n) ? `${(n * 100).toFixed(dp)}%` : '—');
const esc = (s) =>
  String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const num = (v, fallback = 0) => {
  const n = Number(String(v).replace(/[^0-9.\-]/g, ''));
  return Number.isFinite(n) ? n : fallback;
};

// ── src/ui/charts.js ────────────────────────────────────────────
/**
 * Inline SVG figures.
 *
 * Every figure is one series: a bar is one colour, and identity comes from direct labels
 * beside the mark rather than from a second hue. Hue is spent on the three pillars and on
 * status, nowhere else. Each mark carries a <title> so hovering names it, and every figure
 * ships a legend or table beneath, which is also the relief for the low-contrast steps.
 */

const VB = 1000;          // internal units; every figure scales to its container
const GAP = 3;            // surface gap between adjacent fills

const bound = (n, lo, hi) => Math.min(hi, Math.max(lo, n));

/**
 * A total split into what survives and what is taken off it.
 * Used for both haircuts, so the two read as the same operation applied twice.
 */
function bridgeBar({ total, keep, keepLabel, keepValue, cuts, tone = 'var(--ink)', format }) {
  const height = 52;
  const safeTotal = total > 0 ? total : 1;
  const scale = (v) => (v / safeTotal) * VB;
  const fmt = format ?? money;

  const visible = cuts.filter((c) => c.value > 0);
  let x = 0;
  const segments = [];

  const keepW = Math.max(0, scale(keep));
  segments.push({ x: 0, w: keepW, fill: tone, label: keepLabel, value: keep, keep: true });
  x = keepW;

  for (const cut of visible) {
    const w = Math.max(0, scale(cut.value) - GAP);
    segments.push({ x: x + GAP, w, fill: 'var(--loss)', label: cut.label, value: cut.value });
    x += scale(cut.value);
  }

  const marks = segments
    .map(
      (s) => `<rect class="seg-mark" x="${s.x.toFixed(1)}" y="0" width="${Math.max(0, s.w).toFixed(1)}" height="${height}" fill="${s.fill}">
        <title>${esc(s.label)}: ${esc(fmt(s.value))}</title></rect>`,
    )
    .join('');

  const legend = segments
    .map(
      (s) => `<span><i style="background:${s.fill}"></i>${esc(s.label)}
        <strong style="margin-left:4px">${esc(fmt(s.value))}</strong></span>`,
    )
    .join('');

  return `
  <figure>
    <svg viewBox="0 0 ${VB} ${height}" preserveAspectRatio="none" style="height:52px;width:100%"
         role="img" aria-label="${esc(keepLabel)} ${esc(fmt(keepValue ?? keep))} of ${esc(fmt(total))}">
      <defs><clipPath id="clip-${cid()}"><rect x="0" y="0" width="${VB}" height="${height}" rx="7" /></clipPath></defs>
      <g clip-path="url(#clip-${lastId})">
        <rect x="0" y="0" width="${VB}" height="${height}" fill="var(--sunken)" />
        ${marks}
      </g>
    </svg>
    <div class="legend">${legend}</div>
  </figure>`;
}

let idCounter = 0;
let lastId = 'a';
const cid = () => { lastId = `f${(idCounter += 1)}`; return lastId; };

/** Five discrete steps, because the score is discrete. Partial fill on the current step. */
function pillarMeter(score) {
  const s = bound(score, 0, 5);
  const cells = [1, 2, 3, 4, 5].map((n) => {
    const fill = bound(s - (n - 1), 0, 1);
    return `<div style="flex:1;height:8px;border-radius:3px;background:var(--sunken);overflow:hidden">
      <div style="height:100%;width:${(fill * 100).toFixed(0)}%;background:var(--hue)"></div></div>`;
  }).join('');
  return `<div style="display:flex;gap:3px" role="img" aria-label="${s.toFixed(1)} out of 5">${cells}</div>`;
}

/** A single value on a fixed scale, with the threshold that decides it marked. */
function thresholdScale({ value, floor, max, label, unit = turns, good }) {
  const height = 58;
  const top = Math.max(max, floor * 1.5, isFinite(value) ? value * 1.15 : 0);
  const x = (v) => bound(v / top, 0, 1) * VB;
  const passing = good ?? value >= floor;
  const fill = passing ? 'var(--good)' : 'var(--critical)';
  const vx = x(value);
  const fx = x(floor);

  return `
  <figure>
    <svg viewBox="0 0 ${VB} ${height}" style="width:100%;height:${height}px" role="img"
         aria-label="${esc(label)} ${esc(unit(value))}, threshold ${esc(unit(floor))}">
      <rect x="0" y="20" width="${VB}" height="16" rx="8" fill="var(--sunken)" />
      <rect x="0" y="20" width="${vx.toFixed(1)}" height="16" rx="8" fill="${fill}">
        <title>${esc(label)}: ${esc(unit(value))}</title></rect>
      <line x1="${fx.toFixed(1)}" y1="12" x2="${fx.toFixed(1)}" y2="44" stroke="var(--ink)" stroke-width="2" />
      <text x="${fx.toFixed(1)}" y="56" fill="var(--ink-2)" font-size="13" text-anchor="middle">floor ${esc(unit(floor))}</text>
      <text x="0" y="12" fill="var(--ink-3)" font-size="12">0</text>
      <text x="${VB}" y="12" fill="var(--ink-3)" font-size="12" text-anchor="end">${esc(unit(top))}</text>
    </svg>
  </figure>`;
}

/**
 * What they want against what they get, with the fundability ceiling marked.
 * One bar, because there is one number in question.
 */
function gapBar({ asking, achievable, fundable }) {
  const height = 52;
  const top = Math.max(asking, achievable, isFinite(fundable) ? fundable : 0) || 1;
  const x = (v) => bound(v / top, 0, 1) * VB;

  const cash = isFinite(fundable) ? fundable : achievable;
  const realistic = Math.min(achievable, cash);
  const blocked = Math.max(0, achievable - realistic);
  const blockedBy = achievable > cash ? 'a buyer cannot fund it' : 'the business does not support it';

  const zones = [
    { w: x(realistic), fill: 'var(--ink)', opacity: 1,
      label: 'What you would actually get', value: realistic },
    { w: Math.max(0, x(achievable) - x(realistic)), fill: 'var(--ink)', opacity: 0.3,
      label: `Worth it on paper, but ${blockedBy}`, value: blocked },
    { w: Math.max(0, x(asking) - x(achievable)), fill: 'var(--critical)', opacity: 0.16,
      label: 'The gap', value: Math.max(0, asking - achievable) },
  ].filter((z) => z.value > 0 || z.w > 1);

  let cursor = 0;
  const marks = zones.map((z) => {
    const rect = `<rect class="seg-mark" x="${cursor.toFixed(1)}" y="0" width="${Math.max(0, z.w - GAP).toFixed(1)}"
      height="${height}" fill="${z.fill}" opacity="${z.opacity}">
      <title>${esc(z.label)}: ${esc(money(z.value))}</title></rect>`;
    cursor += z.w;
    return rect;
  }).join('');

  const legend = zones.map((z) => `<span>
    <i style="background:${z.fill};opacity:${z.opacity}"></i>${esc(z.label)}
    <strong style="margin-left:4px">${esc(money(z.value))}</strong></span>`).join('');

  return `
  <figure>
    <svg viewBox="0 0 ${VB} ${height}" preserveAspectRatio="none" style="width:100%;height:${height}px" role="img"
         aria-label="Asking ${esc(money(asking))}, audit value ${esc(money(achievable))}, fundable ${esc(money(cash))}">
      <defs><clipPath id="clip-${cid()}"><rect x="0" y="0" width="${VB}" height="${height}" rx="7" /></clipPath></defs>
      <g clip-path="url(#clip-${lastId})">
        <rect x="0" y="0" width="${VB}" height="${height}" fill="var(--sunken)" />
        ${marks}
      </g>
    </svg>
    <div class="legend">${legend}</div>
  </figure>`;
}

/** Change over time: three points is thin for a line, but it is a line the seller walks. */
function trajectory(points) {
  const w = VB;
  const h = 260;
  const padX = 60;
  const padTop = 54;
  const padBottom = 44;
  const max = Math.max(...points.map((p) => p.value)) || 1;
  const x = (i) => padX + (i / Math.max(1, points.length - 1)) * (w - padX * 2);
  const y = (v) => padTop + (1 - v / max) * (h - padTop - padBottom);

  const line = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
  const area = `${line} L${x(points.length - 1).toFixed(1)},${h - padBottom} L${x(0).toFixed(1)},${h - padBottom} Z`;

  return `
  <figure>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img"
         aria-label="Value over time: ${points.map((p) => `${p.label} ${money(p.value)}`).join(', ')}">
      <line x1="${padX}" y1="${h - padBottom}" x2="${w - padX}" y2="${h - padBottom}" stroke="var(--hair)" stroke-width="1" />
      <path d="${area}" fill="var(--ink)" opacity="0.06" />
      <path d="${line}" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
      ${points.map((p, i) => `
        <circle class="seg-mark" cx="${x(i).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="6"
                fill="var(--paper)" stroke="var(--ink)" stroke-width="2.5">
          <title>${esc(p.label)}: ${esc(money(p.value))}</title></circle>
        <text x="${x(i).toFixed(1)}" y="${(y(p.value) - 22).toFixed(1)}" text-anchor="middle"
              font-size="19" font-weight="600" fill="var(--ink)" letter-spacing="-0.5">${esc(moneyShort(p.value))}</text>
        <text x="${x(i).toFixed(1)}" y="${h - padBottom + 24}" text-anchor="middle"
              font-size="13" fill="var(--ink-3)">${esc(p.label)}</text>`).join('')}
    </svg>
  </figure>`;
}

/** Two marks on one multiple axis, the spread between them shaded. */
function multipleSpread({ entry, exit, label = 'Arbitrage' }) {
  const h = 116;
  const top = Math.max(exit, entry) * 1.2 || 1;
  const x = (v) => bound(v / top, 0, 1) * (VB - 40) + 20;
  const y = 58;

  return `
  <figure>
    <svg viewBox="0 0 ${VB} ${h}" style="width:100%;height:${h}px" role="img"
         aria-label="Entry ${esc(turns(entry))}, exit ${esc(turns(exit))}">
      <line x1="20" y1="${y}" x2="${VB - 20}" y2="${y}" stroke="var(--hair)" stroke-width="1" />
      <rect x="${x(entry).toFixed(1)}" y="${y - 9}" width="${Math.max(0, x(exit) - x(entry)).toFixed(1)}" height="18"
            fill="var(--good)" opacity="0.18" rx="4">
        <title>${esc(label)}: ${esc(turns(exit - entry))}</title></rect>
      ${[['entry', entry, 'var(--ink-3)'], ['exit', exit, 'var(--ink)']].map(([name, v, c]) => `
        <line x1="${x(v).toFixed(1)}" y1="${y - 16}" x2="${x(v).toFixed(1)}" y2="${y + 16}" stroke="${c}" stroke-width="2.5" />
        <text x="${x(v).toFixed(1)}" y="${name === 'entry' ? y + 38 : y - 24}" text-anchor="middle"
              font-size="15" font-weight="600" fill="${c}">${esc(turns(v))}</text>
        <text x="${x(v).toFixed(1)}" y="${name === 'entry' ? y + 55 : y - 42}" text-anchor="middle"
              font-size="12" fill="var(--ink-3)">${name === 'entry' ? 'blended entry' : 'exit'}</text>`).join('')}
    </svg>
  </figure>`;
}

/**
 * The three C's side by side. Identity, so each pillar keeps its own hue wherever it
 * appears in the tool; direct labels carry the values so hue never has to.
 */
function pillarBars(items, { format = money } = {}) {
  const rowH = 74;
  const h = items.length * rowH + 8;
  const max = Math.max(...items.map((i) => i.value), 1);
  const labelW = 150;

  return `
  <figure>
    <svg viewBox="0 0 ${VB} ${h}" style="width:100%;height:auto" role="img"
         aria-label="${items.map((i) => `${i.name} ${format(i.value)}`).join(', ')}">
      ${items.map((item, n) => {
        const y = n * rowH + 10;
        const w = bound(item.value / max, 0, 1) * (VB - labelW - 190);
        return `
        <text x="0" y="${y + 26}" font-size="17" font-weight="600" fill="var(--ink)">${esc(item.name)}</text>
        <text x="0" y="${y + 47}" font-size="13" fill="var(--ink-3)">${esc(item.sub ?? '')}</text>
        <rect class="seg-mark" x="${labelW}" y="${y + 8}" width="${Math.max(2, w).toFixed(1)}" height="30" rx="5"
              fill="${item.color}">
          <title>${esc(item.name)}: ${esc(format(item.value))}</title></rect>
        <text x="${(labelW + Math.max(2, w) + 14).toFixed(1)}" y="${y + 29}" font-size="17" font-weight="600"
              fill="var(--ink)">${esc(format(item.value))}</text>`;
      }).join('')}
    </svg>
  </figure>`;
}

/** A ranked magnitude, sized against the largest in its own list. */
function rankBar(value, max) {
  const w = max > 0 ? bound(value / max, 0, 1) * 100 : 0;
  return `<div style="height:6px;background:var(--sunken);border-radius:3px;overflow:hidden;min-width:70px">
    <div style="height:100%;width:${w.toFixed(1)}%;background:var(--good);border-radius:3px"></div></div>`;
}

/**
 * Two roads over twenty years.
 *
 * The group line takes the identity colour; the do-nothing line is deliberately grey,
 * because it is the baseline rather than a competing category. Both ends are labelled so
 * the reader never has to match a colour to a legend to get the point.
 */
function twoPaths(rows) {
  const w = VB;
  const h = 380;
  const padL = 46;   // room for the first year label, which is centred on the axis
  const padR = 170;
  const padTop = 40;
  const padBottom = 46;
  const max = Math.max(...rows.map((r) => Math.max(r.groupEquity, r.aloneValue))) || 1;
  const lastYear = rows[rows.length - 1].year;

  const x = (year) => padL + ((year - 1) / Math.max(1, lastYear - 1)) * (w - padL - padR);
  const y = (v) => padTop + (1 - v / max) * (h - padTop - padBottom);

  const path = (key) => rows.map((r, i) => `${i ? 'L' : 'M'}${x(r.year).toFixed(1)},${y(r[key]).toFixed(1)}`).join(' ');
  const last = rows[rows.length - 1];

  const gridYears = [1, 5, 10, 15, 20].filter((v) => v <= lastYear);

  return `
  <figure>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img"
         aria-label="After ${lastYear} years: as a group ${money(last.groupEquity)}, on your own ${money(last.aloneValue)}">
      ${gridYears.map((yr) => `
        <line x1="${x(yr).toFixed(1)}" y1="${padTop - 10}" x2="${x(yr).toFixed(1)}" y2="${h - padBottom}"
              stroke="var(--hair)" stroke-width="1" />
        <text x="${x(yr).toFixed(1)}" y="${h - padBottom + 24}" font-size="13" fill="var(--ink-3)"
              text-anchor="middle">Year ${yr}</text>`).join('')}
      <path d="${path('groupEquity')} L${x(last.year).toFixed(1)},${h - padBottom} L${x(1).toFixed(1)},${h - padBottom} Z"
            fill="var(--credibility)" opacity="0.09" />
      <path d="${path('aloneValue')}" fill="none" stroke="var(--ink-3)" stroke-width="2"
            stroke-linejoin="round" stroke-linecap="round" />
      <path d="${path('groupEquity')}" fill="none" stroke="var(--credibility)" stroke-width="3"
            stroke-linejoin="round" stroke-linecap="round" />

      <circle cx="${x(last.year).toFixed(1)}" cy="${y(last.groupEquity).toFixed(1)}" r="6"
              fill="var(--paper)" stroke="var(--credibility)" stroke-width="3" />
      <text x="${(x(last.year) + 16).toFixed(1)}" y="${(y(last.groupEquity) - 4).toFixed(1)}"
            font-size="22" font-weight="700" fill="var(--ink)" letter-spacing="-0.5">${esc(moneyShort(last.groupEquity))}</text>
      <text x="${(x(last.year) + 16).toFixed(1)}" y="${(y(last.groupEquity) + 16).toFixed(1)}"
            font-size="13" fill="var(--ink-3)">as a group</text>

      <circle cx="${x(last.year).toFixed(1)}" cy="${y(last.aloneValue).toFixed(1)}" r="5"
              fill="var(--paper)" stroke="var(--ink-3)" stroke-width="2.5" />
      <text x="${(x(last.year) + 16).toFixed(1)}" y="${(y(last.aloneValue) + 2).toFixed(1)}"
            font-size="17" font-weight="600" fill="var(--ink-2)">${esc(moneyShort(last.aloneValue))}</text>
      <text x="${(x(last.year) + 16).toFixed(1)}" y="${(y(last.aloneValue) + 20).toFixed(1)}"
            font-size="13" fill="var(--ink-3)">on your own</text>
    </svg>
    <div class="legend">
      <span><i style="background:var(--credibility)"></i>Buy others alongside it</span>
      <span><i style="background:var(--ink-2)"></i>Keep it and grow it</span>
    </div>
  </figure>`;
}

/**
 * Why a group is worth more than the businesses in it.
 *
 * The whole strategy is one spread: what you pay per pound of profit on the way in against
 * what you are paid per pound on the way out. Drawing it is the fastest way to see that
 * nothing about the businesses has to improve for the arithmetic to work.
 */
function spreadDiagram({ entry, exit, count = 3, each = 250_000, platform = 0 }) {
  const w = 1000;
  const h = 300;
  const boxW = 150;
  const boxH = 54;
  const leftX = 10;
  const midX = 420;
  const rightX = 760;
  const acquired = count * each;
  const total = acquired + platform;

  const smalls = Array.from({ length: Math.min(count, 3) }, (_, i) => {
    const y = 62 + i * 74;
    return `
      <rect x="${leftX}" y="${y}" width="${boxW}" height="${boxH}" rx="9"
            fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5" />
      <text x="${leftX + boxW / 2}" y="${y + 23}" text-anchor="middle" font-size="13"
            fill="currentColor" opacity="0.75">One business</text>
      <text x="${leftX + boxW / 2}" y="${y + 42}" text-anchor="middle" font-size="15"
            font-weight="600" fill="currentColor">${esc(moneyShort(each))} profit</text>
      <line x1="${leftX + boxW}" y1="${y + boxH / 2}" x2="${midX - 12}" y2="${h / 2}"
            stroke="currentColor" stroke-width="1.5" opacity="0.35" marker-end="url(#spread-arrow)" />`;
  }).join('');

  return `
  <figure>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;color:var(--ink)" role="img"
         aria-label="You buy at ${turns(entry)} and the group sells at ${turns(exit)}, a spread of ${turns(exit - entry)}">
      <defs>
        <marker id="spread-arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor" opacity="0.5" />
        </marker>
      </defs>

      ${smalls}
      <text x="${leftX}" y="30" font-size="13" font-weight="600" fill="currentColor" opacity="0.6"
            letter-spacing="1.2">WHAT YOU BUY</text>
      <text x="${leftX + boxW / 2}" y="${h - 14}" text-anchor="middle" font-size="14"
            font-weight="600" fill="var(--critical)">${esc(turns(entry))} each</text>

      <rect x="${midX}" y="${h / 2 - 46}" width="200" height="92" rx="12"
            fill="currentColor" stroke="none" />
      <text x="${midX + 100}" y="${h / 2 - 18}" text-anchor="middle" font-size="12"
            fill="var(--paper)" opacity="0.7" letter-spacing="1">ONE GROUP</text>
      <text x="${midX + 100}" y="${h / 2 + 10}" text-anchor="middle" font-size="26"
            font-weight="700" fill="var(--paper)">${esc(moneyShort(total))}</text>
      <text x="${midX + 100}" y="${h / 2 + 30}" text-anchor="middle" font-size="12"
            fill="var(--paper)" opacity="0.7">of profit</text>

      <line x1="${midX + 200}" y1="${h / 2}" x2="${rightX - 12}" y2="${h / 2}"
            stroke="currentColor" stroke-width="2" marker-end="url(#spread-arrow)" />
      <text x="${(midX + 200 + rightX) / 2}" y="${h / 2 - 14}" text-anchor="middle" font-size="13"
            fill="currentColor" opacity="0.6">sells as one</text>

      <rect x="${rightX}" y="${h / 2 - 46}" width="230" height="92" rx="12"
            fill="none" stroke="var(--good)" stroke-width="2" />
      <text x="${rightX + 115}" y="${h / 2 - 18}" text-anchor="middle" font-size="12"
            fill="currentColor" opacity="0.6" letter-spacing="1">WHAT IT SELLS FOR</text>
      <text x="${rightX + 115}" y="${h / 2 + 12}" text-anchor="middle" font-size="28"
            font-weight="700" fill="currentColor">${esc(moneyShort(total * exit))}</text>
      <text x="${rightX + 115}" y="${h - 14}" text-anchor="middle" font-size="14"
            font-weight="600" fill="var(--good)">${esc(turns(exit))} for the group</text>
    </svg>
    <figcaption>Nothing about any of these businesses has to improve. You pay
      ${esc(turns(entry))} for each pound of profit and are paid ${esc(turns(exit))} for the same pound
      once it sits inside a group — a spread of ${esc(turns(exit - entry))}.</figcaption>
  </figure>`;
}

/**
 * The two roads, as a shell the year scrubber drives.
 *
 * Both full paths are drawn once and revealed by a clip rectangle the interaction widens,
 * so scrubbing costs one attribute write rather than a re-render.
 */
function raceChart(rows) {
  const w = 1000;
  const h = 340;
  const padL = 20;
  const padR = 210;
  const padTop = 48;
  const padBottom = 46;
  const max = Math.max(...rows.map((r) => Math.max(r.groupEquity, r.aloneValue))) || 1;
  const lastYear = rows[rows.length - 1].year;

  const x = (year) => padL + ((year - 1) / Math.max(1, lastYear - 1)) * (w - padL - padR);
  const y = (v) => padTop + (1 - v / max) * (h - padTop - padBottom);
  const path = (key) => rows.map((r, i) => `${i ? 'L' : 'M'}${x(r.year).toFixed(1)},${y(r[key]).toFixed(1)}`).join(' ');

  const scale = { padL, padR, padTop, padBottom, w, h, max, lastYear };

  return `
  <figure>
    <svg id="race" viewBox="0 0 ${w} ${h}" style="width:100%;height:auto"
         data-scale='${JSON.stringify(scale)}' role="img"
         aria-label="Value over ${lastYear} years: as a group ${money(rows[rows.length - 1].groupEquity)}, on your own ${money(rows[rows.length - 1].aloneValue)}">
      <defs>
        <clipPath id="race-reveal"><rect id="race-rect" x="0" y="0" width="0" height="${h}" /></clipPath>
      </defs>
      ${[1, 5, 10, 15, 20].filter((v) => v <= lastYear).map((yr) => `
        <line x1="${x(yr).toFixed(1)}" y1="${padTop - 12}" x2="${x(yr).toFixed(1)}" y2="${h - padBottom}"
              stroke="var(--hair)" stroke-width="1" />
        <text x="${x(yr).toFixed(1)}" y="${h - padBottom + 24}" font-size="13" fill="var(--ink-3)"
              text-anchor="middle">Year ${yr}</text>`).join('')}
      ${[0.5, 1].map((frac) => `
        <line x1="${padL}" y1="${y(max * frac).toFixed(1)}" x2="${w - padR}" y2="${y(max * frac).toFixed(1)}"
              stroke="var(--hair)" stroke-width="1" />
        <text x="${w - padR + 10}" y="${(y(max * frac) + 4).toFixed(1)}" font-size="12"
              fill="var(--ink-3)">${esc(moneyShort(max * frac))}</text>`).join('')}
      <g clip-path="url(#race-reveal)">
        <path d="${path('groupEquity')} L${x(lastYear).toFixed(1)},${h - padBottom} L${x(1).toFixed(1)},${h - padBottom} Z"
              fill="var(--credibility)" opacity="0.1" />
        <path d="${path('groupEquity')}" fill="none" stroke="var(--credibility)" stroke-width="3.5"
              stroke-linejoin="round" stroke-linecap="round" />
        <path d="${path('aloneValue')}" fill="none" stroke="var(--ink-2)" stroke-width="3"
              stroke-linejoin="round" stroke-linecap="round" />
      </g>
      <circle id="race-dot-alone" cx="${x(1)}" cy="${y(rows[0].aloneValue)}" r="5.5"
              fill="var(--paper)" stroke="var(--ink-2)" stroke-width="3" />
      <circle id="race-dot-group" cx="${x(1)}" cy="${y(rows[0].groupEquity)}" r="6.5"
              fill="var(--paper)" stroke="var(--credibility)" stroke-width="3.5" />
    </svg>
    <div class="legend">
      <span><i style="background:var(--credibility)"></i>Buy others alongside it</span>
      <span><i style="background:var(--ink-2)"></i>Keep it and grow it</span>
    </div>
  </figure>`;
}

/**
 * What moves the number most, worst answer to best.
 *
 * A tornado: every bar is one question's range around where the business sits today, sorted
 * by how much is at stake. Loss and gain are the only two things being shown, so they take
 * the status colours rather than an identity palette.
 */
function tornado(items, { limit = 8 } = {}) {
  const rows = items.slice(0, limit);
  const rowH = 42;
  const labelW = 300;
  const h = rows.length * rowH + 46;
  const w = VB;
  const plotL = labelW;
  const plotW = w - labelW - 120;
  const span = Math.max(...rows.map((r) => Math.max(r.downside, r.upside)), 1);
  const mid = plotL + plotW / 2;
  const scale = (v) => (v / span) * (plotW / 2);

  return `
  <figure>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img"
         aria-label="${rows.map((r) => `${r.name}: ${money(r.low)} to ${money(r.high)}`).join('; ')}">
      <line x1="${mid}" y1="26" x2="${mid}" y2="${h - 26}" stroke="var(--ink-3)" stroke-width="1.5" />
      <text x="${mid}" y="16" text-anchor="middle" font-size="12" fill="var(--ink-3)">where you are now</text>
      ${rows.map((r, i) => {
        const y = 32 + i * rowH;
        const down = scale(r.downside);
        const up = scale(r.upside);
        return `
        <text x="0" y="${y + 20}" font-size="14" font-weight="600" fill="var(--ink)">${esc(r.name)}</text>
        <text x="${labelW - 22}" y="${y + 20}" text-anchor="end" font-size="12.5" fill="var(--ink-3)">${r.score}/5</text>
        <rect class="seg-mark" x="${(mid - down).toFixed(1)}" y="${y + 4}" width="${Math.max(0, down - 1).toFixed(1)}"
              height="24" rx="4" fill="var(--critical)" opacity="0.75">
          <title>${esc(r.name)} at its worst: ${esc(money(r.low))}</title></rect>
        <rect class="seg-mark" x="${(mid + 1).toFixed(1)}" y="${y + 4}" width="${Math.max(0, up - 1).toFixed(1)}"
              height="24" rx="4" fill="var(--good)" opacity="0.8">
          <title>${esc(r.name)} at its best: ${esc(money(r.high))}</title></rect>
        <text x="${(mid + up + 12).toFixed(1)}" y="${y + 21}" font-size="13.5" font-weight="600"
              fill="var(--ink)">+${esc(moneyShort(r.upside))}</text>`;
      }).join('')}
    </svg>
    <div class="legend">
      <span><i style="background:var(--critical);opacity:0.75"></i>What you lose if it gets worse</span>
      <span><i style="background:var(--good);opacity:0.8"></i>What you gain if you fix it</span>
    </div>
  </figure>`;
}

/** Where the money for one deal comes from. One hue, because it is all the same price. */
function fundingStack(node) {
  const h = 46;
  const total = node.price || 1;
  const parts = [
    { label: 'Your cash', value: node.cashNeeded, opacity: 1 },
    { label: 'Borrowed from a bank', value: node.bankDebt, opacity: 0.6 },
    { label: 'Left with the seller', value: node.sellerNote, opacity: 0.32 },
  ].filter((p) => p.value > 0);

  let x = 0;
  const marks = parts.map((p) => {
    const width = Math.max(0, (p.value / total) * VB - GAP);
    const rect = `<rect class="seg-mark" x="${x.toFixed(1)}" y="0" width="${width.toFixed(1)}" height="${h}"
      fill="var(--ink)" opacity="${p.opacity}"><title>${esc(p.label)}: ${esc(money(p.value))}</title></rect>`;
    x += (p.value / total) * VB;
    return rect;
  }).join('');

  return `
  <figure>
    <svg viewBox="0 0 ${VB} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px" role="img"
         aria-label="${parts.map((p) => `${p.label} ${money(p.value)}`).join(', ')}">
      <defs><clipPath id="clip-${cid()}"><rect x="0" y="0" width="${VB}" height="${h}" rx="7" /></clipPath></defs>
      <g clip-path="url(#clip-${lastId})">
        <rect x="0" y="0" width="${VB}" height="${h}" fill="var(--sunken)" />
        ${marks}
      </g>
    </svg>
    <div class="legend">
      ${parts.map((p) => `<span><i style="background:var(--ink);opacity:${p.opacity}"></i>${esc(p.label)}
        <strong style="margin-left:4px">${esc(money(p.value))}</strong></span>`).join('')}
    </div>
  </figure>`;
}

/**
 * The first six years of one deal: what it earns against what it owes.
 *
 * The payment holiday is the whole reason these structures work, and it is invisible in a
 * single cover ratio — you have to see the year with no bar next to it.
 */
function dealCashflow(node, { years = 6 } = {}) {
  const w = VB;
  const h = 260;
  const padL = 10;
  const padR = 10;
  const padTop = 40;
  const padBottom = 48;
  const holidayYears = (node.structure?.holidayMonths ?? 0) / 12;

  const rows = Array.from({ length: years }, (_, i) => {
    const year = i + 1;
    const covered = Math.max(0, Math.min(1, year - holidayYears));
    return { year, cash: node.freeCashFlow, service: node.service * covered };
  });

  const max = Math.max(...rows.flatMap((r) => [r.cash, r.service]), 1);
  const slot = (w - padL - padR) / years;
  const barW = slot * 0.3;
  const y = (v) => padTop + (1 - v / max) * (h - padTop - padBottom);

  return `
  <figure>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img"
         aria-label="Year by year, ${money(node.freeCashFlow)} of cash against repayments rising to ${money(node.service)}">
      <line x1="${padL}" y1="${h - padBottom}" x2="${w - padR}" y2="${h - padBottom}"
            stroke="var(--hair)" stroke-width="1" />
      ${rows.map((r, i) => {
        const year = r.year;
        const cx = padL + slot * i + slot / 2;
        const shortfall = r.service > r.cash;
        return `
        <rect class="seg-mark" x="${(cx - barW - 3).toFixed(1)}" y="${y(r.cash).toFixed(1)}"
              width="${barW.toFixed(1)}" height="${(h - padBottom - y(r.cash)).toFixed(1)}" rx="4"
              fill="var(--ink)" opacity="0.85">
          <title>Year ${r.year} cash: ${esc(money(r.cash))}</title></rect>
        <rect class="seg-mark" x="${(cx + 3).toFixed(1)}" y="${y(r.service).toFixed(1)}"
              width="${barW.toFixed(1)}" height="${Math.max(0, h - padBottom - y(r.service)).toFixed(1)}" rx="4"
              fill="${shortfall ? 'var(--critical)' : 'var(--loss)'}">
          <title>Year ${r.year} repayments: ${esc(money(r.service))}</title></rect>
        <text x="${cx.toFixed(1)}" y="${h - padBottom + 22}" text-anchor="middle" font-size="13"
              fill="var(--ink-3)">Year ${r.year}</text>
        ${year <= holidayYears + 1 && holidayYears > 0 ? `<text x="${cx.toFixed(1)}" y="${h - padBottom + 40}"
              text-anchor="middle" font-size="12" font-weight="600" fill="var(--good)">${
                r.service === 0 ? 'no payments' : `${Math.round(holidayYears * 12)} months free`
              }</text>` : ''}`;
      }).join('')}
      <text x="${padL}" y="22" font-size="13" fill="var(--ink-3)">Cash the business makes, against what it owes</text>
    </svg>
    <div class="legend">
      <span><i style="background:var(--ink);opacity:0.85"></i>Cash it makes</span>
      <span><i style="background:var(--loss)"></i>Repayments</span>
    </div>
  </figure>`;
}

/**
 * The capital stack: where every pound of the price came from.
 *
 * Two families, because there is only one distinction that matters — money that has to be
 * repaid out of the business's cash, and money that takes a share of it instead. Tints within
 * each family separate the sources; direct labels carry the identity so hue never has to.
 */
function stackBar(tranches, need) {
  const h = 52;
  const total = Math.max(need, tranches.reduce((s, t) => s + t.amount, 0)) || 1;
  const tone = {
    cash: { fill: 'var(--ink)', opacity: 1 },
    rollover: { fill: 'var(--ink)', opacity: 0.5 },
    investor: { fill: 'var(--ink)', opacity: 0.28 },
    seller: { fill: 'var(--credibility)', opacity: 1 },
    bank: { fill: 'var(--credibility)', opacity: 0.5 },
  };

  let x = 0;
  const parts = tranches.filter((t) => t.amount > 0);
  const marks = parts.map((t) => {
    const style = tone[t.source.id] ?? tone.cash;
    const width = Math.max(0, (t.amount / total) * VB - GAP);
    const rect = `<rect class="seg-mark" x="${x.toFixed(1)}" y="0" width="${width.toFixed(1)}" height="${h}"
      fill="${style.fill}" opacity="${style.opacity}">
      <title>${esc(t.type.name)}: ${esc(money(t.amount))}</title></rect>`;
    x += (t.amount / total) * VB;
    return rect;
  }).join('');

  const gap = Math.max(0, need - parts.reduce((s, t) => s + t.amount, 0));

  return `
  <figure>
    <svg viewBox="0 0 ${VB} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px" role="img"
         aria-label="${parts.map((t) => `${t.type.name} ${money(t.amount)}`).join(', ')}">
      <defs><clipPath id="clip-${cid()}"><rect x="0" y="0" width="${VB}" height="${h}" rx="7" /></clipPath></defs>
      <g clip-path="url(#clip-${lastId})">
        <rect x="0" y="0" width="${VB}" height="${h}" fill="var(--sunken)" />
        ${marks}
      </g>
    </svg>
    <div class="legend">
      ${parts.map((t) => {
        const style = tone[t.source.id] ?? tone.cash;
        return `<span><i style="background:${style.fill};opacity:${style.opacity}"></i>${esc(t.type.name)}
          <strong style="margin-left:4px">${esc(money(t.amount))}</strong></span>`;
      }).join('')}
      ${gap > 1 ? `<span><i style="background:var(--sunken);border:1px solid var(--hair-strong)"></i>Not funded
        <strong style="margin-left:4px" class="is-critical">${esc(money(gap))}</strong></span>` : ''}
    </div>
  </figure>`;
}

/**
 * What the deal owes, year by year, against what it earns.
 *
 * The balloon sits on top of the payments in its own colour, because a year that looks
 * comfortable on instalments alone can be the year the whole thing falls over.
 */
function serviceTimeline(schedule, cash, { floor = 1.5 } = {}) {
  const rows = schedule.filter((r) => r.owed > 0 || r.year <= 8).slice(0, 10);
  const w = VB;
  const h = 300;
  const padL = 16;
  const padR = 130;
  const padTop = 40;
  const padBottom = 54;
  const max = Math.max(...rows.map((r) => r.owed), cash, 1) * 1.08;
  const slot = (w - padL - padR) / rows.length;
  const barW = Math.min(64, slot * 0.52);
  const y = (v) => padTop + (1 - v / max) * (h - padTop - padBottom);

  return `
  <figure>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img"
         aria-label="Owed each year against ${money(cash)} of cash a year">
      <line x1="${padL}" y1="${h - padBottom}" x2="${w - padR}" y2="${h - padBottom}"
            stroke="var(--hair)" stroke-width="1" />
      <line x1="${padL}" y1="${y(cash).toFixed(1)}" x2="${w - padR}" y2="${y(cash).toFixed(1)}"
            stroke="var(--ink)" stroke-width="2" />
      <text x="${w - padR + 10}" y="${(y(cash) + 4).toFixed(1)}" font-size="13" fill="var(--ink)"
            font-weight="600">${esc(moneyShort(cash))} cash</text>
      <line x1="${padL}" y1="${y(cash / floor).toFixed(1)}" x2="${w - padR}" y2="${y(cash / floor).toFixed(1)}"
            stroke="var(--ink-3)" stroke-width="1" />
      <text x="${w - padR + 10}" y="${(y(cash / floor) + 4).toFixed(1)}" font-size="12"
            fill="var(--ink-3)">most you can owe</text>
      ${rows.map((r, i) => {
        const cx = padL + slot * i + slot / 2;
        const payTop = y(r.payment);
        const owedTop = y(r.owed);
        const tight = r.payment > cash / floor;
        return `
        <rect class="seg-mark" x="${(cx - barW / 2).toFixed(1)}" y="${payTop.toFixed(1)}"
              width="${barW.toFixed(1)}" height="${Math.max(0, h - padBottom - payTop).toFixed(1)}" rx="4"
              fill="${tight ? 'var(--critical)' : 'var(--credibility)'}" opacity="0.9">
          <title>Year ${r.year} payments: ${esc(money(r.payment))}</title></rect>
        ${r.balloon > 0 ? `
          <rect class="seg-mark" x="${(cx - barW / 2).toFixed(1)}" y="${owedTop.toFixed(1)}"
                width="${barW.toFixed(1)}" height="${Math.max(0, payTop - owedTop - 2).toFixed(1)}" rx="4"
                fill="var(--critical)">
            <title>Year ${r.year} lump due: ${esc(money(r.balloon))}</title></rect>
          <text x="${cx.toFixed(1)}" y="${(owedTop - 8).toFixed(1)}" text-anchor="middle" font-size="12"
                font-weight="600" fill="var(--critical)">${esc(moneyShort(r.balloon))} due</text>` : ''}
        <text x="${cx.toFixed(1)}" y="${h - padBottom + 22}" text-anchor="middle" font-size="12.5"
              fill="var(--ink-3)">Yr ${r.year}</text>`;
      }).join('')}
    </svg>
    <div class="legend">
      <span><i style="background:var(--credibility);opacity:0.9"></i>Payments</span>
      <span><i style="background:var(--critical)"></i>Lump due at the end</span>
    </div>
  </figure>`;
}

/**
 * How cover gets from where it is to where it has to be.
 *
 * A waterfall, because the question is never "what is the number" but "which of these six
 * things moved it". Each action floats from where the last one left off; the floor is drawn
 * across so the moment it clears is visible rather than calculated.
 */
function coverWaterfall(steps, floor) {
  const w = VB;
  const h = 340;
  const padL = 20;
  const padR = 90;
  const padTop = 44;
  const padBottom = 76;
  const covers = steps.map((s) => (isFinite(s.cover) ? s.cover : floor * 3));
  const max = Math.max(...covers, floor * 1.4) * 1.12;
  const slot = (w - padL - padR) / steps.length;
  const barW = Math.min(96, slot * 0.56);
  const y = (v) => padTop + (1 - bound(v, 0, max) / max) * (h - padTop - padBottom);

  return `
  <figure>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img"
         aria-label="Cover from ${turns(covers[0])} to ${turns(covers[covers.length - 1])} against a floor of ${turns(floor)}">
      <line x1="${padL}" y1="${h - padBottom}" x2="${w - padR}" y2="${h - padBottom}"
            stroke="var(--hair)" stroke-width="1" />
      <line x1="${padL}" y1="${y(floor).toFixed(1)}" x2="${w - padR}" y2="${y(floor).toFixed(1)}"
            stroke="var(--ink)" stroke-width="2" />
      <text x="${w - padR + 10}" y="${(y(floor) + 4).toFixed(1)}" font-size="13" font-weight="600"
            fill="var(--ink)">${esc(turns(floor))}</text>
      <text x="${w - padR + 10}" y="${(y(floor) + 21).toFixed(1)}" font-size="12"
            fill="var(--ink-3)">the floor</text>

      ${steps.map((s, i) => {
        const cx = padL + slot * i + slot / 2;
        const value = covers[i];
        const prev = i === 0 ? 0 : covers[i - 1];
        const isEdge = i === 0 || i === steps.length - 1;
        const top = y(Math.max(value, isEdge ? 0 : prev));
        const bottom = y(isEdge ? 0 : Math.min(value, prev));
        const rising = value >= prev;
        const fill = isEdge
          ? (value >= floor ? 'var(--good)' : 'var(--critical)')
          : (rising ? 'var(--good)' : 'var(--critical)');
        return `
        ${i > 0 ? `<line x1="${(padL + slot * (i - 1) + slot / 2 + barW / 2).toFixed(1)}" y1="${y(prev).toFixed(1)}"
              x2="${(cx - barW / 2).toFixed(1)}" y2="${y(prev).toFixed(1)}"
              stroke="var(--hair-strong)" stroke-width="1" />` : ''}
        <rect class="seg-mark" x="${(cx - barW / 2).toFixed(1)}" y="${top.toFixed(1)}"
              width="${barW.toFixed(1)}" height="${Math.max(3, bottom - top).toFixed(1)}" rx="4"
              fill="${fill}" opacity="${isEdge ? 0.9 : 0.7}">
          <title>${esc(s.name)}: cover ${esc(turns(value))}</title></rect>
        ${wrapLabel(esc(s.name), cx, h - padBottom + 22, 15)}`;
      }).join('')}
      ${/* Labels last and haloed, so a value sitting on the floor line still reads. */ ''}
      ${steps.map((s, i) => {
        const cx = padL + slot * i + slot / 2;
        const value = covers[i];
        const prev = i === 0 ? 0 : covers[i - 1];
        const isEdge = i === 0 || i === steps.length - 1;
        const top = y(Math.max(value, isEdge ? 0 : prev));
        return `<text x="${cx.toFixed(1)}" y="${(top - 11).toFixed(1)}" text-anchor="middle" font-size="15"
          font-weight="700" fill="var(--ink)" stroke="var(--paper)" stroke-width="4"
          paint-order="stroke">${esc(turns(value))}</text>`;
      }).join('')}
    </svg>
  </figure>`;
}

/** Two short lines of centred label under a column, because names do not fit on one. */
function wrapLabel(text, cx, y, perLine) {
  const words = String(text).split(' ');
  const lines = [];
  let line = '';
  for (const word of words) {
    if ((line + ' ' + word).trim().length > perLine && line) { lines.push(line); line = word; }
    else line = (line + ' ' + word).trim();
    if (lines.length === 2) break;
  }
  if (line && lines.length < 2) lines.push(line);
  return lines.map((l, i) => `<text x="${cx.toFixed(1)}" y="${y + i * 16}" text-anchor="middle"
    font-size="12" fill="var(--ink-3)">${l}</text>`).join('');
}

/**
 * Before and after, side by side, at a size you can present from.
 * One row per measure so the eye travels across rather than hunting.
 */
function beforeAfter(rows, { beforeLabel = 'As it stands', afterLabel = 'After' } = {}) {
  return `
  <div class="ba">
    <div class="ba-head">
      <span></span>
      <span class="ba-col before">${esc(beforeLabel)}</span>
      <span class="ba-col after">${esc(afterLabel)}</span>
    </div>
    ${rows.map((r) => `
      <div class="ba-row">
        <span class="ba-key">${esc(r.label)}</span>
        <span class="ba-val before ${r.beforeBad ? 'is-critical' : ''}">${r.before}</span>
        <span class="ba-val after ${r.afterGood ? 'is-good' : ''}">${r.after}</span>
      </div>`).join('')}
  </div>`;
}

/**
 * How the three questions combine.
 *
 * Credibility and Closing multiply — one sets the profit, the other sets what is paid per
 * pound of it — and Capital is not a third multiplier but a gate on the answer. That is why
 * a business can be worth a number nobody can pay, and drawing it is the fastest way to see
 * that the three are not three of the same thing.
 */
function threeCMechanism() {
  const w = 1000;
  const h = 420;
  const boxW = 250;
  const boxH = 96;
  const leftX = 60;
  const rightX = w - 60 - boxW;
  const topY = 52;
  const midY = 212;
  const gateY = 316;
  const cx = w / 2;

  const pillar = (x, hue, name, question, role, sub) => `
    <rect x="${x}" y="${topY}" width="${boxW}" height="${boxH}" rx="14"
          fill="none" stroke="${hue}" stroke-width="2" />
    <text x="${x + 18}" y="${topY + 27}" font-size="13" font-weight="700" fill="${hue}"
          letter-spacing="1">${esc(name.toUpperCase())}</text>
    <text x="${x + 18}" y="${topY + 51}" font-size="15" fill="currentColor">${esc(question)}</text>
    <text x="${x + 18}" y="${topY + 75}" font-size="13" fill="currentColor" opacity="0.6">${esc(role)}</text>
    <text x="${x + boxW / 2}" y="${topY + boxH + 26}" text-anchor="middle" font-size="13"
          fill="currentColor" opacity="0.6">${esc(sub)}</text>`;

  return `
  <figure>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;color:var(--ink)" role="img"
         aria-label="Credibility sets the profit and Closing sets the price per pound; the two multiply to give what the business is worth, and Capital gates whether that price can be paid.">
      <defs>
        <marker id="mech-arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor" opacity="0.55" />
        </marker>
      </defs>

      ${pillar(leftX, 'var(--credibility)', 'Credibility', 'Can the numbers be believed?', 'Sets the profit', 'what you actually earn')}
      ${pillar(rightX, 'var(--closing)', 'Closing', 'Can the deal complete?', 'Sets the price per pound', 'what a buyer will pay for it')}

      <text x="${cx}" y="${topY + boxH / 2 + 8}" text-anchor="middle" font-size="30"
            font-weight="600" fill="currentColor" opacity="0.45">×</text>

      <line x1="${leftX + boxW / 2}" y1="${topY + boxH + 40}" x2="${leftX + boxW / 2}" y2="${midY - 22}"
            stroke="currentColor" stroke-width="1.5" opacity="0.4" />
      <line x1="${rightX + boxW / 2}" y1="${topY + boxH + 40}" x2="${rightX + boxW / 2}" y2="${midY - 22}"
            stroke="currentColor" stroke-width="1.5" opacity="0.4" />
      <line x1="${leftX + boxW / 2}" y1="${midY - 22}" x2="${rightX + boxW / 2}" y2="${midY - 22}"
            stroke="currentColor" stroke-width="1.5" opacity="0.4" />
      <line x1="${cx}" y1="${midY - 22}" x2="${cx}" y2="${midY - 4}"
            stroke="currentColor" stroke-width="1.5" opacity="0.55" marker-end="url(#mech-arrow)" />

      <rect x="${cx - 110}" y="${midY}" width="220" height="52" rx="12" fill="currentColor" />
      <text x="${cx}" y="${midY + 33}" text-anchor="middle" font-size="18" font-weight="600"
            fill="var(--paper)">What it is worth</text>

      <line x1="${cx}" y1="${midY + 52}" x2="${cx}" y2="${gateY - 4}"
            stroke="currentColor" stroke-width="1.5" opacity="0.55" marker-end="url(#mech-arrow)" />

      <rect x="${cx - 190}" y="${gateY}" width="380" height="64" rx="14"
            fill="none" stroke="var(--capital)" stroke-width="2" />
      <text x="${cx - 172}" y="${gateY + 26}" font-size="13" font-weight="700" fill="var(--capital)"
            letter-spacing="1">CAPITAL</text>
      <text x="${cx - 172}" y="${gateY + 50}" font-size="15" fill="currentColor">Can anyone afford to pay that?</text>

      <text x="${cx + 210}" y="${gateY + 26}" font-size="13" fill="currentColor" opacity="0.6">Yes —</text>
      <text x="${cx + 210}" y="${gateY + 44}" font-size="13" fill="currentColor" opacity="0.6">that is the price.</text>
      <text x="${cx - 210}" y="${gateY + 26}" text-anchor="end" font-size="13" fill="var(--critical)">No —</text>
      <text x="${cx - 210}" y="${gateY + 44}" text-anchor="end" font-size="13" fill="var(--critical)">it is unpayable.</text>
    </svg>
    <figcaption>Two of the three multiply; the third is a gate, not a multiplier. That is why a
      business can be worth a number nobody is able to pay — and why the answer to that is a
      different structure rather than a lower price.</figcaption>
  </figure>`;
}
