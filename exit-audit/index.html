<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Work out what a business is really worth, what it would take to be worth more, and what buying others alongside it does over twenty years." />
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>Exit Audit</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

/*
 * One typeface, many weights. Hue is reserved entirely for data — the three pillars
 * own blue, orange and aqua, status owns red/green/amber, and every piece of interface
 * chrome is ink on paper. A button that competed with a pillar colour would make the
 * diagram harder to read, which is the only thing on the page that matters.
 *
 * Palette steps come from the validated categorical set; the dark column is the same
 * hues re-stepped for the dark surface, not an inversion.
 */

:root {
  color-scheme: light;
  --paper: #fcfcfb;
  --raised: #ffffff;
  --sunken: #f4f3f0;
  --hair: #e3e2dd;
  --hair-strong: #cfcec8;
  --ink: #14140f;
  --ink-2: #52514e;
  --ink-3: #86847d;

  --credibility: #2a78d6;
  --capital: #eb6834;
  --closing: #1baf7a;

  --critical: #d03b3b;
  --good: #0ca30c;
  --warning: #fab219;
  --loss: #d8a7a3;

  --sans: "Instrument Sans", ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  --shadow: 0 1px 2px rgba(20, 20, 15, 0.05), 0 8px 24px rgba(20, 20, 15, 0.04);
  --step: clamp(56px, 7vw, 88px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #1a1a19;
    --raised: #222221;
    --sunken: #131312;
    --hair: #33332f;
    --hair-strong: #46453f;
    --ink: #f5f4f0;
    --ink-2: #c3c2b7;
    --ink-3: #8b8a81;

    --credibility: #3987e5;
    --capital: #d95926;
    --closing: #199e70;

    --critical: #d03b3b;
    --good: #0ca30c;
    --warning: #fab219;
    --loss: #8a5450;

    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #1a1a19;
  --raised: #222221;
  --sunken: #131312;
  --hair: #33332f;
  --hair-strong: #46453f;
  --ink: #f5f4f0;
  --ink-2: #c3c2b7;
  --ink-3: #8b8a81;

  --credibility: #3987e5;
  --capital: #d95926;
  --closing: #199e70;

  --critical: #d03b3b;
  --good: #0ca30c;
  --warning: #fab219;
  --loss: #8a5450;

  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.3);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}

:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 3px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ── Chrome ─────────────────────────────────────────────────────────────── */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 28px;
  padding: 0 clamp(20px, 4vw, 48px);
  height: 60px;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: saturate(180%) blur(16px);
  border-bottom: 1px solid var(--hair);
}
.mark { font-weight: 600; letter-spacing: -0.02em; font-size: 16px; white-space: nowrap; }
.tabs { display: flex; gap: 2px; margin-left: auto; }
.tabs a, .tabs button {
  font: inherit; font-size: 14px; font-weight: 500; background: none; border: 0; cursor: pointer;
  color: var(--ink-3); text-decoration: none; padding: 6px 12px; border-radius: 100px;
  transition: color 140ms ease, background 140ms ease;
}
.tabs a:hover, .tabs button:hover { color: var(--ink); background: var(--sunken); }
.tabs a.on { color: var(--ink); background: var(--sunken); font-weight: 600; }
.tabs .sep { width: 1px; background: var(--hair); margin: 8px 10px; }

.page { max-width: 1080px; margin: 0 auto; padding: clamp(36px, 6vw, 72px) clamp(20px, 4vw, 48px) 200px; }
section { margin-bottom: var(--step); }
section:last-child { margin-bottom: 0; }

/* ── Type ───────────────────────────────────────────────────────────────── */
.display {
  font-size: clamp(34px, 5.2vw, 54px); line-height: 1.05; font-weight: 600;
  letter-spacing: -0.035em; margin: 0 0 16px; text-wrap: balance; max-width: 20ch;
}
.headline {
  font-size: clamp(24px, 3vw, 32px); line-height: 1.15; font-weight: 600;
  letter-spacing: -0.028em; margin: 0 0 12px; text-wrap: balance;
}
.eyebrow {
  font-size: 12px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--ink-3); margin: 0 0 14px;
}
.lede { font-size: 18px; line-height: 1.5; color: var(--ink-2); max-width: 58ch; margin: 0 0 28px; }
.body { color: var(--ink-2); max-width: 62ch; }
.small { font-size: 13.5px; line-height: 1.5; color: var(--ink-3); max-width: 62ch; }
.tight { margin-bottom: 8px; }
strong { font-weight: 600; color: var(--ink); }

/* ── Hero figure ────────────────────────────────────────────────────────── */
.figure { font-weight: 600; letter-spacing: -0.045em; line-height: 1; }
.figure.xl { font-size: clamp(56px, 10vw, 108px); }
.figure.lg { font-size: clamp(34px, 4.4vw, 48px); }
.figure.md { font-size: 28px; }

/* ── Cards & grids ──────────────────────────────────────────────────────── */
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

.card { background: var(--raised); border: 1px solid var(--hair); border-radius: 14px; padding: 22px 24px; }
.card.quiet { background: none; border-color: transparent; padding: 0; }
.tile { background: var(--raised); border: 1px solid var(--hair); border-radius: 14px; padding: 18px 20px; }
.tile .k { font-size: 12px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-3); }
.tile .v { font-size: 26px; font-weight: 600; letter-spacing: -0.03em; margin-top: 8px; }
.tile .s { font-size: 13px; color: var(--ink-3); margin-top: 4px; }
.tile.flag-critical { border-color: color-mix(in srgb, var(--critical) 45%, var(--hair)); }
.tile.flag-good { border-color: color-mix(in srgb, var(--good) 40%, var(--hair)); }

/* ── Pillars ────────────────────────────────────────────────────────────── */
.pillar { --hue: var(--credibility); }
.pillar[data-pillar="capital"] { --hue: var(--capital); }
.pillar[data-pillar="closing"] { --hue: var(--closing); }

.pillar-card {
  background: var(--raised); border: 1px solid var(--hair); border-radius: 16px;
  padding: 22px 24px; display: flex; flex-direction: column; gap: 14px;
}
.pillar-name {
  display: flex; align-items: center; gap: 9px;
  font-size: 17px; font-weight: 600; letter-spacing: -0.02em;
}
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--hue); flex: none; }
.pillar-q { font-size: 14px; color: var(--ink-2); min-height: 42px; }
.pillar-cost { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }

/* ── Accordion ──────────────────────────────────────────────────────────── */
.fold { border-top: 1px solid var(--hair); }
.fold:last-of-type { border-bottom: 1px solid var(--hair); }
.fold-head {
  width: 100%; display: flex; align-items: center; gap: 14px; text-align: left;
  background: none; border: 0; cursor: pointer; font: inherit; color: var(--ink);
  padding: 22px 4px;
}
.fold-head:hover { background: none; }
.fold-title { font-size: 20px; font-weight: 600; letter-spacing: -0.022em; }
.fold-meta { margin-left: auto; display: flex; align-items: center; gap: 16px; font-size: 14px; color: var(--ink-3); }
.chev { width: 11px; height: 11px; border-right: 1.8px solid var(--ink-3); border-bottom: 1.8px solid var(--ink-3);
  transform: rotate(45deg); transition: transform 200ms ease; flex: none; margin-top: -4px; }
.fold[data-open="true"] .chev { transform: rotate(-135deg); margin-top: 3px; }
.fold-body { padding: 0 4px 30px; display: flex; flex-direction: column; gap: 4px; }

/* ── Criterion ──────────────────────────────────────────────────────────── */
.crit { padding: 18px 0; border-top: 1px solid var(--hair); display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; align-items: start; }
.crit:first-child { border-top: 0; }
.crit-name { font-size: 15.5px; font-weight: 600; letter-spacing: -0.015em; }
.crit-q { font-size: 14px; color: var(--ink-2); margin-top: 3px; }
.crit-anchor { font-size: 13.5px; color: var(--ink-3); margin-top: 9px; max-width: 58ch; }
.crit-delta { font-size: 12px; color: var(--ink-3); margin-top: 7px; font-variant-numeric: tabular-nums; }

.segs { display: flex; gap: 3px; }
.segs button {
  flex: 1; height: 34px; border-radius: 6px; border: 1px solid var(--hair-strong);
  background: var(--raised); color: var(--ink-3); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  transition: background 130ms ease, color 130ms ease, border-color 130ms ease;
}
.segs button:hover { border-color: var(--ink-3); color: var(--ink); }
.segs button.on { background: var(--hue, var(--ink)); border-color: var(--hue, var(--ink)); color: #fff; }

/* ── Controls ───────────────────────────────────────────────────────────── */
label { display: block; font-size: 13px; font-weight: 500; color: var(--ink-2); margin-bottom: 6px; }
input, select {
  width: 100%; font: inherit; font-size: 15px; color: var(--ink);
  background: var(--raised); border: 1px solid var(--hair-strong); border-radius: 9px;
  padding: 10px 12px; font-variant-numeric: tabular-nums;
  transition: border-color 130ms ease, box-shadow 130ms ease;
}
input:focus, select:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 10%, transparent); }
input.big { font-size: 32px; font-weight: 600; letter-spacing: -0.03em; padding: 14px 16px; }
.field { min-width: 0; }
.hint { font-size: 12.5px; color: var(--ink-3); margin-top: 6px; line-height: 1.45; }

.btn {
  font: inherit; font-size: 14.5px; font-weight: 600; cursor: pointer;
  background: var(--ink); color: var(--paper); border: 1px solid var(--ink);
  border-radius: 100px; padding: 10px 20px;
  transition: opacity 130ms ease, background 130ms ease, color 130ms ease;
}
.btn:hover { opacity: 0.86; }
.btn.quiet { background: none; color: var(--ink); border-color: var(--hair-strong); }
.btn.quiet:hover { background: var(--sunken); opacity: 1; }
.btn.tiny { font-size: 12.5px; padding: 5px 12px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.switch { display: flex; align-items: center; gap: 11px; font-size: 14.5px; color: var(--ink-2); cursor: pointer; }
.switch input { width: auto; margin: 0; accent-color: var(--ink); }

/* ── Sticky summary ─────────────────────────────────────────────────────── */
.dock {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 30;
  display: flex; align-items: center; gap: 22px;
  background: color-mix(in srgb, var(--raised) 92%, transparent);
  backdrop-filter: saturate(180%) blur(18px);
  border: 1px solid var(--hair); border-radius: 100px; box-shadow: var(--shadow);
  padding: 10px 12px 10px 24px; max-width: calc(100vw - 32px);
}
.dock-item { display: flex; flex-direction: column; line-height: 1.15; }
.dock-item .k { font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.dock-item .v { font-size: 17px; font-weight: 600; letter-spacing: -0.025em; white-space: nowrap; }
.dock .rule { width: 1px; align-self: stretch; background: var(--hair); }

/* ── Tables ─────────────────────────────────────────────────────────────── */
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th {
  text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink-3); padding: 0 12px 10px; border-bottom: 1px solid var(--hair); white-space: nowrap;
}
td { padding: 13px 12px; border-bottom: 1px solid var(--hair); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td:first-child, th:first-child { padding-left: 0; }
td:last-child, th:last-child { padding-right: 0; }
.row-total td { font-weight: 600; color: var(--ink); border-top: 1px solid var(--hair-strong); }

/* ── Semantics ──────────────────────────────────────────────────────────── */
.is-critical { color: var(--critical); }
.is-good { color: var(--good); }
.muted { color: var(--ink-3); }
.mono { font-family: var(--mono); font-size: 0.92em; }

.badge {
  display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600;
  letter-spacing: 0.04em; padding: 3px 10px; border-radius: 100px;
  background: var(--sunken); color: var(--ink-2); border: 1px solid var(--hair);
}
.badge.critical { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 40%, var(--hair)); background: color-mix(in srgb, var(--critical) 8%, transparent); }
.badge.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, var(--hair)); background: color-mix(in srgb, var(--good) 8%, transparent); }
.badge.warning { color: color-mix(in srgb, var(--warning) 78%, var(--ink)); border-color: color-mix(in srgb, var(--warning) 50%, var(--hair)); background: color-mix(in srgb, var(--warning) 12%, transparent); }

.note {
  border-left: 2px solid var(--hair-strong); padding: 2px 0 2px 18px;
  color: var(--ink-2); max-width: 62ch;
}
.note.critical { border-left-color: var(--critical); }
.note.good { border-left-color: var(--good); }

/* ── Charts ─────────────────────────────────────────────────────────────── */
figure { margin: 0; }
figcaption { font-size: 13px; color: var(--ink-3); margin-top: 12px; max-width: 62ch; }
svg { display: block; max-width: 100%; }
svg text { font-family: var(--sans); font-variant-numeric: tabular-nums; }
.seg-mark { transition: opacity 130ms ease; }
.seg-mark:hover { opacity: 0.72; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 14px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* ── Utility ────────────────────────────────────────────────────────────── */
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.between { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.divider { height: 1px; background: var(--hair); border: 0; margin: 0; }

@media print {
  .topbar, .dock, .actions { display: none !important; }
  body { background: #fff; color: #000; }
  .card, .tile, .pillar-card { border-color: #ddd; box-shadow: none; break-inside: avoid; }
}

@media (max-width: 860px) {
  .g3, .g4, .g2 { grid-template-columns: minmax(0, 1fr); }
  .crit { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .topbar { gap: 12px; height: auto; padding: 10px 16px; flex-wrap: wrap; }
  .tabs { margin-left: 0; flex-wrap: wrap; }
  .dock { gap: 14px; padding: 9px 10px 9px 16px; }
  .dock-item .v { font-size: 15px; }
}

/* ── Group canvas ───────────────────────────────────────────────────────── */
.canvas {
  position: relative;
  aspect-ratio: 16 / 10;
  min-height: 380px;
  border: 1px solid var(--hair);
  border-radius: 18px;
  background:
    radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--ink) 4%, transparent), transparent 62%),
    var(--sunken);
  overflow: hidden;
  touch-action: none;
  user-select: none;
}
.canvas-web { position: absolute; inset: 0; width: 100%; height: 100%; }

.ghub, .gnode {
  position: absolute;
  transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; border-radius: 14px;
}

.ghub {
  left: 50%; top: 50%;
  width: 25%; min-width: 148px; padding: 16px 12px;
  background: var(--ink); color: var(--paper);
  box-shadow: 0 8px 30px color-mix(in srgb, var(--ink) 22%, transparent);
  gap: 2px; z-index: 3;
}
.ghub-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.65; }
.ghub-profit { font-size: 26px; font-weight: 700; letter-spacing: -0.035em; }
.ghub-meta { font-size: 11.5px; opacity: 0.7; }

.gnode {
  width: 19%; min-width: 116px; padding: 11px 10px; gap: 2px; z-index: 2;
  background: var(--raised); border: 1px solid var(--hair-strong);
  box-shadow: var(--shadow); cursor: grab;
  transition: border-color 130ms ease, box-shadow 130ms ease, transform 90ms ease;
}
.gnode:hover { border-color: var(--ink-3); }
.gnode:active { cursor: grabbing; }
.gnode.on { border-color: var(--ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 12%, transparent), var(--shadow); }
.gnode.warn { border-color: color-mix(in srgb, var(--critical) 55%, var(--hair)); }
.gnode.dragging { z-index: 5; transform: translate(-50%, -50%) scale(1.04); }
.gnode-industry { font-size: 11.5px; font-weight: 600; color: var(--ink-2); line-height: 1.25; }
.gnode-profit { font-size: 20px; font-weight: 700; letter-spacing: -0.03em; }
.gnode-meta { font-size: 10.5px; color: var(--ink-3); }
.gnode-cover { font-size: 10.5px; font-weight: 600; }
.gnode-cover.ok { color: var(--good); }
.gnode-cover.bad { color: var(--critical); }

.canvas-empty {
  position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%);
  color: var(--ink-3); font-size: 14px; text-align: center;
}
.canvas-empty p { margin: 0; }

/* ── Tray ───────────────────────────────────────────────────────────────── */
.tray { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.tray-card {
  display: flex; flex-direction: column; gap: 3px; text-align: left;
  font: inherit; cursor: pointer; padding: 13px 15px; border-radius: 12px;
  background: var(--raised); border: 1px solid var(--hair); color: var(--ink);
  transition: border-color 130ms ease, transform 90ms ease;
}
.tray-card:hover { border-color: var(--ink-3); transform: translateY(-1px); }
.tray-name { font-size: 14.5px; font-weight: 600; letter-spacing: -0.015em; }
.tray-eg { font-size: 12px; color: var(--ink-3); }
.tray-mult { font-size: 11.5px; color: var(--ink-2); margin-top: 3px; font-variant-numeric: tabular-nums; }

/* ── Inspector ──────────────────────────────────────────────────────────── */
.inspector { background: var(--raised); border: 1px solid var(--hair); border-radius: 14px; padding: 20px 22px; }
.choices { display: grid; gap: 8px; }
.choice {
  display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 11px;
  border: 1px solid var(--hair); background: var(--paper); cursor: pointer; text-align: left;
  font: inherit; color: var(--ink); width: 100%;
  transition: border-color 130ms ease, background 130ms ease;
}
.choice:hover { border-color: var(--ink-3); }
.choice.on { border-color: var(--ink); background: var(--sunken); }
.choice-mark {
  width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--hair-strong);
  flex: none; margin-top: 2px; position: relative;
}
.choice.on .choice-mark { border-color: var(--ink); background: var(--ink); }
.choice.on .choice-mark::after {
  content: ''; position: absolute; inset: 4px; border-radius: 50%; background: var(--paper);
}
.choice-body { min-width: 0; }
.choice-name { font-size: 14.5px; font-weight: 600; letter-spacing: -0.015em; }
.choice-plain { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.choice-tag { font-size: 11.5px; color: var(--ink-3); margin-top: 5px; font-variant-numeric: tabular-nums; }

/* ── Big statement ──────────────────────────────────────────────────────── */
.statement {
  font-size: clamp(22px, 3vw, 30px); line-height: 1.25; font-weight: 500;
  letter-spacing: -0.025em; max-width: 24ch; text-wrap: balance; margin: 0;
}
.statement em { font-style: normal; color: var(--critical); }
.statement .up { color: var(--credibility); }

@media (max-width: 860px) {
  .canvas { aspect-ratio: 3 / 4; min-height: 460px; }
  .ghub { width: 42%; }
  .gnode { width: 34%; }
}

/* ── The difference ─────────────────────────────────────────────────────── */
.race {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px; align-items: end; margin-bottom: 8px;
}
.race-side .k {
  font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 8px;
}
.race-side .v {
  font-size: clamp(34px, 6vw, 64px); font-weight: 700; letter-spacing: -0.045em;
  line-height: 1; font-variant-numeric: tabular-nums;
}
.race-side.group .v { color: var(--credibility); }
.race-side .s { font-size: 13.5px; color: var(--ink-3); margin-top: 8px; }

.multiplier {
  display: inline-flex; align-items: baseline; gap: 8px;
  background: var(--ink); color: var(--paper);
  border-radius: 100px; padding: 8px 20px; margin: 4px 0 8px;
}
.multiplier b { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.multiplier span { font-size: 13.5px; opacity: 0.75; }

.scrub { display: flex; align-items: center; gap: 16px; margin: 26px 0 8px; }
.scrub input[type="range"] {
  flex: 1; -webkit-appearance: none; appearance: none; height: 6px; padding: 0;
  border: 0; border-radius: 3px; background: var(--hair); cursor: pointer;
}
.scrub input[type="range"]:focus { box-shadow: none; }
.scrub input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%;
  background: var(--ink); border: 3px solid var(--paper); box-shadow: var(--shadow); cursor: grab;
}
.scrub input[type="range"]::-moz-range-thumb {
  width: 22px; height: 22px; border-radius: 50%; background: var(--ink);
  border: 3px solid var(--paper); box-shadow: var(--shadow); cursor: grab;
}
.scrub-year {
  font-size: 14px; font-weight: 600; color: var(--ink-2); min-width: 74px;
  font-variant-numeric: tabular-nums;
}
.play {
  width: 46px; height: 46px; border-radius: 50%; flex: none; padding: 0;
  display: grid; place-items: center; font-size: 15px;
}

.chips { display: flex; flex-wrap: wrap; gap: 7px; min-height: 34px; }
.chip {
  font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 100px;
  background: color-mix(in srgb, var(--credibility) 12%, transparent);
  color: var(--credibility); border: 1px solid color-mix(in srgb, var(--credibility) 35%, transparent);
  animation: pop 260ms cubic-bezier(0.34, 1.4, 0.64, 1);
}
.chip.self { background: var(--sunken); color: var(--ink-2); border-color: var(--hair-strong); }
@keyframes pop { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .chip { animation: none; } }

@media (max-width: 720px) {
  .race { grid-template-columns: minmax(0, 1fr); gap: 26px; }
}

/* ── Cases ──────────────────────────────────────────────────────────────── */
.case-card {
  background: var(--raised); border: 1px solid var(--hair); border-radius: 14px;
  padding: 20px 22px; display: flex; flex-direction: column; gap: 16px;
}
.case-card.on { border-color: var(--ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 8%, transparent); }
.case-name {
  font-size: 18px; font-weight: 600; letter-spacing: -0.02em; padding: 4px 8px; margin-left: -8px;
  background: none; border: 1px solid transparent; border-radius: 7px; width: auto; flex: 1; min-width: 0;
}
.case-name:hover { border-color: var(--hair); }
.case-figs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.case-figs > div { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.case-figs .k { font-size: 10.5px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-3); }
.case-figs .v { font-size: 18px; font-weight: 600; letter-spacing: -0.025em; }

.case-chip {
  display: inline-flex; align-items: center; gap: 8px; font: inherit; font-size: 13.5px; font-weight: 600;
  background: var(--sunken); border: 1px solid var(--hair); color: var(--ink);
  border-radius: 100px; padding: 5px 14px; cursor: pointer; text-decoration: none;
  max-width: 240px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: border-color 130ms ease;
}
.case-chip:hover { border-color: var(--ink-3); }
.case-chip .dot { background: var(--good); }

@media (max-width: 860px) {
  .case-figs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .case-chip { max-width: 150px; }
}

.tray-card.scenario { gap: 6px; padding: 16px 18px; }
.tray-card.scenario .tray-name { font-size: 15px; line-height: 1.35; font-weight: 600; }
.tray-card.scenario .tray-eg { font-size: 13px; line-height: 1.4; }

/* ── Before and after ───────────────────────────────────────────────────── */
.ba { border: 1px solid var(--hair); border-radius: 14px; overflow: hidden; background: var(--raised); }
.ba-head, .ba-row {
  display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1fr);
  gap: 16px; align-items: baseline; padding: 14px 22px;
}
.ba-head { border-bottom: 1px solid var(--hair); background: var(--sunken); padding-top: 12px; padding-bottom: 12px; }
.ba-col { font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3); }
.ba-col.after { color: var(--credibility); }
.ba-row { border-bottom: 1px solid var(--hair); }
.ba-row:last-child { border-bottom: 0; }
.ba-key { font-size: 14px; color: var(--ink-2); }
.ba-val { font-size: 20px; font-weight: 600; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }
.ba-val.before { color: var(--ink-3); }
.ba-val.after { color: var(--ink); }

/* ── Levers ─────────────────────────────────────────────────────────────── */
.lever {
  border: 1px solid var(--hair); border-radius: 14px; background: var(--raised);
  padding: 18px 20px; display: flex; flex-direction: column; gap: 12px;
  transition: border-color 130ms ease, background 130ms ease;
}
.lever.on { border-color: var(--ink); background: var(--sunken); }
.lever-head { display: flex; gap: 13px; align-items: flex-start; cursor: pointer; }
.lever-name { font-size: 15.5px; font-weight: 600; letter-spacing: -0.015em; }
.lever-plain { font-size: 13.5px; color: var(--ink-2); margin-top: 3px; }
.lever-detail { font-size: 12.5px; color: var(--ink-3); margin-top: 6px; }
.lever-effect { font-size: 13px; font-weight: 600; margin-left: auto; white-space: nowrap; }
.lever-params { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

@media (max-width: 720px) {
  .ba-head, .ba-row { grid-template-columns: minmax(0, 1fr); gap: 4px; padding: 12px 16px; }
  .ba-head { display: none; }
  .ba-val::before { content: attr(data-label); }
  .lever-params { grid-template-columns: minmax(0, 1fr); }
}

/* ── Worked examples ────────────────────────────────────────────────────── */
.example { position: relative; padding-top: 12px; border-top: 1px solid var(--hair); }
.example:first-of-type { border-top: 0; }
.example-mark {
  font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: var(--ink-3);
  margin-bottom: 14px;
}
.example .headline { font-family: inherit; font-style: normal; }

@media print {
  .topbar, .dock, .actions { display: none !important; }
}
</style>

<script type="module">
// ── src/data/criteria.js ────────────────────────────────────────
/**
 * Sell-side audit criteria bank — v0.1
 *
 * Three pillars, recast from the buy-side 3C framework:
 *   Credibility — can your NUMBERS be believed?
 *   Capital     — is your ASKING PRICE financeable?
 *   Closing     — can YOUR deal actually complete?
 *
 * Every criterion carries one of three impacts:
 *   { kind: 'ebitda',   maxHaircut }  fraction of claimed EBITDA removed at score 1
 *   { kind: 'multiple', maxPenalty }  turns of multiple removed at score 1
 *   { kind: 'computed' }              scored by arithmetic from intake, not self-assessed
 *
 * Self-scored criteria apply their impact proportionally: (5 - score) / 4.
 * Score 5 = no impact. Score 1 = full impact.
 *
 * `why` is the justification column. Josh reviews these, not the criteria.
 * Anything marked provisional: true has NOT been signed off yet.
 */

const PILLARS = {
  credibility: {
    id: 'credibility',
    name: 'Credibility',
    buySide: 'Can you be believed?',
    sellSide: 'Can your numbers be believed?',
    groupSide: 'Can the group’s numbers be believed?',
    short: 'Believable',
    blurb:
      'Every pound of claimed profit that will not survive an accountant going through the books. ' +
      'This is where the profit gets cut, not the price.',
  },
  capital: {
    id: 'capital',
    name: 'Capital',
    buySide: 'Can you fund it?',
    sellSide: 'Can anyone afford to pay it?',
    groupSide: 'Can the group carry what it owes?',
    short: 'Payable',
    blurb:
      'Somebody has to make the repayments on whatever you sell for out of what the business ' +
      'earns. If the cash cannot carry it, the price is not ambitious — it is unpayable.',
  },
  closing: {
    id: 'closing',
    name: 'Closing',
    buySide: 'Can you complete?',
    sellSide: 'Can your deal complete?',
    groupSide: 'Does it hold together once it has?',
    short: 'Completable',
    blurb:
      'Everything that kills a deal between heads of terms and completion: dependency, ' +
      'concentration, assignability, licences, people.',
  },
};

/** Scale used by every self-scored criterion. */
const SCORE_SCALE = [1, 2, 3, 4, 5];

/** Combined EBITDA haircut is capped here regardless of scores. */
const MAX_COMBINED_EBITDA_HAIRCUT = 0.5;

/** No business is priced below this, however badly it scores. */
const MULTIPLE_FLOOR = 2.0;

const CRITERIA = [
  // ── CREDIBILITY ───────────────────────────────────────────────────────────
  {
    id: 'C1',
    pillar: 'credibility',
    name: 'Owner salary add-back',
    question: 'Is your own pay added back to the profit, and would a buyer have to replace you?',
    impact: { kind: 'computed', target: 'ebitda', cap: 0.4 },
    computedNote:
      'Not self-scored. Haircut = market cost of replacing the owner, less any owner pay still ' +
      'still shown as a cost. Capped at 40% of the profit you are claiming.',
    anchors: {
      1: 'Full salary added back and the owner is in delivery daily — the buyer inherits a vacancy, not a profit.',
      3: 'Partial add-back, or owner is half out of delivery — a replacement costs real money.',
      5: 'Owner draws a market salary that stays in the P&L and is out of day-to-day delivery.',
    },
    effort: { months: 12, difficulty: 3 },
    why:
      'Josh’s broker case exactly: $3M revenue, "$1M EBITDA", owner on $250k added back while ' +
      'working the business daily. The replacement cost is the haircut. This is arithmetic, not opinion.',
  },
  {
    id: 'C2',
    pillar: 'credibility',
    name: 'Related-party rent at market',
    question: 'Do you own the premises and charge the business below-market rent?',
    impact: { kind: 'ebitda', maxHaircut: 0.08 },
    anchors: {
      1: 'You own the premises and the business pays little or no rent, so the profit looks better than it is.',
      3: 'Related-party lease, rent below market, no independent valuation.',
      5: 'Arm’s-length lease at market rent, or an assignable third-party lease with term remaining.',
    },
    effort: { months: 3, difficulty: 1 },
    why:
      'A buyer either pays you market rent or pays a landlord. Either way the cost lands. 8% caps ' +
      'the usual distortion where an owner occupies premises they own.',
  },
  {
    id: 'C3',
    pillar: 'credibility',
    name: 'Non-recurring add-backs',
    question: 'How much of your profit is one-off costs added back?',
    impact: { kind: 'ebitda', maxHaircut: 0.1 },
    anchors: {
      1: 'A long list of "one-offs" that recur every year — legal, restructuring, bad debts, write-offs.',
      3: 'A handful of genuine one-offs, thinly evidenced.',
      5: 'Under 2% of profit in add-backs, every one documented and genuinely never coming back.',
    },
    effort: { months: 6, difficulty: 2 },
    why:
      'The add-back list is the first thing an accountant takes apart. 10% is the middle of what usually ' +
      'gets thrown out on deals this size.',
  },
  {
    id: 'C4',
    pillar: 'credibility',
    name: 'Personal expenses in the P&L',
    question: 'Are personal costs run through the business and added back at exit?',
    impact: { kind: 'ebitda', maxHaircut: 0.07 },
    anchors: {
      1: 'Vehicles, travel, family on payroll, subscriptions — significant and undocumented.',
      3: 'Some personal cost, identified but not cleanly separated.',
      5: 'Clean books for three years. Nothing personal to add back.',
    },
    effort: { months: 12, difficulty: 2 },
    why:
      'Add-backs a buyer cannot verify are add-backs a buyer will not pay for. Tax-efficient today, ' +
      'value-destroying at exit — the trade is roughly 7% of profit in a typical owner-run business.',
  },
  {
    id: 'C5',
    pillar: 'credibility',
    name: 'Maintenance capex recognised',
    question: 'Does reported profit reflect the capex needed just to stand still?',
    impact: { kind: 'ebitda', maxHaircut: 0.08 },
    anchors: {
      1: 'Fleet, plant or systems visibly deferred — the buyer inherits a spend the accounts never showed.',

      5: 'Documented maintenance capex plan, assets current, spend consistent year on year.',
    },
    effort: { months: 9, difficulty: 2 },
    why:
      'Putting off replacing things is borrowing from next year’s profit. A buyer prices what it costs to ' +

  },
  {
    id: 'C6',

    },
    effort: { months: 18, difficulty: 3 },
    why:

  // ── CAPITAL ───────────────────────────────────────────────────────────────
  {
    id: 'C8',
    pillar: 'capital',

    computedNote:
      'Worked out, not scored. The cash the business makes after tax and kit, divided by a year of ' +
      'repayments at your asking price. Lenders want it to cover 1.5 times over.',
    anchors: {

  },
  {
    id: 'C9',
    pillar: 'capital',
    name: 'Cash rhythm',
    question: 'How does cash actually arrive through the year?',
    impact: { kind: 'multiple', maxPenalty: 0.35 },
    anchors: {
      1: 'Quarterly project lumps. Long dry months a buyer must fund out of their own pocket.',
      3: 'Monthly but uneven; seasonality swings working capital materially.',
      5: 'Daily or weekly receipts, predictable within the month.',
    },
    effort: { months: 12, difficulty: 3 },
    why:
      'Debt service is monthly. Lumpy cash means the buyer needs a facility on top of the deal, ' +
      'and they discount the price by roughly what that facility costs.',
  },
  {
    id: 'C10',
    pillar: 'capital',
    name: 'Working capital and debtor discipline',
    question: 'How much cash is trapped in debtors and stock, and how volatile is it?',

    anchors: {
      1: 'Debtor days over 90, no credit control, stock unreconciled.',
      3: 'Debtor days 45–90, informal chasing, some ageing.',
      5: 'Debtor days under 30, formal credit control, a stable working capital cycle.',
    },
    effort: { months: 6, difficulty: 1 },
    why:
      'A buyer has to fund the cash tied up in the business on day one. If that number jumps around, it ' +
      'gets negotiated off the price — and that negotiation favours whoever has the figures.',
  },
  {
    id: 'C11',
    pillar: 'capital',
    name: 'Revenue quality',
    question: 'How much revenue is contracted or recurring versus won again each year?',
    impact: { kind: 'multiple', maxPenalty: 0.45 },
    anchors: {
      1: 'Entirely project-by-project. The order book resets to zero every January.',
      3: 'Repeat customers by habit, nothing contracted.',
      5: 'Majority contracted or subscription, with multi-year terms and documented renewal rates.',
    },
    effort: { months: 18, difficulty: 3 },
    why:
      'Contracted revenue is the difference between a lender underwriting your forecast and ignoring it. ' +
      'It shows up in both what a buyer will pay and what a bank will lend against it.',
  },
  {
    id: 'C12',
    pillar: 'capital',
    name: 'Gross margin stability',
    question: 'How stable has gross margin been across the last three years?',
    impact: { kind: 'multiple', maxPenalty: 0.25 },
    anchors: {
      1: 'Swings of more than 8 points with no explanation, or a clear downward trend.',
      3: 'Moves 3–8 points; pricing is reactive.',
      5: 'Within 2 points for three years, with pricing power demonstrated through cost inflation.',

    why:

  {
    id: 'C13',
    pillar: 'capital',

    impact: { kind: 'multiple', maxPenalty: 0.3 },
    anchors: {

    why:

  },

  // ── CLOSING ───────────────────────────────────────────────────────────────
  {
    id: 'C14',
    pillar: 'closing',
    name: 'Customer concentration',
    question: 'How much revenue sits with your largest customers?',
    impact: { kind: 'multiple', maxPenalty: 0.55 },
    anchors: {
      1: 'One or two clients above 30% of revenue.',
      3: 'Largest client 15–30%, relationship stable but uncontracted.',
      5: 'Largest client under 10%, top five under 30%.',
    },
    effort: { months: 24, difficulty: 3 },
    why:

  {
    id: 'C15',
    pillar: 'closing',
    name: 'Management depth',

    effort: { months: 18, difficulty: 3 },
    why:
      'Joint heaviest delta with owner-generated revenue. It also sets the tie-in a buyer demands — ' +

  {
    id: 'C16',
    pillar: 'closing',
    name: 'Contract assignability',
    question: 'Do your customer contracts survive a change of control?',
    impact: { kind: 'multiple', maxPenalty: 0.4 },
    anchors: {
      1: 'Change-of-control clauses throughout, or no written contracts at all.',
      3: 'Written contracts, consent required, relationships likely to hold.',
      5: 'Freely assignable, or consents pre-agreed with the major accounts.',
    },
    effort: { months: 12, difficulty: 2 },
    why:
      'An unassignable contract is revenue you cannot sell. Buyers either exclude it from the ' +

  {
    id: 'C17',
    pillar: 'closing',
    name: 'Licences and regulatory transferability',

  {

    pillar: 'closing',

      5: 'Current contracts, terms that would hold, and agreements to stay through a sale.',
    },
    effort: { months: 6, difficulty: 1 },
    why:
      'Staff who can leave on a week’s notice are a risk the buyer prices. The fix is cheap and fast, ' +

  },
  {
    id: 'C19',
    pillar: 'closing',
    name: 'Supplier dependency',
    question: 'What happens if your largest supplier changes terms or exits?',
    impact: { kind: 'multiple', maxPenalty: 0.2 },
    anchors: {
      1: 'Single source for a critical input, no contract, terms at their discretion.',
      3: 'Concentrated but with a workable alternative identified.',
      5: 'Multiple qualified suppliers, contracted terms, no single point of failure.',
    },
    effort: { months: 9, difficulty: 2 },
    why:
      'Supplier risk is priced more lightly than customer risk because it is usually fixable — but it ' +
      'is the fastest route to a post-completion margin collapse, so it is never priced at zero.',
  },
  {
    id: 'C20',
    pillar: 'closing',
    name: 'Data room readiness',
    question: 'How long would it take you to produce three years of everything?',
    impact: { kind: 'multiple', maxPenalty: 0.25 },
    anchors: {
      1: 'Months. Records are scattered, some only in the owner’s head.',
      3: 'Weeks, with the accountant’s help.',
      5: 'A maintained data room. Days, not weeks.',
    },
    effort: { months: 3, difficulty: 1 },
    why:
      'Slow disclosure is read as concealment, and every week of delay is a week for the buyer to find ' +
      'a reason to retrade. This is the cheapest turn of multiple in the bank.',
  },
];

const CRITERIA_BY_ID = Object.fromEntries(CRITERIA.map((c) => [c.id, c]));

const criteriaForPillar = (pillar) => CRITERIA.filter((c) => c.pillar === pillar);

/** Total multiple penalty available if every self-scored criterion scores 1. */
const MAX_MULTIPLE_PENALTY = CRITERIA
  .filter((c) => c.impact.kind === 'multiple')
  .reduce((sum, c) => sum + c.impact.maxPenalty, 0);

/** Total EBITDA haircut available from self-scored criteria, before the combined cap. */

 * trade where five businesses earning one million each trade. Turns of multiple ADDED.

/**
 * Live configuration.
 *
 * Every number the engine treats as a judgement call lives here rather than in the
 * criteria bank, so it can be tuned in the interface and the change flows through the
 * audit, the restructure plan and the roll-up at once. The criteria themselves are not
 * editable: the criteria are uncontroversial, the numbers are the risk.
 */


const DEFAULT_CONFIG = {
  currency: '$',
  dscrFloor: 1.5,
  multipleFloor: MULTIPLE_FLOOR,
  ebitdaHaircutCap: MAX_COMBINED_EBITDA_HAIRCUT,
  /** criterion id → delta. Fraction of EBITDA, or turns of multiple, per its own kind. */
  deltas: {},
  /** sector id → premium ceiling. */
  ceilings: {},
};

const config = { ...DEFAULT_CONFIG, deltas: {}, ceilings: {} };

/** The delta a criterion carries right now: an override if one is set, else its own. */
function deltaFor(criterion) {
  const override = config.deltas[criterion.id];
  if (typeof override === 'number' && isFinite(override)) return Math.max(0, override);
  return criterion.impact.kind === 'ebitda'
    ? criterion.impact.maxHaircut
    : criterion.impact.maxPenalty ?? 0;
}

const defaultDeltaFor = (criterion) =>
  criterion.impact.kind === 'ebitda' ? criterion.impact.maxHaircut : criterion.impact.maxPenalty ?? 0;

/** The premium ceiling for a sector right now. */
function ceilingFor(sectorId) {
  const override = config.ceilings[sectorId];
  if (typeof override === 'number' && isFinite(override)) return Math.max(0, override);
  return (SECTORS_BY_ID[sectorId] ?? SECTORS_BY_ID.generic).ceiling;
}

const isTuned = (criterionId) => typeof config.deltas[criterionId] === 'number';
const isSectorTuned = (sectorId) => typeof config.ceilings[sectorId] === 'number';

/** How far the current configuration has drifted from the shipped defaults. */
function tuningSummary() {
  const deltas = Object.entries(config.deltas).filter(([id, v]) =>
    CRITERIA_BY_ID[id] && v !== defaultDeltaFor(CRITERIA_BY_ID[id]));
  const ceilings = Object.entries(config.ceilings).filter(([id, v]) =>
    SECTORS_BY_ID[id] && v !== SECTORS_BY_ID[id].ceiling);
  const bounds = [
    ['DSCR floor', config.dscrFloor, DEFAULT_CONFIG.dscrFloor],
    ['Multiple floor', config.multipleFloor, DEFAULT_CONFIG.multipleFloor],
    ['EBITDA haircut cap', config.ebitdaHaircutCap, DEFAULT_CONFIG.ebitdaHaircutCap],
  ].filter(([, now, was]) => now !== was);
  return { deltas, ceilings, bounds, count: deltas.length + ceilings.length + bounds.length };
}

function setConfig(path, value) {
  const keys = path.split('.');
  let node = config;
  while (keys.length > 1) {
    const k = keys.shift();
    if (!node[k]) node[k] = {};
    node = node[k];
  }
  node[keys[0]] = value;
}

function clearOverride(path) {
  const keys = path.split('.');
  let node = config;
  while (keys.length > 1) node = node[keys.shift()];
  delete node[keys[0]];
}

function resetConfig() {
  Object.assign(config, DEFAULT_CONFIG, { deltas: {}, ceilings: {} });
}

/** Restore a saved configuration, ignoring anything that is not a finite number. */
function applyConfig(saved) {
  if (!saved || typeof saved !== 'object') return;
  const numeric = (v) => (typeof v === 'number' && isFinite(v) ? v : undefined);
  config.currency = typeof saved.currency === 'string' ? saved.currency : config.currency;
  config.dscrFloor = numeric(saved.dscrFloor) ?? config.dscrFloor;
  config.multipleFloor = numeric(saved.multipleFloor) ?? config.multipleFloor;
  config.ebitdaHaircutCap = numeric(saved.ebitdaHaircutCap) ?? config.ebitdaHaircutCap;
  for (const [id, v] of Object.entries(saved.deltas ?? {})) {
    if (CRITERIA_BY_ID[id] && numeric(v) !== undefined) config.deltas[id] = v;
  }
  for (const [id, v] of Object.entries(saved.ceilings ?? {})) {
    if (SECTORS_BY_ID[id] && numeric(v) !== undefined) config.ceilings[id] = v;
  }
}

// ── src/engine/valuation.js ─────────────────────────────────────
/**
 * The valuation engine.
 *
 * Two haircuts, not one:
 *   1. EBITDA   claimed EBITDA  →  defensible EBITDA
 *   2. MULTIPLE premium multiple →  achievable multiple
 *
 * Every input belongs to the seller. The engine only does arithmetic on what they typed,
 * which is the entire design: there is nothing here for them to argue with.
 */



const DEFAULT_STRUCTURE = {
  depositPct: 0.2,
  bankRate: 0.09,
  bankTermYears: 7,
  sellerNotePct: 0.3,
  sellerNoteRate: 0.06,
  sellerNoteTermYears: 5,
  // Deferred consideration is frequently interest-only with a bullet at the end. It is the
  // single biggest lever on whether a price is fundable, which is why it is a structure
  // problem and not a price problem.
  sellerNoteInterestOnly: false,
};

const DEFAULT_FINANCIALS = {
  revenue: 0,
  claimedEbitda: 0,
  ownerSalaryDrawn: 0,
  ownerSalaryAddedBack: 0,
  ownerReplacementCost: 0,
  maintenanceCapex: 0,
  taxRate: 0.25,
};

const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));

/** Proportion of a criterion's impact applied at a given score. 5 → 0, 1 → 1. */
const severity = (score) => clamp((5 - Number(score)) / 4, 0, 1);

/** Annual payment on a fully amortising loan. */
function annualDebtService(principal, annualRate, termYears, interestOnly = false) {
  if (principal <= 0 || termYears <= 0) return 0;
  if (interestOnly) return principal * annualRate;
  if (annualRate === 0) return principal / termYears;
  const r = annualRate / 12;
  const n = termYears * 12;
  const monthly = (principal * r) / (1 - Math.pow(1 + r, -n));
  return monthly * 12;
}

/**
 * C1 — owner salary add-back. Computed, not self-scored.
 * The haircut is what it costs to replace the owner, net of any owner pay a buyer
 * already inherits as a cost in the P&L.
 */
function ownerSalaryHaircut(financials) {
  const { claimedEbitda, ownerSalaryDrawn, ownerSalaryAddedBack, ownerReplacementCost } = financials;
  if (claimedEbitda <= 0) return { amount: 0, fraction: 0, capped: false };
  const stillInPL = Math.max(0, ownerSalaryDrawn - ownerSalaryAddedBack);
  const raw = Math.max(0, ownerReplacementCost - stillInPL);
  const cap = CRITERIA_BY_ID.C1.impact.cap * claimedEbitda;
  const amount = Math.min(raw, cap);
  return { amount, fraction: amount / claimedEbitda, capped: raw > cap, uncapped: raw };
}

/** Every EBITDA haircut, itemised, before and after the combined cap. */
function ebitdaHaircuts(financials, scores) {
  const lines = [];

  const c1 = ownerSalaryHaircut(financials);
  lines.push({
    id: 'C1',
    name: CRITERIA_BY_ID.C1.name,
    fraction: c1.fraction,
    amount: c1.amount,
    computed: true,
    capped: c1.capped,
  });

  for (const c of CRITERIA) {
    if (c.impact.kind !== 'ebitda') continue;
    const fraction = deltaFor(c) * severity(scores[c.id] ?? 5);
    lines.push({
      id: c.id,
      name: c.name,
      fraction,
      amount: fraction * financials.claimedEbitda,
      score: Number(scores[c.id] ?? 5),
      computed: false,
    });
  }

  const rawFraction = lines.reduce((s, l) => s + l.fraction, 0);
  const appliedFraction = Math.min(rawFraction, config.ebitdaHaircutCap);
  const capApplied = rawFraction > config.ebitdaHaircutCap;
  const scale = rawFraction > 0 ? appliedFraction / rawFraction : 0;

  return {
    lines: lines.map((l) => ({
      ...l,
      appliedFraction: l.fraction * scale,
      appliedAmount: l.fraction * scale * financials.claimedEbitda,
    })),
    rawFraction,
    appliedFraction,
    capApplied,
  };
}

/** Every multiple penalty, itemised. */
function multiplePenalties(scores) {
  const lines = CRITERIA
    .filter((c) => c.impact.kind === 'multiple')
    .map((c) => {
      const score = Number(scores[c.id] ?? 5);
      return {
        id: c.id,
        name: c.name,
        pillar: c.pillar,
        score,
        penalty: deltaFor(c) * severity(score),
        maxPenalty: deltaFor(c),
      };
    });
  return { lines, total: lines.reduce((s, l) => s + l.penalty, 0) };
}

/** The Capital gate: can a buyer service debt at the price the seller is asking? */
function dscrAnalysis({ askingPrice, defensibleEbitda, financials, structure }) {
  const s = { ...DEFAULT_STRUCTURE, ...structure };
  const freeCashFlow = Math.max(
    0,
    (defensibleEbitda - financials.maintenanceCapex) * (1 - financials.taxRate),
  );

  // Debt service is linear in price: both tranches are fixed fractions of it.
  const servicePerPound =
    annualDebtService(1 - s.depositPct - s.sellerNotePct, s.bankRate, s.bankTermYears) +
    annualDebtService(s.sellerNotePct, s.sellerNoteRate, s.sellerNoteTermYears, s.sellerNoteInterestOnly);

  const service = servicePerPound * askingPrice;
  const dscr = service > 0 ? freeCashFlow / service : Infinity;
  const maxFundablePrice = servicePerPound > 0 ? freeCashFlow / (config.dscrFloor * servicePerPound) : Infinity;

  let gateScore;
  if (dscr < 1.0) gateScore = 1;
  else if (dscr < 1.25) gateScore = 2;
  else if (dscr < config.dscrFloor) gateScore = 3;
  else if (dscr < config.dscrFloor + 0.5) gateScore = 4;
  else gateScore = 5;

  return {
    freeCashFlow,
    annualService: service,
    bankDebt: askingPrice * (1 - s.depositPct - s.sellerNotePct),
    sellerNote: askingPrice * s.sellerNotePct,
    deposit: askingPrice * s.depositPct,
    dscr,
    passes: dscr >= config.dscrFloor,
    maxFundablePrice,
    gateScore,
    structure: s,
  };
}

/**
 * Run the whole audit.
 * @param {object} input { business, financials, askingPrice, structure, scores, applySizePremium }
 */
function runAudit(input) {
  const financials = { ...DEFAULT_FINANCIALS, ...input.financials };
  const structure = { ...DEFAULT_STRUCTURE, ...input.structure };
  const scores = input.scores ?? {};
  const askingPrice = Number(input.askingPrice) || 0;
  const sector = input.business?.sector ?? 'generic';

  const haircuts = ebitdaHaircuts(financials, scores);
  const defensibleEbitda = financials.claimedEbitda * (1 - haircuts.appliedFraction);

  const baseCeiling = ceilingFor(sector);
  const premium = input.applySizePremium ? sizePremium(defensibleEbitda) : 0;
  const ceiling = baseCeiling + premium;

  const penalties = multiplePenalties(scores);
  const achievableMultiple = clamp(ceiling - penalties.total, config.multipleFloor, ceiling);
  const multipleFloored = ceiling - penalties.total < config.multipleFloor;

  const achievableValue = defensibleEbitda * achievableMultiple;
  const dscr = dscrAnalysis({ askingPrice, defensibleEbitda, financials, structure });

  const impliedMultipleAtAsking = defensibleEbitda > 0 ? askingPrice / defensibleEbitda : Infinity;
  const impliedMultipleOnClaimed =
    financials.claimedEbitda > 0 ? askingPrice / financials.claimedEbitda : Infinity;

  return {
    input: { ...input, financials, structure, scores, askingPrice, sector },
    claimedEbitda: financials.claimedEbitda,
    defensibleEbitda,
    haircuts,
    ceiling,
    baseCeiling,
    sizePremium: premium,
    penalties,
    achievableMultiple,
    multipleFloored,
    achievableValue,
    askingPrice,
    gap: askingPrice - achievableValue,
    impliedMultipleAtAsking,
    impliedMultipleOnClaimed,
    dscr,
    // Two independent ceilings on price. Whichever is lower is what a seller actually gets,
    // and which one binds decides the conversation: a quality problem or a structure problem.
    realisticPrice: Math.min(achievableValue, dscr.maxFundablePrice),
    binding: dscr.maxFundablePrice < achievableValue ? 'fundability' : 'quality',
    pillarScores: pillarScores(scores, dscr.gateScore),
  };
}

/** Average self-assessed score per pillar, with the computed DSCR gate folded into Capital. */
function pillarScores(scores, gateScore) {
  const out = {};
  for (const pillar of ['credibility', 'capital', 'closing']) {
    const items = CRITERIA.filter((c) => c.pillar === pillar);
    const values = items.map((c) => {
      if (c.id === 'C8') return gateScore;
      if (c.impact.kind === 'computed') return null;
      return Number(scores[c.id] ?? 5);
    }).filter((v) => v !== null);
    out[pillar] = values.length ? values.reduce((a, b) => a + b, 0) / values.length : 5;
  }
  return out;
}

// ── src/engine/restructure.js ───────────────────────────────────
/**
 * Restructure engine.
 *
 * The audit tells a seller what their business is worth. This tells them what each fix
 * is worth, so the conversation stops being "your price is wrong" and becomes
 * "here is the sequence that closes the gap". That is a structure problem, not a price
 * problem — which is the mandate.
 */


/** Value of the business if one criterion moved to `target`, all else unchanged. */
function valueWithScore(input, criterionId, target) {
  const scores = { ...(input.scores ?? {}), [criterionId]: target };
  return runAudit({ ...input, scores }).achievableValue;
}

/**
 * Every fix, priced.
 * `fullUplift` moves the criterion to 5. `nextStepUplift` moves it one point.
 * Effort is the criterion's own months/difficulty; the ratio is what sequences the plan.
 */
function remediationPlan(input) {
  const base = runAudit(input);
  const items = [];

  for (const c of CRITERIA) {
    if (c.impact.kind === 'computed') continue;
    const current = Number(input.scores?.[c.id] ?? 5);
    if (current >= 5) continue;

    const fullUplift = valueWithScore(input, c.id, 5) - base.achievableValue;
    const nextStepUplift = valueWithScore(input, c.id, Math.min(5, current + 1)) - base.achievableValue;
    const months = c.effort.months || 1;

    items.push({
      id: c.id,
      name: c.name,
      pillar: c.pillar,
      currentScore: current,
      fullUplift,
      nextStepUplift,
      months,
      difficulty: c.effort.difficulty,
      valuePerMonth: fullUplift / months,
      // Cheap and fast beats large and slow when a seller has a horizon.
      priority: fullUplift / (months * c.effort.difficulty),
      anchorNow: c.anchors[current] ?? c.anchors[3],
      anchorTarget: c.anchors[5],
      why: c.why,
    });
  }

  items.sort((a, b) => b.priority - a.priority);

  // Not the sum of the individual uplifts. The fixes compound, so summing them understates
  // the programme. This is the value of doing all of it, computed directly.
  const everythingFixed = { ...(input.scores ?? {}) };
  for (const c of CRITERIA) {
    if (c.impact.kind !== 'computed') everythingFixed[c.id] = 5;
  }
  const totalRecoverable =
    runAudit({ ...input, scores: everythingFixed }).achievableValue - base.achievableValue;

  return {
    base,
    items,
    totalRecoverable,
    horizons: {
      // What is reachable inside each window if the work runs in parallel.
      months6: items.filter((i) => i.months <= 6),
      months12: items.filter((i) => i.months <= 12),
      months24: items.filter((i) => i.months <= 24),
    },
  };
}

/** Value reachable within a time horizon, assuming parallel workstreams. */
function valueAtHorizon(input, months) {
  const scores = { ...(input.scores ?? {}) };
  for (const c of CRITERIA) {
    if (c.impact.kind === 'computed') continue;
    if ((c.effort.months || 0) <= months) scores[c.id] = 5;
  }
  return runAudit({ ...input, scores });
}

/** The three-point picture a seller sees: today, 12 months, 24 months. */
function restructureTrajectory(input) {
  const now = runAudit(input);
  return [
    { label: 'Today', months: 0, result: now },
    { label: '12 months', months: 12, result: valueAtHorizon(input, 12) },
    { label: '24 months', months: 24, result: valueAtHorizon(input, 24) },
  ];
}

/**
 * What each of the three C's is worth on its own: the value recovered if that pillar
 * alone reached 5 and the other two stayed exactly as they are.
 *
 * These are marginal, and they do not sum to the total — they under-add. Value is earnings
 * times multiple, so a pillar that lifts the earnings base and a pillar that lifts the
 * multiple compound when fixed together: the whole is worth more than the sum of the parts.
 * Reported as marginals rather than as shares of a total precisely because no honest share
 * exists — the interaction belongs to no single pillar.
 */
function pillarUplift(input) {
  const base = runAudit(input);
  return ['credibility', 'capital', 'closing'].map((pillar) => {
    const scores = { ...(input.scores ?? {}) };
    for (const c of CRITERIA) {
      if (c.pillar === pillar && c.impact.kind !== 'computed') scores[c.id] = 5;
    }
    const lifted = runAudit({ ...input, scores });
    return {
      pillar,
      value: lifted.achievableValue - base.achievableValue,
      multiple: lifted.achievableMultiple - base.achievableMultiple,
      ebitda: lifted.defensibleEbitda - base.defensibleEbitda,
      score: base.pillarScores[pillar],
    };
  });
}

/** Named summary of a single fix, for the report. */
function describeFix(id) {
  const c = CRITERIA_BY_ID[id];
  return c ? { name: c.name, question: c.question, target: c.anchors[5], why: c.why } : null;
}

/**
 * What actually moves the number.
 *
 * For each question, the value of the business if that answer were the worst it could be
 * and if it were the best, holding everything else where it is. The spread between those
 * two is the lever; the order of the spreads is where to spend the next twelve months.
 */
function sensitivity(input) {
  const base = runAudit(input).achievableValue;
  const scores = input.scores ?? {};

  return CRITERIA
    .filter((c) => c.impact.kind !== 'computed')
    .map((c) => {
      const low = runAudit({ ...input, scores: { ...scores, [c.id]: 1 } }).achievableValue;
      const high = runAudit({ ...input, scores: { ...scores, [c.id]: 5 } }).achievableValue;
      return {
        id: c.id,
        name: c.name,
        pillar: c.pillar,
        score: Number(scores[c.id] ?? 3),
        base,
        low,
        high,
        downside: base - low,
        upside: high - base,
        range: high - low,
      };
    })
    .sort((a, b) => b.range - a.range);
}

/**
 * The group model.
 *
 * A group is a holding company and the businesses hanging off it. Every business is
 * priced, funded with one of the real structures, integrated with the levers you actually
 * pull, and tested on its own cash before it is allowed into the group.
 */




const DEFAULT_ASSUMPTIONS = {
  taxRate: 0.25,
  capexPct: 0.1,
  organicGrowth: 0.03,
};

/** One business, priced and funded. */
function priceNode(node, assumptions = {}) {
  const a = { ...DEFAULT_ASSUMPTIONS, ...assumptions };
  const industry = SECTORS_BY_ID[node.industryId] ?? SECTORS_BY_ID.generic;
  const structure = STRUCTURES_BY_ID[node.structureId] ?? STRUCTURES[0];
  const funding = asFunding(structure.id);

  const ebitda = Math.max(0, node.ebitda || 0);
  const multiple = node.multiple ?? industry.low;
  const price = ebitda * multiple;

  const cashNeeded = price * funding.depositPct;
  const sellerNote = price * funding.sellerNotePct;
  const bankDebt = Math.max(0, price - cashNeeded - sellerNote);

  const interestOnly = Boolean(node.interestOnly);
  const fullService =
    annualDebtService(bankDebt, funding.bankRate, funding.bankTermYears) +
    annualDebtService(sellerNote, funding.sellerNoteRate, funding.sellerNoteTermYears, interestOnly);
  const firstYearService = fullService * Math.max(0, (12 - funding.holidayMonths) / 12);

  const synergyRate = synergyFrom(node.levers ?? []);
  const synergy = ebitda * synergyRate;
  const contributed = ebitda + synergy;

  const freeCashFlow = Math.max(0, contributed * (1 - a.capexPct) * (1 - a.taxRate));
  const dscr = fullService > 0 ? freeCashFlow / fullService : Infinity;
  const firstYearDscr = firstYearService > 0 ? freeCashFlow / firstYearService : Infinity;

  return {
    ...node,
    industry, structure, multiple, price, interestOnly,
    cashNeeded, sellerNote, bankDebt,
    service: fullService, firstYearService,
    synergyRate, synergy, contributed,
    freeCashFlow, dscr, firstYearDscr,
    passes: dscr >= config.dscrFloor,
    // The most it could be worth and still cover its own repayments, so a business that
    // fails comes with the price that would fix it rather than just a red mark.
    maxMultiple: fullService > 0 && price > 0 && ebitda > 0
      ? freeCashFlow / (config.dscrFloor * (fullService / price)) / ebitda
      : Infinity,
  };
}

/** The whole group: what it earns, what it owes, what it is worth. */
function runBuild(group) {
  const assumptions = { ...DEFAULT_ASSUMPTIONS, ...(group.assumptions ?? {}) };
  const nodes = (group.nodes ?? []).map((n) => priceNode(n, assumptions));

  const holdcoEbitda = Math.max(0, group.holdcoEbitda || 0);
  const acquiredEbitda = nodes.reduce((s, n) => s + n.ebitda, 0);
  const synergies = nodes.reduce((s, n) => s + n.synergy, 0);
  const groupProfit = holdcoEbitda + acquiredEbitda + synergies;

  const totalPrice = nodes.reduce((s, n) => s + n.price, 0);
  const cashRequired = nodes.reduce((s, n) => s + n.cashNeeded, 0);
  const debt = nodes.reduce((s, n) => s + n.bankDebt + n.sellerNote, 0);
  const service = nodes.reduce((s, n) => s + n.service, 0);

  const groupFreeCashFlow = Math.max(
    0,
    groupProfit * (1 - assumptions.capexPct) * (1 - assumptions.taxRate),
  );
  const dscr = service > 0 ? groupFreeCashFlow / service : Infinity;

  // The group's ceiling is weighted by where the profit actually comes from.
  const weights = nodes.map((n) => ({ ceiling: ceilingFor(n.industryId), weight: n.contributed }));
  if (holdcoEbitda > 0) weights.push({ ceiling: ceilingFor(group.holdcoIndustry ?? 'generic'), weight: holdcoEbitda });
  const totalWeight = weights.reduce((s, w) => s + w.weight, 0);
  const blendedCeiling = totalWeight > 0
    ? weights.reduce((s, w) => s + w.ceiling * w.weight, 0) / totalWeight
    : ceilingFor('generic');

  const premium = sizePremium(groupProfit);
  const exitMultiple = blendedCeiling + premium;
  const groupValue = groupProfit * exitMultiple;
  const equityValue = Math.max(0, groupValue - debt);
  const blendedEntry = acquiredEbitda > 0 ? totalPrice / acquiredEbitda : 0;

  return {
    nodes, assumptions,
    holdcoEbitda, acquiredEbitda, synergies, groupProfit,
    totalPrice, cashRequired, debt, service,
    groupFreeCashFlow, dscr, passes: dscr >= config.dscrFloor,
    blendedCeiling, premium, exitMultiple, groupValue, equityValue,
    blendedEntry, arbitrage: exitMultiple - blendedEntry,
    // What the group could still absorb before cover breaks.
    headroom: Math.max(0, groupFreeCashFlow / config.dscrFloor - service),
  };
}

/**
 * What your money actually buys.
 *
 * The surprise is that debt cover does not care how big the business is — it cares what
 * multiple you pay. So the answer to "what can I afford" is a price per pound of profit,
 * not a size. Cash only ever buys you the deposit structure.
 */
function capitalOptions(cash, { industryId = 'generic', stretch = false, assumptions = {} } = {}) {
  const a = { ...DEFAULT_ASSUMPTIONS, ...assumptions };
  const industry = SECTORS_BY_ID[industryId] ?? SECTORS_BY_ID.generic;
  const cashPerPound = (1 - a.capexPct) * (1 - a.taxRate);

  return STRUCTURES.map((s) => {
    const f = asFunding(s.id);
    const bankShare = Math.max(0, 1 - f.depositPct - f.sellerNotePct);

    // Debt service per £1 of price. Because both cash flow and debt service scale with the
    // deal, the size of the business cancels out and what is left is a maximum PRICE per
    // pound of profit. That is the whole answer to "what can I afford".
    const servicePer = (interestOnly) =>
      annualDebtService(bankShare, f.bankRate, f.bankTermYears) +
      annualDebtService(f.sellerNotePct, f.sellerNoteRate, f.sellerNoteTermYears, interestOnly);

    const maxMultiple = servicePer(false) > 0 ? cashPerPound / (config.dscrFloor * servicePer(false)) : Infinity;
    const stretchedMultiple = servicePer(true) > 0 ? cashPerPound / (config.dscrFloor * servicePer(true)) : Infinity;

    const cashLimitedPrice = f.depositPct > 0 ? cash / f.depositPct : Infinity;

    return {
      structure: s,
      maxMultiple: stretch ? stretchedMultiple : maxMultiple,
      plainMultiple: maxMultiple,
      stretchedMultiple,
      clearsIndustryEntry: (stretch ? stretchedMultiple : maxMultiple) >= industry.low,
      industryEntry: industry.low,
      cashLimitedPrice,
      cashLimitedProfit: isFinite(cashLimitedPrice) ? cashLimitedPrice / industry.low : Infinity,
      needsCash: f.depositPct > 0,
      limitedBy: f.depositPct > 0 ? 'your cash' : 'the price you pay, never your cash',
    };
  });
}

/**
 * Twenty years, two paths.
 *
 * Path one: keep the business, grow it, sell it at the end for what it is worth.
 * Path two: use it as the platform and buy others alongside it.
 *
 * Free cash after interest sweeps against debt, which is how these are actually run.
 * Two things stop it running away: acquisitions pause in any year where taking on more
 * would push cover below the floor, and there is a hard cap on how many businesses one
 * group can absorb. Without that cap the maths compounds into a number nobody believes,
 * which costs more credibility than it buys.
 */
function horizon({
  startingProfit,
  todayValue,
  industryId = 'generic',
  dealsPerYear = 2,
  avgDealProfit = 250_000,
  maxBusinesses = 12,
  entryMultiple,
  structureId = 'vendor',
  synergyRate = 0.15,
  advisoryCost = 0,
  years = 20,
  assumptions = {},
}) {
  const a = { ...DEFAULT_ASSUMPTIONS, ...assumptions };
  const industry = SECTORS_BY_ID[industryId] ?? SECTORS_BY_ID.generic;
  const entry = entryMultiple ?? industry.low;
  const f = asFunding(structureId);
  const blendedRate =
    f.sellerNoteRate * f.sellerNotePct + f.bankRate * Math.max(0, 1 - f.depositPct - f.sellerNotePct);
  const avgTerm = Math.max(f.bankTermYears, f.sellerNoteTermYears);

  const rows = [];
  let aloneProfit = startingProfit;
  let groupProfit = startingProfit;
  let debt = 0;
  let cashIn = advisoryCost;
  let bought = 0;
  let paused = 0;

  for (let year = 1; year <= years; year += 1) {
    aloneProfit *= 1 + a.organicGrowth;
    groupProfit *= 1 + a.organicGrowth;

    const freeCash = Math.max(0, groupProfit * (1 - a.capexPct) * (1 - a.taxRate));
    const service = annualDebtService(debt, blendedRate, avgTerm);

    // Would another year of buying still clear the floor?
    const wouldAdd = dealsPerYear * avgDealProfit * entry * (1 - f.depositPct);
    const wouldService = annualDebtService(debt + wouldAdd, blendedRate, avgTerm);
    const wouldProfit = groupProfit + dealsPerYear * avgDealProfit * (1 + synergyRate);
    const wouldCash = Math.max(0, wouldProfit * (1 - a.capexPct) * (1 - a.taxRate));
    const canBuy = wouldService === 0 || wouldCash / wouldService >= config.dscrFloor;

    const capacityLeft = Math.max(0, maxBusinesses - bought);
    const buying = Math.min(dealsPerYear, capacityLeft);

    if (canBuy && buying > 0) {
      groupProfit += buying * avgDealProfit * (1 + synergyRate);
      debt += buying * avgDealProfit * entry * (1 - f.depositPct);
      cashIn += buying * avgDealProfit * entry * f.depositPct;
      bought += buying;
    } else if (buying > 0) {
      paused += 1;
    }

    // Sweep free cash after interest against the balance.
    const interest = debt * blendedRate;
    debt = Math.max(0, debt - Math.max(0, freeCash - interest));

    const aloneMultiple = ceilingFor(industryId) + sizePremium(aloneProfit);
    const groupMultiple = ceilingFor(industryId) + sizePremium(groupProfit);
    const groupEquity = Math.max(0, groupProfit * groupMultiple - debt);

    rows.push({
      year,
      aloneProfit,
      aloneValue: aloneProfit * aloneMultiple,
      groupProfit,
      groupMultiple,
      groupValue: groupProfit * groupMultiple,
      debt,
      groupEquity,
      businesses: bought,
      cashIn,
      canBuy,
    });
  }

  const at = (y) => rows.find((r) => r.year === y) ?? rows[rows.length - 1];
  const final = rows[rows.length - 1];

  return {
    rows,
    milestones: [3, 5, 10, 20].filter((y) => y <= years).map(at),
    todayValue,
    entry,
    pausedYears: paused,
    businessesBought: bought,
    maxBusinesses,
    totalCashIn: cashIn,
    difference: final.groupEquity - final.aloneValue,
    // Every pound put in, against every pound of extra value out. Large by design when the
    // structures need no deposit — the fee is then genuinely the only cash in the deal.
    returnOnCash: cashIn > 0 ? (final.groupEquity - final.aloneValue) / cashIn : Infinity,
  };
}

/**
 * What you would have to become to get your number.
 *
 * The seller who says "I want fifteen million" is usually not wrong about wanting it — he is
 * wrong about the size of business that gets it. Because the price per pound of profit steps
 * up with scale, this solves backwards: the smallest profit that, at the multiple its own
 * size earns, is worth the number he has in mind. Then it says how many businesses that is.
 */
function requiredScale({
  targetPrice,
  currentProfit,
  industryId = 'generic',
  avgDealProfit = 250_000,
  dealsPerYear = 2,
  synergyRate = 0.15,
}) {
  // The multiple used here is the best a well-run business in this industry gets, so the
  // answer already assumes the quality problems are fixed too. Anything less and the profit
  // needed is higher still.
  const ceiling = ceilingFor(industryId);
  if (!(targetPrice > 0) || !(ceiling > 0)) return null;

  // Walk the size bands from the bottom: the first one whose own multiple produces a profit
  // that actually sits inside that band is the honest answer.
  let solution = null;
  for (const band of SIZE_BANDS) {
    const multiple = ceiling + band.premium;
    const profit = targetPrice / multiple;
    if (profit >= band.from && profit < band.to) {
      solution = { profit, multiple, band };
      break;
    }
  }
  // No band contains its own answer — the number sits in a gap between two brackets, so it
  // takes the next bracket up and the profit that bracket starts at.
  if (!solution) {
    const band = [...SIZE_BANDS].reverse().find((b) => targetPrice / (ceiling + b.premium) >= b.from)
      ?? SIZE_BANDS[SIZE_BANDS.length - 1];
    solution = { profit: Math.max(band.from, targetPrice / (ceiling + band.premium)), multiple: ceiling + band.premium, band };
  }

  const profitNeeded = Math.max(0, solution.profit - currentProfit);
  const perDeal = avgDealProfit * (1 + synergyRate);
  const businesses = perDeal > 0 ? Math.ceil(profitNeeded / perDeal) : Infinity;
  const years = dealsPerYear > 0 ? Math.ceil(businesses / dealsPerYear) : Infinity;

  return {
    targetPrice,
    currentProfit,
    requiredProfit: solution.profit,
    requiredMultiple: solution.multiple,
    band: solution.band,
    profitNeeded,
    businesses,
    years,
    perDeal,
    // Reaching the number usually means moving up a bracket, not just earning more. That is
    // the part sellers never see coming, so it is called out rather than left to be inferred.
    todayBand: SIZE_BANDS.find((b) => currentProfit >= b.from && currentProfit < b.to) ?? SIZE_BANDS[0],
    bandJump: solution.band.premium > sizePremium(currentProfit),
    ceiling,
    reachable: isFinite(businesses) && businesses >= 0,
    alreadyThere: profitNeeded <= 0,
  };
}

/**
 * Which of the businesses you already own are dragging the rest down.
 *
 * A buyer who has done a dozen deals rarely knows which ones are the problem; the group's
 * average hides it. This names them and prices the drag: what the group is worth now against
 * what it would be worth if the ones that cannot cover their own repayments were fixed.
 */
function portfolioHealth(group) {
  const now = runBuild(group);
  const failing = now.nodes.filter((n) => !n.passes);
  if (!failing.length) {
    return { ...now, failing: [], drag: 0, worstFirst: [], repriced: now };
  }

  // Repriced: every failing deal bought at the most it could carry instead of what was paid.
  const repriced = runBuild({
    ...group,
    nodes: group.nodes.map((n) => {
      const priced = priceNode(n, group.assumptions);
      return priced.passes ? n : { ...n, multiple: Math.max(0.5, priced.maxMultiple) };
    }),
  });

  return {
    ...now,
    failing,
    repriced,
    drag: repriced.equityValue - now.equityValue,
    overpaid: failing.reduce((s, n) => s + Math.max(0, n.price - n.maxMultiple * n.ebitda), 0),
    worstFirst: [...now.nodes].sort((a, b) => a.dscr - b.dscr),
  };
}

/**
 * Whether a business next door to yours actually merges with it.
 *
 * An electrician buying a roofer is either one van, one office and one customer list, or it is
 * two companies with a shared owner. The difference is which savings genuinely apply to both,
 * so this counts the ones they have in common rather than assuming a percentage.
 */
function industryFit(platformIndustryId, targetIndustryId) {
  const platform = SECTORS_BY_ID[platformIndustryId] ?? SECTORS_BY_ID.generic;
  const target = SECTORS_BY_ID[targetIndustryId] ?? SECTORS_BY_ID.generic;
  const shared = (target.levers ?? []).filter((l) => (platform.levers ?? []).includes(l));
  const only = (target.levers ?? []).filter((l) => !(platform.levers ?? []).includes(l));
  const possible = (target.levers ?? []).length || 1;

  return {
    platform, target,
    shared, only,
    same: platform.id === target.id,
    score: shared.length / possible,
    verdict: platform.id === target.id
      ? 'The same trade. Everything that can merge, merges.'
      : shared.length >= 3
        ? 'Close enough that most of the savings are real.'
        : shared.length >= 2
          ? 'Some genuine overlap, but not the full set.'
          : 'Different businesses with a shared owner. Expect the savings to be thin.',
  };
}
