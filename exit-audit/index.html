/**
 * The group canvas.
 *
 * Your business sits in the middle. Everything you buy hangs off it. Positions are stored
 * as fractions of the box so the whole thing scales, and a node with no stored position
 * takes its place on a ring — you never have to drag anything, but you can.
 */



const NODE_W = 0.19;   // fractions of the canvas box
const NODE_H = 0.20;
const RING_RX = 0.34;
const RING_RY = 0.30;

/** Where a node sits: its own position if it has been moved, otherwise its place on the ring. */
function nodePosition(node, index, total) {
  if (node.pos) return node.pos;
  const angle = -Math.PI / 2 + (index / Math.max(1, total)) * Math.PI * 2;
  return { x: 0.5 + Math.cos(angle) * RING_RX, y: 0.5 + Math.sin(angle) * RING_RY };
}

function groupCanvas(result, { selected } = {}) {
  const nodes = result.nodes;
  const total = nodes.length;
  const placed = nodes.map((n, i) => ({ node: n, pos: nodePosition(n, i, total) }));

  const lines = placed.map(({ node, pos }) => {
    const strong = node.passes;
    return `<line data-line="${node.id}" x1="50" y1="50" x2="${(pos.x * 100).toFixed(2)}" y2="${(pos.y * 100).toFixed(2)}"
      stroke="${strong ? 'var(--hair-strong)' : 'var(--critical)'}" stroke-width="0.25"
      vector-effect="non-scaling-stroke" opacity="${strong ? 0.9 : 1}" />`;
  }).join('');

  const cards = placed.map(({ node, pos }) => {
    const industry = SECTORS_BY_ID[node.industryId] ?? SECTORS_BY_ID.generic;
    const structure = STRUCTURES_BY_ID[node.structureId];
    return `
    <div class="gnode ${selected === node.id ? 'on' : ''} ${node.passes ? '' : 'warn'}"
         data-node="${node.id}" tabindex="0" role="button"
         aria-label="${esc(industry.name)}, ${esc(money(node.ebitda))} profit"
         style="left:${(pos.x * 100).toFixed(2)}%;top:${(pos.y * 100).toFixed(2)}%">
      <span class="gnode-industry">${esc(industry.name)}</span>
      <span class="gnode-profit">${esc(moneyShort(node.ebitda))}</span>
      <span class="gnode-meta">${esc(structure?.name ?? '')}</span>
      <span class="gnode-cover ${node.passes ? 'ok' : 'bad'}">${esc(turns(node.dscr))} cover</span>
      ${node.interestOnly ? '<span class="gnode-meta">interest only</span>' : ''}
    </div>`;
  }).join('');

  return `
  <div class="canvas" id="canvas" data-canvas>
    <svg class="canvas-web" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      ${lines}
    </svg>
    <div class="ghub" data-hub>
      <span class="ghub-label">Your business</span>
      <span class="ghub-profit">${esc(moneyShort(result.holdcoEbitda))}</span>
      <span class="ghub-meta">${total} bought${total ? ` · ${esc(moneyShort(result.groupProfit))} together` : ''}</span>
    </div>
    ${cards}
    ${total === 0 ? `
      <div class="canvas-empty">
        <p>Add a business below and it appears here.</p>
      </div>` : ''}
  </div>`;
}

/** Cards you add from. One tap adds; the web rearranges itself. */
function industryTray(sectors) {
  return `
  <div class="tray">
    ${sectors.map((s) => `
      <button class="tray-card" data-act="add-node" data-industry="${s.id}">
        <span class="tray-name">${esc(s.name)}</span>
        <span class="tray-eg">${esc(s.example)}</span>
        <span class="tray-mult">${s.low.toFixed(1)}x to buy · ${s.ceiling.toFixed(1)}x to sell</span>
      </button>`).join('')}
  </div>`;
}

// ── src/ui/state.js ─────────────────────────────────────────────
/**
 * Session state.
 *
 * The tool holds several named cases — one per business you are working on — and one of
 * them is live at a time. The live copy is what every screen reads and writes; it is
 * folded back into its case record on every change, so switching cases never loses work.
 */










const KEY = 'vid-audit-platform-v2';
const LEGACY_KEY = 'vid-audit-platform-v1';

const blankAudit = () => ({
  business: { name: '', sector: 'generic' },
  askingPrice: 0,
  financials: { ...DEFAULT_FINANCIALS },
  structure: { ...DEFAULT_STRUCTURE },
  applySizePremium: true,
  scores: Object.fromEntries(
    CRITERIA.filter((c) => c.impact.kind !== 'computed').map((c) => [c.id, 3]),
  ),
});

const blankGroup = () => ({
  /** Left null until the audit has a number; the platform is the seller's own business. */
  holdcoEbitda: null,
  holdcoIndustry: null,
  nodes: [],
  nextId: 1,
  assumptions: { ...DEFAULT_ASSUMPTIONS },
});

const blankCapital = () => ({ cash: 0, industryId: 'trades', stretch: false });

const blankFuture = () => ({
  dealsPerYear: 2,
  avgDealProfit: 250_000,
  maxBusinesses: 12,
  structureId: 'vendor',
  synergyRate: 0.15,
  advisoryCost: 50_000,
});

let caseSeq = 1;
const nextCaseId = () => `case-${caseSeq++}-${Math.random().toString(36).slice(2, 7)}`;

const blankDeal = () => ({
  price: 1_000_000,
  fees: 40_000,
  ebitda: 250_000,
  exitYear: 5,
  exitMultiple: 6,
  sources: defaultStack(),
});

const blankCase = (name = 'New case') => ({
  id: nextCaseId(),
  name,
  created: Date.now(),
  updated: Date.now(),
  audit: blankAudit(),
  group: blankGroup(),
  capital: blankCapital(),
  future: blankFuture(),
  deal: blankDeal(),
  repair: blankRepair(),
});

const state = {
  /** Every case you have entered. The live copy below belongs to whichever is active. */
  cases: [],
  activeCaseId: null,
  audit: blankAudit(),
  group: blankGroup(),
  capital: blankCapital(),
  future: blankFuture(),
  deal: blankDeal(),
  repair: blankRepair(),
  /** Interface state. Not part of any case, never exported. */
  ui: { openPillar: 'credibility', selectedNode: null },
};

const activeCase = () => state.cases.find((c) => c.id === state.activeCaseId) ?? null;

/** Fold the live copy back into its case record. Called before every save. */
function syncActive() {
  const record = activeCase();
  if (!record) return;
  record.audit = state.audit;
  record.group = state.group;
  record.capital = state.capital;
  record.future = state.future;
  record.deal = state.deal;
  record.repair = state.repair;
  record.updated = Date.now();
  if (state.audit.business.name && record.name === 'New case') record.name = state.audit.business.name;
}

/** Make a case live, taking its stored copy as the working copy. */
function openCase(id) {
  const record = state.cases.find((c) => c.id === id);
  if (!record) return;
  syncActive();
  state.activeCaseId = id;
  state.audit = record.audit;
  state.group = record.group;
  state.capital = record.capital;
  state.future = record.future;
  state.deal = record.deal;
  state.repair = record.repair;
  state.ui.selectedNode = null;
  notify();
}

function newCase(name = 'New case', seed = null) {
  const record = blankCase(name);
  if (seed) {
    record.audit = {
      ...blankAudit(),
      business: { ...seed.business },
      askingPrice: seed.askingPrice,
      financials: { ...DEFAULT_FINANCIALS, ...seed.financials },
      scores: { ...blankAudit().scores, ...seed.scores },
    };
  }
  syncActive();
  state.cases.push(record);
  state.activeCaseId = record.id;
  state.audit = record.audit;
  state.group = record.group;
  state.capital = record.capital;
  state.future = record.future;
  state.deal = record.deal;
  state.repair = record.repair;
  state.ui.selectedNode = null;
  notify();
  return record.id;
}

/**
 * Start a case from one of the situations people actually walk in with.
 * Returns the screen that answers that particular pain.
 */
function loadScenario(id) {
  const scenario = SCENARIOS_BY_ID[id];
  if (!scenario) return null;

  const record = blankCase(scenario.audit.business.name);
  record.scenario = id;
  record.audit = {
    ...blankAudit(),
    business: { ...scenario.audit.business },
    askingPrice: scenario.audit.askingPrice ?? 0,
    financials: { ...DEFAULT_FINANCIALS, ...scenario.audit.financials },
    scores: { ...blankAudit().scores, ...(scenario.audit.scores ?? {}) },
  };
  if (scenario.group) record.group = { ...blankGroup(), ...scenario.group };
  if (scenario.capital) record.capital = { ...blankCapital(), ...scenario.capital };
  if (scenario.future) record.future = { ...blankFuture(), ...scenario.future };

  syncActive();
  state.cases.push(record);
  state.activeCaseId = record.id;
  state.audit = record.audit;
  state.group = record.group;
  state.capital = record.capital;
  state.future = record.future;
  state.deal = record.deal;
  state.repair = record.repair;
  state.ui.selectedNode = null;
  notify();
  return scenario.goto;
}

function renameCase(id, name) {
  const record = state.cases.find((c) => c.id === id);
  if (!record) return;
  record.name = name || 'Untitled case';
  if (id === state.activeCaseId) state.audit.business.name = record.name;
  notify();
}

function duplicateCase(id) {
  const source = state.cases.find((c) => c.id === id);
  if (!source) return null;
  syncActive();
  const copy = structuredClone({ ...source, id: nextCaseId(), name: `${source.name} copy`, created: Date.now() });
  state.cases.push(copy);
  notify();
  return copy.id;
}

function deleteCase(id) {
  state.cases = state.cases.filter((c) => c.id !== id);
  if (state.activeCaseId === id) {
    if (state.cases.length === 0) newCase();
    else openCase(state.cases[0].id);
    return;
  }
  notify();
}

/** A case as a portable object, so one can be sent to someone else and opened here. */
function exportCase(id) {
  const record = state.cases.find((c) => c.id === id) ?? activeCase();
  if (!record) return null;
  syncActive();
  return {
    format: 'exit-audit-case',
    version: 1,
    name: record.name,
    audit: record.audit,
    group: record.group,
    capital: record.capital,
    future: record.future,
    deal: record.deal,
    repair: record.repair,
  };
}

/** Take a case someone sent you. Anything missing or malformed falls back to a blank. */
function importCase(payload) {
  if (!payload || payload.format !== 'exit-audit-case') return null;
  const record = blankCase(typeof payload.name === 'string' ? payload.name : 'Imported case');
  if (payload.audit && typeof payload.audit === 'object') {
    record.audit = { ...blankAudit(), ...payload.audit };
    record.audit.financials = { ...DEFAULT_FINANCIALS, ...(payload.audit.financials ?? {}) };
    record.audit.structure = { ...DEFAULT_STRUCTURE, ...(payload.audit.structure ?? {}) };
    record.audit.scores = { ...blankAudit().scores, ...(payload.audit.scores ?? {}) };
  }
  if (payload.group && typeof payload.group === 'object') record.group = { ...blankGroup(), ...payload.group };
  if (payload.capital && typeof payload.capital === 'object') record.capital = { ...blankCapital(), ...payload.capital };
  if (payload.future && typeof payload.future === 'object') record.future = { ...blankFuture(), ...payload.future };
  if (payload.repair && typeof payload.repair === 'object') {
    record.repair = { ...blankRepair(), ...payload.repair };
    if (!Array.isArray(record.repair.chosen)) record.repair.chosen = [];
  }
  if (payload.deal && typeof payload.deal === 'object') {
    record.deal = { ...blankDeal(), ...payload.deal };
    if (!Array.isArray(record.deal.sources) || !record.deal.sources.length) record.deal.sources = defaultStack();
  }
  syncActive();
  state.cases.push(record);
  openCase(record.id);
  return record.id;
}

/**
 * The group, with the platform filled in from the audit.
 * Your own business is the platform — you should not have to type its profit twice.
 */
function groupInput() {
  const audit = runAudit(state.audit);
  return {
    ...state.group,
    holdcoEbitda: state.group.holdcoEbitda ?? audit.defensibleEbitda ?? 0,
    holdcoIndustry: state.group.holdcoIndustry ?? state.audit.business.sector,
  };
}

/** Everything the twenty-year projection needs, with the platform taken from the audit. */
function futureInput() {
  const audit = runAudit(state.audit);
  return {
    startingProfit: audit.defensibleEbitda || 500_000,
    todayValue: audit.achievableValue,
    industryId: state.audit.business.sector,
    ...state.future,
    years: 20,
  };
}

/** Add a business to the group, priced at what one like it usually costs. */
function addNode(industryId) {
  const industry = SECTORS_BY_ID[industryId] ?? SECTORS_BY_ID.generic;
  const id = state.group.nextId;
  state.group.nextId += 1;
  state.group.nodes.push({
    id,
    industryId,
    ebitda: 250_000,
    multiple: industry.low,
    structureId: 'vendor',
    levers: [...(industry.levers ?? [])],
    interestOnly: false,
  });
  state.ui.selectedNode = id;
  notify();
  return id;
}

function removeNode(id) {
  state.group.nodes = state.group.nodes.filter((n) => n.id !== Number(id));
  if (state.ui.selectedNode === Number(id)) state.ui.selectedNode = null;
  notify();
}

function findNode(id) {
  return state.group.nodes.find((n) => n.id === Number(id));
}

function setNode(id, key, value) {
  const node = findNode(id);
  if (node) { node[key] = value; notify(); }
}

function toggleLever(id, leverId) {
  const node = findNode(id);
  if (!node) return;
  const levers = node.levers ?? [];
  node.levers = levers.includes(leverId) ? levers.filter((l) => l !== leverId) : [...levers, leverId];
  notify();
}

/** Pull the deal screen's price and profit from a business on the canvas. */
function dealFromNode(id) {
  const node = findNode(id);
  if (!node) return;
  const price = (node.ebitda || 0) * (node.multiple || 0);
  state.deal.price = price;
  state.deal.ebitda = node.ebitda || 0;
  state.deal.sources = defaultStack().map((s) =>
    (s.id === 'seller' ? { ...s, amount: price } : s));
  notify();
}

/** Turn a restructuring lever on or off. */
function toggleRepair(id) {
  const chosen = state.repair.chosen;
  state.repair.chosen = chosen.includes(id) ? chosen.filter((x) => x !== id) : [...chosen, id];
  notify();
}

function setRepairParam(id, key, value) {
  if (!state.repair.params[id]) state.repair.params[id] = {};
  state.repair.params[id][key] = value;
  notify();
}

function setSource(sourceId, key, value) {
  const source = state.deal.sources.find((s) => s.id === sourceId);
  if (source) { source[key] = value; notify(); }
}

/** One switch across the whole group — the fastest way to show what terms are worth. */
function stretchAll(on) {
  for (const n of state.group.nodes) n.interestOnly = on;
  notify();
}

function clearGroup() {
  state.group = blankGroup();
  state.ui.selectedNode = null;
  notify();
}

const listeners = new Set();
const subscribe = (fn) => { listeners.add(fn); return () => listeners.delete(fn); };
const notify = () => { save(); listeners.forEach((fn) => fn()); };

function save() {
  syncActive();
  try {
    localStorage.setItem(KEY, JSON.stringify({
      cases: state.cases,
      activeCaseId: state.activeCaseId,
      ui: state.ui,
      config: {
        currency: config.currency,
        dscrFloor: config.dscrFloor,
        multipleFloor: config.multipleFloor,
        ebitdaHaircutCap: config.ebitdaHaircutCap,
        deltas: config.deltas,
        ceilings: config.ceilings,
      },
    }));
  } catch { /* private browsing, quota, embedded contexts — the tool still works */ }
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed.cases) && parsed.cases.length) {
        state.cases = parsed.cases.map((c) => ({
          ...blankCase(c.name ?? 'Untitled case'),
          ...c,
          audit: { ...blankAudit(), ...(c.audit ?? {}) },
          group: { ...blankGroup(), ...(c.group ?? {}) },
          capital: { ...blankCapital(), ...(c.capital ?? {}) },
          future: { ...blankFuture(), ...(c.future ?? {}) },
          deal: { ...blankDeal(), ...(c.deal ?? {}) },
          repair: { ...blankRepair(), ...(c.repair ?? {}) },
        }));
        state.activeCaseId = state.cases.some((c) => c.id === parsed.activeCaseId)
          ? parsed.activeCaseId : state.cases[0].id;
      }
      if (parsed.ui) state.ui = { ...state.ui, ...parsed.ui };
      if (parsed.config) applyConfig(parsed.config);
    } else {
      // One audit saved before cases existed becomes the first case rather than being lost.
      const legacy = JSON.parse(localStorage.getItem(LEGACY_KEY) ?? 'null');
      if (legacy?.audit) {
        const record = blankCase(legacy.audit?.business?.name || 'Saved case');
        record.audit = { ...blankAudit(), ...legacy.audit };
        if (legacy.group) record.group = { ...blankGroup(), ...legacy.group };
        if (legacy.capital) record.capital = { ...blankCapital(), ...legacy.capital };
        if (legacy.future) record.future = { ...blankFuture(), ...legacy.future };
        state.cases = [record];
        state.activeCaseId = record.id;
      }
      if (legacy?.config) applyConfig(legacy.config);
    }
  } catch { /* corrupt or unreadable storage is not worth a broken page */ }

  if (!state.cases.length) {
    const record = blankCase('New case');
    state.cases = [record];
    state.activeCaseId = record.id;
  }
  const live = activeCase();
  state.audit = live.audit;
  state.group = live.group;
  state.capital = live.capital;
  state.future = live.future;
  state.deal = live.deal;
  state.repair = live.repair;
}

/** Deep-set on the audit: setAudit('financials.claimedEbitda', 1000000). */
function setAudit(path, value) {
  const keys = path.split('.');
  let node = state.audit;
  while (keys.length > 1) node = node[keys.shift()];
  node[keys[0]] = value;
  notify();
}

function setScore(id, score) {
  state.audit.scores[id] = score;
  notify();
}

function loadCase(sample) {
  state.audit = {
    ...blankAudit(),
    business: { ...sample.business },
    askingPrice: sample.askingPrice,
    financials: { ...DEFAULT_FINANCIALS, ...sample.financials },
    scores: { ...blankAudit().scores, ...sample.scores },
  };
  const record = activeCase();
  if (record && record.name === 'New case') record.name = sample.business.name || sample.label;
  notify();
}

const loadBrokerCase = () => loadCase(BROKER_CASE);

function resetAudit() {
  state.audit = blankAudit();
  notify();
}

function resetTuning() {
  resetConfig();
  notify();
}

// ── The three questions ───────────────────────────────────────────────────
function pillarCost(pillar, r) {
  if (pillar === 'credibility') {
    const lost = r.haircuts.lines.reduce((s, l) => s + l.appliedAmount, 0);
    return { headline: `−${money(lost)}`, detail: 'of the profit you are claiming', critical: lost > 0 };
  }
  if (pillar === 'capital') {
    return {
      headline: `${turns(r.dscr.dscr)} cover`,
      detail: r.dscr.passes ? 'a buyer can afford the repayments' : 'a buyer cannot afford the repayments',
      critical: !r.dscr.passes,
    };
  }
  const turnsLost = r.penalties.lines.filter((l) => l.pillar === 'closing').reduce((s, l) => s + l.penalty, 0);
  return { headline: `−${turns(turnsLost)}`, detail: 'off the price, on the risk it falls over', critical: turnsLost > 0 };
}

function threeCStrip(r) {
  return `
  <div class="grid g3">
    ${['credibility', 'capital', 'closing'].map((id) => {
      const p = PILLARS[id];
      const cost = pillarCost(id, r);
      const score = r.pillarScores[id];
      return `
      <div class="pillar pillar-card" data-pillar="${id}">
        <div class="pillar-name"><span class="dot"></span>${esc(p.name)}</div>
        <div class="pillar-q">${esc(p.sellSide)}</div>
        ${pillarMeter(score)}
        <div class="between">
          <span class="pillar-cost ${cost.critical ? 'is-critical' : ''}">${cost.headline}</span>
          <span class="muted" style="font-size:13px">${score.toFixed(1)} / 5</span>
        </div>
        <div class="small" style="margin:-6px 0 0">${esc(cost.detail)}</div>
      </div>`;
    }).join('')}
  </div>`;
}

            ${money(r.dscr.freeCashFlow)}. The most anyone could pay on these terms is
            ${money(r.dscr.maxFundablePrice)}. Your price is not ambitious — it is unpayable.`}</p>
    </div>
  </section>` : ''}

  <section>
    <h2 class="headline">Three questions a buyer asks</h2>
    <p class="lede">Score each from one to five. Five is what a buyer hopes to find.</p>
    ${threeCStrip(r)}
    <div style="margin-top:28px">
      ${['credibility', 'capital', 'closing'].map((id) => pillarFold(id, r)).join('')}
    </div>
  </section>

  ${started ? `
  <section>
    <h2 class="headline">What fixing it is worth</h2>
    <p class="lede">Each bar is what you get back if you fixed that one thing and left the other two alone.
    They do not add up on purpose: profit times price means the three multiply, so fixing all three is worth
    <strong>more</strong> than the three figures put together.</p>
    ${pillarBars(pillarUplift(state.audit).map((u) => ({
      name: PILLARS[u.pillar].name, sub: `${u.score.toFixed(1)} / 5 today`,
      value: u.value, color: `var(--${u.pillar})`,
    })))}
    ${planFold()}
  </section>

  ${scaleSection(r)}

  <section>
    <h2 class="headline">What moves the number most</h2>
    <p class="lede">Every question drawn worst answer to best, with where you sit now down the middle,
    ordered by how much rides on it either way. Red is what you would lose if it slipped; green is what
    is still there to win — and the longest green bar is where the next twelve months should go.</p>
    ${tornado(sensitivity(state.audit))}
  </section>

  <section>
    <p class="statement">Fixing it makes the business worth more.
    <span class="up">Buying others makes it worth several times more.</span></p>
    <div class="actions" style="margin-top:26px">
      <button class="btn" data-act="goto" data-view="build">Build the group</button>
      <button class="btn quiet" data-act="export">Export report</button>
      <button class="btn quiet" data-act="print">Print</button>
    </div>
  </section>` : ''}`;
}

function pillarFold(id, r) {
  const p = PILLARS[id];
  const open = state.ui.openPillar === id;
  const items = criteriaForPillar(id);
  const scored = items.filter((c) => c.impact.kind !== 'computed');
  return `
  <div class="fold pillar" data-pillar="${id}" data-open="${open}">
    <button class="fold-head" data-act="toggle-pillar" data-pillar="${id}" aria-expanded="${open}">
      <span class="dot"></span>
      <span class="fold-title">${esc(p.name)}</span>
      <span class="fold-meta">
        <span>${scored.length} questions</span>
        <span>${r.pillarScores[id].toFixed(1)} / 5</span>
        <span class="chev"></span>
      </span>
    </button>
    ${open ? `<div class="fold-body">
      <p class="small" style="margin:0 0 14px">${esc(p.sellSide)}</p>
      ${items.map((c) => critRow(c)).join('')}
    </div>` : ''}
  </div>`;
}

function critRow(c) {
  if (c.impact.kind === 'computed') {
    return `
    <div class="crit">
      <div>
        <div class="crit-name">${esc(c.name)} <span class="badge">worked out for you</span></div>
        <div class="crit-q">${esc(c.question)}</div>
        <div class="crit-anchor">${esc(c.computedNote)}</div>
      </div><div></div>
    </div>`;
  }
  const score = Number(state.audit.scores[c.id] ?? 3);
  const delta = c.impact.kind === 'ebitda'
    ? `worth up to ${pct(deltaFor(c), 0)} of your profit`
    : `worth up to ${turns(deltaFor(c))} on the price`;
  return `
  <div class="crit">
    <div>
      <div class="crit-name">${esc(c.name)}</div>
      <div class="crit-q">${esc(c.question)}</div>
      <div class="crit-anchor">${esc(c.anchors[score] ?? c.anchors[score < 3 ? 1 : 5])}</div>
    </div>
    <div>
      <div class="segs">
        ${[1, 2, 3, 4, 5].map((n) => `<button data-act="score" data-id="${c.id}" data-score="${n}"
          class="${n === score ? 'on' : ''}" aria-label="Score ${n} of 5">${n}</button>`).join('')}
      </div>
      <div class="crit-delta">${delta}</div>
    </div>
  </div>`;
}

function planFold() {
  const plan = remediationPlan(state.audit);
  const traj = restructureTrajectory(state.audit);
  const max = Math.max(...plan.items.map((i) => i.fullUplift), 1);
  return `
  <details class="card" style="margin-top:22px">
    <summary style="cursor:pointer;font-weight:600;font-size:15px">The fix, in order</summary>
    <div style="margin-top:20px">
      ${trajectory(traj.map((t) => ({ label: t.label, value: t.result.achievableValue })))}
      <div class="scroll" style="margin-top:18px">
        <table>
          <thead><tr><th>Fix</th><th class="n">Now</th><th class="n">Worth</th><th class="n">Months</th><th style="width:110px"></th></tr></thead>
          <tbody>
            ${plan.items.map((i) => `
              <tr>
                <td><strong>${esc(i.name)}</strong><div class="hint" style="margin-top:3px">${esc(i.anchorNow)}</div></td>
                <td class="n">${i.currentScore}/5</td>
                <td class="n"><strong>${moneyShort(i.fullUplift)}</strong></td>
                <td class="n muted">${i.months}</td>
                <td>${rankBar(i.fullUplift, max)}</td>
              </tr>`).join('')}
            ${plan.items.length === 0 ? '<tr><td colspan="5" class="muted">Nothing left to fix.</td></tr>' : ''}
          </tbody>
        </table>
      </div>
    </div>
  </details>`;
}

// ── Two: build the group ──────────────────────────────────────────────────
function buildView() {
  const g = groupInput();
  const r = runBuild(g);
  const selected = r.nodes.find((n) => n.id === state.ui.selectedNode) ?? r.nodes[r.nodes.length - 1];
  const band = bandFor(r.groupProfit);
  const failing = r.nodes.filter((n) => !n.passes).length;

  return `
  <section>
    <p class="eyebrow">Step two</p>
    <h1 class="display">Stop selling one. Start owning several.</h1>
    <p class="lede">Small businesses sell cheap. Groups sell dear. You buy at the small price and are paid
    the group price for the same pound of profit. Your own business is the platform — everything you buy
    hangs off it.</p>
    ${spreadDiagram({
      entry: r.nodes.length ? r.blendedEntry : 2.5,
      exit: r.nodes.length ? r.exitMultiple : 7,
      count: Math.max(3, r.nodes.length),
      each: r.nodes.length ? r.acquiredEbitda / r.nodes.length : 250_000,
      platform: r.holdcoEbitda,
    })}
  </section>

  <section>
    ${groupCanvas(r, { selected: selected?.id })}
    <div class="grid g4" style="margin-top:18px">
      ${tile('Profit together', money(r.groupProfit),
        r.synergies > 0 ? `includes ${money(r.synergies)} saved by merging` : 'add a business to start')}
      ${tile('Your cash in', money(r.cashRequired),
        r.cashRequired === 0 ? 'none of it is yours' : 'from your own pocket', r.cashRequired === 0 ? 'flag-good' : '')}
      ${tile('Loan cover', turns(r.dscr), r.passes ? 'the group can pay' : 'below the floor',
        r.passes ? 'flag-good' : 'flag-critical')}
      ${tile('Group worth', money(r.equityValue), `${turns(r.exitMultiple)} on the profit, less debt`, 'flag-good')}
    </div>
    ${failing ? `
      <div class="note ${r.passes ? '' : 'critical'}" style="margin-top:22px">
        <p style="margin:0 0 12px"><strong>${failing} of these cannot pay for themselves at that price.</strong>
        ${r.passes
          ? 'Together with your business the group still covers it — that is what a platform is for.'
          : 'And the group cannot carry them either.'}
        The fastest fix is the terms.</p>
        <button class="btn" data-act="stretch-all" data-on="true">Ask every seller for interest only</button>
      </div>` : ''}
    ${r.nodes.length && r.nodes.every((n) => n.interestOnly) ? `
      <div class="note good" style="margin-top:22px">
        <p style="margin:0"><strong>Nothing about the businesses changed. Only the terms did.</strong>
        Same price, same profit, same people.
        <button class="btn quiet tiny" data-act="stretch-all" data-on="false" style="margin-left:8px">Put it back</button></p>
      </div>` : ''}
    ${r.nodes.length ? `
      <p class="small" style="margin-top:14px">At ${money(r.groupProfit)} of profit, the people bidding are
      ${esc(band.who.toLowerCase())}.</p>` : ''}
  </section>

  ${portfolioSection(g)}

  <section>
    <h2 class="headline">Add a business</h2>
    <p class="lede">Tap one to add it. Drag it anywhere on the web — the group only cares what it earns.</p>
    ${industryTray(SECTORS.filter((s) => s.id !== 'generic'))}
  </section>

  ${selected ? nodeInspector(selected) : ''}

  <section>
    <h2 class="headline">How you pay for it</h2>
    <p class="lede">Three of these four need none of your money. Not a trick — it is what a seller who wants
    out will agree to, because he cares more about the number than about having it all on Friday.</p>
    <div class="grid g2">
      ${STRUCTURES.map((s) => `
        <div class="card">
          <div class="between" style="margin-bottom:8px">
            <strong style="font-size:16px">${esc(s.name)}</strong>
            <span class="badge ${s.depositPct === 0 ? 'good' : ''}">${s.depositPct === 0 ? 'no money down' : pct(s.depositPct, 0) + ' down'}</span>
          </div>
          <p class="body" style="margin:0 0 10px">${esc(s.plain)}</p>
          <p class="hint" style="margin:0"><strong>Use it when:</strong> ${esc(s.whenToUse)}<br />
          <strong>Watch for:</strong> ${esc(s.watchFor)}</p>
        </div>`).join('')}
    </div>
    ${capitalFold()}
  </section>

  <section class="actions">
    <button class="btn" data-act="goto" data-view="difference">See the difference</button>
    <button class="btn quiet" data-act="clear-group">Start again</button>
  </section>`;
}

function capitalFold() {
  const cash = state.capital.cash;
  const options = capitalOptions(cash, { industryId: state.capital.industryId, stretch: state.capital.stretch });
  return `
  <details class="card" style="margin-top:18px">
    <summary style="cursor:pointer;font-weight:600;font-size:15px">What can you do with what you have?</summary>
    <div style="margin-top:20px">
      <div class="grid g2" style="margin-bottom:18px">
        ${numField('Cash you could put in', 'cash', cash, 'Try zero. It changes less than you would think.', 'capital')}
        <div class="field">
          <label>Industry you would buy in</label>
          <select data-capital="industryId" data-kind="text">
            ${SECTORS.filter((s) => s.id !== 'generic').map((x) => `<option value="${x.id}" ${x.id === state.capital.industryId ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}
          </select>
        </div>
      </div>
      <label class="switch" style="margin-bottom:18px">
        <input type="checkbox" data-capital="stretch" data-kind="bool" ${state.capital.stretch ? 'checked' : ''} />
        <span>Seller takes interest only, with the lump at the end</span>
      </label>
      <div class="scroll">
        <table>
          <thead><tr><th>Structure</th><th class="n">Most you can pay</th><th class="n">Enough?</th><th>What limits you</th></tr></thead>
          <tbody>
            ${options.map((o) => `
              <tr>
                <td><strong>${esc(o.structure.name)}</strong></td>
                <td class="n"><strong>${turns(o.maxMultiple)}</strong><div class="hint">times profit</div></td>
                <td class="n">${o.clearsIndustryEntry ? '<span class="badge good">yes</span>' : '<span class="badge critical">no</span>'}
                  <div class="hint">they cost ${turns(o.industryEntry)}</div></td>
                <td class="muted">${esc(o.limitedBy)}${o.needsCash && isFinite(o.cashLimitedProfit)
                  ? ` — ${money(o.cashLimitedProfit)} of profit at most` : ''}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div class="note" style="margin-top:20px">
        <p style="margin:0"><strong>Your cash is not what stops you.</strong> What decides how much you can pay
        is the price per pound of profit and how long the seller gives you — not what is in your account.</p>
      </div>
    </div>
  </details>`;
}

function nodeInspector(node) {
  const industry = SECTORS_BY_ID[node.industryId] ?? SECTORS_BY_ID.generic;
  const levers = node.levers ?? [];
  return `
  <section>
    <h2 class="headline">${esc(industry.name)}</h2>
    <p class="lede">${esc(industry.why)}</p>
    <div class="inspector">
      <div class="grid g3" style="margin-bottom:20px">
        ${numField('Its profit a year', `nodes.${node.id}.ebitda`, node.ebitda, null, 'group')}
        ${numField('Times profit you pay', `nodes.${node.id}.multiple`, node.multiple,
          `Ones like this go for about ${industry.low.toFixed(1)}x.`, 'group')}
        ${tile('Costs you', money(node.price), `${money(node.cashNeeded)} of your own cash`)}
      </div>

      ${!node.passes ? `
        <div class="note critical" style="margin-bottom:20px">
          <p style="margin:0"><strong>On its own this one does not cover its repayments.</strong>
          At ${turns(node.multiple)} it needs ${money(node.service)} a year and only makes ${money(node.freeCashFlow)}.
          Pay ${turns(node.maxMultiple)} instead, merge more of it, or have the seller take interest only.</p>
        </div>` : ''}

      <label class="switch" style="margin-bottom:22px">
        <input type="checkbox" data-group="nodes.${node.id}.interestOnly" data-kind="bool"
               ${node.interestOnly ? 'checked' : ''} />
        <span>The seller takes interest only, and the lump at the end</span>
      </label>

      <p class="eyebrow">How you pay for it</p>
      <div class="choices" style="margin-bottom:22px">
        ${STRUCTURES.map((s) => `
          <button class="choice ${s.id === node.structureId ? 'on' : ''}"
                  data-act="set-structure" data-node="${node.id}" data-structure="${s.id}">
            <span class="choice-mark"></span>
            <span class="choice-body">
              <span class="choice-name">${esc(s.name)}</span>
              <span class="choice-plain">${esc(s.plain)}</span>
              <span class="choice-tag">${s.depositPct === 0 ? 'None of your money' : `${pct(s.depositPct, 0)} of your money`}
                · ${s.holidayMonths ? `${s.holidayMonths} months before the first payment` : 'payments start straight away'}</span>
            </span>
          </button>`).join('')}
      </div>

      ${fitNote(node)}

      <p class="eyebrow">What you merge <span class="muted" style="font-weight:400;text-transform:none;letter-spacing:0">— up to ${pct(MAX_SYNERGY, 0)} of its profit</span></p>
      <div class="choices" style="margin-bottom:20px">
        ${INTEGRATION_LEVERS.map((l) => `
          <button class="choice ${levers.includes(l.id) ? 'on' : ''}"
                  data-act="toggle-lever" data-node="${node.id}" data-lever="${l.id}">
            <span class="choice-mark"></span>
            <span class="choice-body">
              <span class="choice-name">${esc(l.name)} <span class="muted" style="font-weight:400">+${pct(l.saving, 0)}</span></span>
              <span class="choice-plain">${esc(l.plain)}</span>
            </span>
          </button>`).join('')}
      </div>

      <p class="eyebrow">Where the money comes from</p>
      ${fundingStack(node)}
      <div style="margin:22px 0 6px">${dealCashflow(node)}</div>
      ${node.structure.holidayMonths ? `
        <p class="small" style="margin:0 0 22px">Nothing leaves the business for the first
        ${node.structure.holidayMonths} months. That holiday is the difference between a deal that
        strangles you in year one and one that funds itself.</p>` : '<div style="height:16px"></div>'}

      <div class="grid g4">
        ${tile('Profit it adds', money(node.contributed),
          node.synergy > 0 ? `${money(node.ebitda)} plus ${money(node.synergy)} saved` : 'nothing merged yet')}
        ${tile('Repayments', money(node.service), node.structure.holidayMonths
          ? `nothing for ${node.structure.holidayMonths} months` : 'from month one')}
        ${tile('Loan cover', turns(node.dscr), node.passes ? 'it pays for itself' : 'it does not',
          node.passes ? 'flag-good' : 'flag-critical')}
        ${tile('Your cash', money(node.cashNeeded), node.cashNeeded === 0 ? 'none' : 'deposit')}
      </div>
      <div class="actions" style="margin-top:18px">
        <button class="btn quiet tiny" data-act="remove-node" data-node="${node.id}">Remove this business</button>
      </div>
    </div>
  </section>`;
}

  const h = horizon(futureInput());
  const first = h.rows[0];

  return `
  <section>
    <p class="eyebrow">Step three</p>
    <h1 class="display">Same business. Twenty years apart.</h1>
    <p class="lede">One owner keeps it and grows it. The other uses it as a platform and buys
    ${f.maxBusinesses} more alongside. Drag the year, or press play.</p>

    <div class="race" id="race-numbers">
      <div class="race-side">
        <div class="k">Keep it and grow it</div>
        <div class="v" id="fig-alone">${money(first.aloneValue)}</div>
        <div class="s">one business, sold once</div>
      </div>
      <div class="race-side group">
        <div class="k">Buy others alongside it</div>
        <div class="v" id="fig-group">${money(first.groupEquity)}</div>

    <div class="scrub">
      <button class="btn play" id="play" aria-label="Play the twenty years">▶</button>
      <input type="range" id="year" min="1" max="20" step="0.1" value="1" aria-label="Year" />
      <span class="scrub-year" id="fig-year">Year 1</span>
    </div>

    <div class="chips" id="chips" aria-live="polite">
      <span class="chip self">Your business</span>
    </div>

    <div style="margin-top:30px">${raceChart(h.rows)}</div>
  </section>

  <section>
    <div class="grid g4">
      ${h.milestones.map((m) => tile(`Year ${m.year}`, money(m.groupEquity),
        `on your own: ${moneyShort(m.aloneValue)}`, m.year === 20 ? 'flag-good' : '')).join('')}
    </div>
    <p class="small" style="margin-top:14px">Spare cash pays the debt down as it goes. Buying stops in any year
    where another deal would push the group below ${turns(config.dscrFloor)} cover, and stops for good at
    ${f.maxBusinesses} businesses — nobody runs more than that well. It is a ceiling, not a forecast.</p>

  <section>
    <p class="statement">You put in ${money(h.totalCashIn)}.

    <p class="lede" style="margin-top:16px">Three of the four structures need no deposit, so the only money that
    ever leaves your pocket is what you spend learning to do it properly. That is the whole case for getting
    help: not a cost against the business, but the only cash in the deal.</p>
  </section>

  <section>
    <h2 class="headline">Change the assumptions</h2>
    <div class="grid g3">
      ${numField('Businesses a year', 'dealsPerYear', f.dealsPerYear, 'Two is busy. One is realistic.', 'future')}
      ${numField('Profit of each', 'avgDealProfit', f.avgDealProfit, 'What a typical target earns.', 'future')}
      ${numField('Stop after', 'maxBusinesses', f.maxBusinesses, 'How many you can actually run.', 'future')}
      ${rateField('Saved by merging %', 'synergyRate', f.synergyRate, 0, 'future')}
      ${numField('What you spend on advice', 'advisoryCost', f.advisoryCost, 'Over the whole programme.', 'future')}
      <div class="field">
        <label>How you pay for them</label>
        <select data-future="structureId" data-kind="text">
          ${STRUCTURES.map((s) => `<option value="${s.id}" ${s.id === f.structureId ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}

      <div class="note critical" style="margin-top:22px">
        <p style="margin:0"><strong>Buying paused in ${h.pausedYears} year${h.pausedYears === 1 ? '' : 's'}.</strong>

  <section>
    <h2 class="headline">Why the group is worth more per pound</h2>
    <p class="lede">Nothing about the businesses changes. The buyer does.</p>
    <div class="scroll">
      <table>
        <thead><tr><th>Profit</th><th class="n">Extra on the price</th><th>Who is buying</th></tr></thead>
        <tbody>
          ${SIZE_BANDS.map((b) => {
            const here = bandFor(h.rows[h.rows.length - 1].groupProfit) === b;

              <td>${esc(label)}${here ? ' <span class="badge good">you end here</span>' : ''}</td>
              <td class="n">${b.premium ? `+${turns(b.premium)}` : '—'}</td>
              <td class="muted">${esc(b.who)}</td></tr>`;

// ── Tune ──────────────────────────────────────────────────────────────────

    <p class="lede">The questions are not controversial. The numbers behind them are. If one cannot be defended

      <div class="note" style="margin-bottom:22px">

        <button class="btn quiet tiny" data-act="reset-config" style="margin-left:10px">Put them all back</button></p>

  <section>
    <h2 class="headline">Limits</h2>

        <p class="hint">Below this no lender goes near it. Shipped at ${DEFAULT_CONFIG.dscrFloor}.</p></div>

      <div class="field"><label>Most profit we will cut %</label>

  <section>

  <section>
    <h2 class="headline">The same three, whichever side you are on</h2>

  return `
  <div class="dock">

    <div class="rule"></div>
    ${item('Price paid', turns(r.achievableMultiple))}
    <div class="rule"></div>

// ── What you would have to become ─────────────────────────────────────────
function scaleSection(r) {
  if (!(r.askingPrice > 0) || !(r.defensibleEbitda > 0) || r.gap <= 0) return '';
  const f = state.future;
  const scale = requiredScale({
    targetPrice: r.askingPrice,
    currentProfit: r.defensibleEbitda,
    industryId: state.audit.business.sector,
    avgDealProfit: f.avgDealProfit,
    dealsPerYear: f.dealsPerYear,
    synergyRate: f.synergyRate,
  });
  if (!scale) return '';

  return `
  <section>
    <h2 class="headline">What you would have to become</h2>
    <p class="lede">You are not wrong to want ${money(r.askingPrice)}. You are wrong about the size of
    business that gets it. Work backwards from your number and it lands on a business
    ${scale.alreadyThere ? 'you already are' : 'you are not yet'}.</p>

    <div class="grid g4">
      ${tile('You make now', money(r.defensibleEbitda), `worth ${turns(r.achievableMultiple)} of it`)}
      ${tile('You would need', money(scale.requiredProfit), `at ${turns(scale.requiredMultiple)}, the best in your industry at that size`, 'flag-good')}
      ${tile('That is', scale.alreadyThere ? 'nothing more' : `${scale.businesses} businesses`,
        scale.alreadyThere ? 'you are already big enough' : `of ${money(f.avgDealProfit)} profit each`)}
      ${tile('Taking', scale.alreadyThere ? '—' : `${scale.years} year${scale.years === 1 ? '' : 's'}`,
        scale.alreadyThere ? 'fix the business instead' : `at ${f.dealsPerYear} a year`)}
    </div>

    <div class="note ${scale.alreadyThere ? 'good' : ''}" style="margin-top:22px">
      <p style="margin:0">${scale.alreadyThere
        ? `Your business is already the right size for ${money(r.askingPrice)} — what is missing is
           quality, not scale. The work is on this page, not the next one.`
        : scale.bandJump
          ? `<strong>The jump is not just more profit — it is a different bracket of buyer.</strong>
             Today the people bidding are ${esc(scale.todayBand.who.toLowerCase())}. At
             ${money(scale.requiredProfit)} they are ${esc(scale.band.who.toLowerCase())}, and they pay
             ${turns(scale.requiredMultiple)} rather than ${turns(r.achievableMultiple)}. Same trade,
             different room.`
          : `You need ${money(scale.profitNeeded)} more profit than you make. Buying it is faster than
             growing it, and on the right terms it costs you nothing up front.`}</p>
    </div>
    ${!scale.alreadyThere ? `
      <div class="actions" style="margin-top:20px">
        <button class="btn" data-act="goto" data-view="build">Show me how</button>
      </div>` : ''}
  </section>`;
}

// ── Portfolio health ──────────────────────────────────────────────────────
function portfolioSection(group) {
  const health = portfolioHealth(group);
  if (health.nodes.length < 3) return '';

  const worst = health.worstFirst.slice(0, 6);
  const max = Math.max(...health.nodes.map((n) => n.dscr).filter(isFinite), config.dscrFloor * 2, 1);

  return `
  <section>
    <h2 class="headline">Which ones are carrying the rest</h2>
    <p class="lede">${health.failing.length
      ? `The group average hides it. Priced one at a time on their own cash,
         <strong>${health.failing.length} of ${health.nodes.length}</strong> cannot pay for themselves.`
      : 'Every one of them pays for itself. That is rarer than it sounds.'}</p>

    <div class="scroll">
      <table>
        <thead><tr><th>Business</th><th class="n">Profit</th><th class="n">Paid</th>
          <th class="n">Cover</th><th style="width:150px"></th><th class="n">Should have paid</th></tr></thead>
        <tbody>
          ${worst.map((n) => `
            <tr>
              <td><strong>${esc(n.industry.name)}</strong><div class="hint">${esc(n.structure.name)}</div></td>
              <td class="n">${money(n.ebitda)}</td>
              <td class="n">${turns(n.multiple)}</td>
              <td class="n ${n.passes ? 'is-good' : 'is-critical'}"><strong>${turns(n.dscr)}</strong></td>
              <td>${rankBar(Math.min(n.dscr, max), max)}</td>
              <td class="n ${n.passes ? 'muted' : ''}">${n.passes ? '—' : turns(n.maxMultiple)}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>

    ${health.failing.length ? `
      <div class="note critical" style="margin-top:22px">
        <p style="margin:0"><strong>Overpaid by ${money(health.overpaid)} across ${health.failing.length}
        deals.</strong> Bought at what each could actually carry, the same group would be worth
        ${money(health.repriced.equityValue)} instead of ${money(health.equityValue)} —
        a difference of ${money(health.drag)}. That is the cost of not running the number before signing.</p>
      </div>` : ''}
  </section>`;
}

/** Whether the business next door really merges with yours, or just shares an owner. */
function fitNote(node) {
  const platformIndustry = state.group.holdcoIndustry ?? state.audit.business.sector;
  const fit = industryFit(platformIndustry, node.industryId);
  if (fit.same) {
    return `
    <div class="note good" style="margin-bottom:20px">
      <p style="margin:0"><strong>Same trade as yours.</strong> One office, one yard, one set of vans,
      and a customer list that buys both. Everything that can merge, merges.</p>
    </div>`;
  }
  return `
  <div class="note ${fit.shared.length >= 2 ? '' : 'critical'}" style="margin-bottom:20px">
    <p style="margin:0"><strong>${esc(fit.verdict)}</strong>
    ${fit.shared.length
      ? `Out of ${fit.target.name.toLowerCase()}, ${fit.shared.length} of the savings genuinely apply to
         a ${fit.platform.name.toLowerCase()} platform: ${fit.shared.map((id) => esc(LEVER_NAMES[id])).join(', ')}.`
      : 'Almost none of the savings carry across.'}
    ${fit.only.length ? ` The rest — ${fit.only.map((id) => esc(LEVER_NAMES[id])).join(', ')} — you would be
      claiming without a reason.` : ''}</p>
  </div>`;
}

        </button>

  <section>
    <h2 class="headline">Where the money comes from</h2>
    <div class="stack">
      ${SOURCE_TYPES.map((type) => sourceRow(type, d.sources.find((s) => s.id === type.id) ?? blankSource(type.id))).join('')}

  <section>

         ${turns(r.minDscr)} cover.`

    <div class="grid g4" style="margin-top:22px">

              <td class="n"><strong>${money(s.proceeds)}</strong></td>
              <td class="n ${s.amount > 0 && s.proceeds / s.amount >= 1 ? 'is-good' : 'muted'}">
                ${s.amount > 0 ? `${(s.proceeds / s.amount).toFixed(1)}x` : '—'}</td>
            </tr>`).join('')}
          ${r.shares.length === 0 ? '<tr><td colspan="5" class="muted">Nobody owns any equity yet — put something in above.</td></tr>' : ''}
        </tbody>
      </table>
    </div>
    ${r.cashIn === 0 && r.yourProceeds > 0 ? `
      <p class="statement" style="margin-top:28px">You put in nothing.
      <span class="up">You walk away with ${money(r.yourProceeds)}.</span></p>` : ''}
  </section>`;
}

function sourceRow(type, source) {
  const isDebt = type.kind === 'debt';
  const mode = REPAYMENT_MODES.find((m) => m.id === source.mode) ?? REPAYMENT_MODES[0];
  const showsBalloon = isDebt && (source.mode === 'balloon' || source.mode === 'interest' || source.mode === 'bullet');

  return `
  <div class="card">
    <div class="between" style="margin-bottom:14px">
      <div>
        <strong style="font-size:16px">${esc(type.name)}</strong>
        <span class="badge" style="margin-left:8px">${isDebt ? 'has to be repaid' : 'takes a share instead'}</span>
        <p class="hint" style="margin:6px 0 0;max-width:62ch">${esc(type.plain)}${type.plainTerms ? ` ${esc(type.plainTerms)}` : ''}</p>
      </div>
    </div>
    <div class="grid ${isDebt ? 'g4' : 'g3'}">
      ${numField('Amount', `${type.id}.amount`, source.amount, null, 'source')}
      ${isDebt ? `
        ${rateField('Rate %', `${type.id}.rate`, source.rate, 1, 'source')}
        <div class="field">
          <label>How it is repaid</label>
          <select data-source="${type.id}.mode" data-kind="text">
            ${REPAYMENT_MODES.map((m) => `<option value="${m.id}" ${m.id === source.mode ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}
          </select>
          <p class="hint">${esc(mode.plain)}</p>
        </div>
        ${numField('Due after, years', `${type.id}.termYears`, source.termYears, null, 'source')}
        ${source.mode === 'balloon' ? numField('Paid down over, years', `${type.id}.amortYears`, source.amortYears,
          'Longer than the term is what leaves a lump at the end.', 'source') : ''}
        ${numField('First payment after, months', `${type.id}.holidayMonths`, source.holidayMonths,
          'The holiday. Nothing leaves the business until then.', 'source')}
      ` : `
        <div class="field">
          <label>Share of the business taken</label>
          <input data-source="${type.id}.equityPct" data-kind="rate"
                 value="${source.equityPct === null || source.equityPct === undefined ? '' : (source.equityPct * 100).toFixed(0)}"
                 placeholder="in proportion" inputmode="decimal" />
          <p class="hint">Leave blank to split in proportion to what everyone put in.</p>
        </div>
        ${type.id === 'investor' ? rateField('Preferred return %', `${type.id}.prefRate`, source.prefRate ?? 0, 1, 'source') : ''}
      `}
    </div>
    ${isDebt && source.holidayMonths > 0 ? `
      <label class="switch" style="margin-top:14px">
        <input type="checkbox" data-source="${type.id}.accrueDuringHoliday" data-kind="bool"
               ${source.accrueDuringHoliday ? 'checked' : ''} />
        <span>Interest still builds up during the holiday</span>
      </label>` : ''}
    ${showsBalloon && source.amount > 0 ? `
      <p class="hint" style="margin-top:12px">${esc(mode.name)} — ${money(tranche(source, source.termYears + 1).balloon)}
      falls due in year ${source.termYears}.</p>` : ''}
  </div>`;
}

// ── Restructure what you already own ──────────────────────────────────────
function repairView() {
  const group = groupInput();
  const built = runBuild(group);
  const plan = repairPlan(group, state.repair);
  const floor = config.dscrFloor;

  if (built.nodes.length === 0) {
    return `
    <section>
      <p class="eyebrow">Restructure</p>
      <h1 class="display">Nothing to fix yet.</h1>
      <p class="lede">This screen works on a group you already own. Add the businesses you have bought
      on the group screen — what they earn, what you paid, and how you funded them — and this will
      tell you what can be done about the shape they are in.</p>
      <div class="actions">
        <button class="btn" data-act="goto" data-view="build">Add what you own</button>
        <button class="btn quiet" data-act="scenario" data-scenario="cover">Load a portfolio that needs it</button>
      </div>
    </section>`;
  }

  return `
  <section>
    <p class="eyebrow">Restructure</p>
    <h1 class="display">${plan.before.cover >= floor
      ? 'The shape is sound.'
      : 'Bought well. Structured badly.'}</h1>
    <p class="lede">${plan.before.cover >= floor
      ? `The group covers its repayments ${turns(plan.before.cover)} over. There is still room to make it
         cheaper — every lever below works whether or not you are in trouble.`
      : `The group makes ${money(plan.before.profit)} and owes ${money(plan.before.service)} a year against it.
         That is ${turns(plan.before.cover)} cover, under the ${turns(floor)} a lender wants. Nothing about
         these businesses has to change for that to be fixed. The debt does.`}</p>

    <div class="grid g4">
      ${tile('Owed', money(plan.before.debt), 'across every business')}
      ${tile('Repayments', money(plan.before.service), 'every year')}
      ${tile('Cover now', turns(plan.before.cover), plan.before.cover >= floor ? 'above the floor' : 'below the floor',
        plan.before.cover >= floor ? 'flag-good' : 'flag-critical')}
      ${tile('Cover after', turns(plan.after.cover),
        plan.fixed ? 'fixed' : state.repair.chosen.length ? 'still short' : 'pick something below',
        plan.fixed ? 'flag-good' : '')}
    </div>
  </section>

  <section>
    <h2 class="headline">Six things you can do about it</h2>
    <p class="lede">Turn them on one at a time and watch what each is worth. They run cheapest first,
    which is also the order anyone sensible would try them.</p>
    <div class="grid g2">
      ${REPAIR_ACTIONS.map((a) => leverCard(a, group, plan)).join('')}
    </div>
  </section>

  ${state.repair.chosen.length ? `
  <section>
    <h2 class="headline">How it gets there</h2>
    ${coverWaterfall(plan.steps, floor)}
    <div style="margin-top:26px">
      ${beforeAfter([
        { label: 'Owed', before: money(plan.before.debt), after: money(plan.after.debt),
          afterGood: plan.after.debt < plan.before.debt },
        { label: 'Repayments a year', before: money(plan.before.service), after: money(plan.after.service),
          afterGood: plan.after.service < plan.before.service },
        { label: 'Profit', before: money(plan.before.profit), after: money(plan.after.profit) },
        { label: 'Cover', before: turns(plan.before.cover), after: turns(plan.after.cover),
          beforeBad: plan.before.cover < floor, afterGood: plan.after.cover >= floor },
        { label: 'Cash it costs you', before: money(0), after: money(plan.cashIn),
          afterGood: plan.cashIn === 0 },
      ], { beforeLabel: 'As it stands', afterLabel: 'Restructured' })}
    </div>

    <div class="note ${plan.fixed ? 'good' : 'critical'}" style="margin-top:24px">
      <p style="margin:0"><strong>${plan.fixed
        ? `Cover goes from ${turns(plan.before.cover)} to ${turns(plan.after.cover)}${plan.cashIn === 0 ? ' without a penny of your own money' : ''}.`
        : `Still ${turns(plan.after.cover)} against a ${turns(floor)} floor.`}</strong>
      ${plan.serviceSaved > 0 ? `That is ${money(plan.serviceSaved)} a year that stops leaving the business.` : ''}
      ${plan.deferred ? ' Bear in mind that stretching a term or paying interest only moves money into the future rather than removing it — the balance is still there at the end.' : ''}
      ${plan.sold.length ? ` You have let go of ${plan.sold.length} ${plan.sold.length === 1 ? 'business' : 'businesses'}, and ${money(plan.sold.reduce((s, n) => s + n.contributed, 0))} of profit with ${plan.sold.length === 1 ? 'it' : 'them'}.` : ''}</p>
    </div>
  </section>` : ''}

  <section>
    <h2 class="headline">What each one is actually worth</h2>
    <p class="lede">Every lever on its own, from where you are now. The order tells you where to start —
    and note where putting your own money in comes.</p>
    <div class="scroll">
      <table>
        <thead><tr><th>Lever</th><th class="n">Cover after</th><th class="n">Saved a year</th>
          <th class="n">Costs you</th><th>What it really does</th></tr></thead>
        <tbody>
          ${REPAIR_ACTIONS
            .map((a) => ({ action: a, solo: repairPlan(group, { ...state.repair, chosen: [a.id] }) }))
            .sort((x, y) => y.solo.after.cover - x.solo.after.cover)
            .map(({ action, solo }) => `
              <tr>
                <td><strong>${esc(action.name)}</strong></td>
                <td class="n ${solo.fixed ? 'is-good' : ''}"><strong>${turns(solo.after.cover)}</strong></td>
                <td class="n">${solo.serviceSaved > 0 ? money(solo.serviceSaved) : '—'}</td>
                <td class="n ${solo.cashIn > 0 ? 'is-critical' : 'muted'}">${solo.cashIn > 0 ? money(solo.cashIn) : 'nothing'}</td>
                <td class="hint">${esc(action.detail)}</td>
              </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </section>`;
}

function leverCard(action, group, plan) {
  const on = state.repair.chosen.includes(action.id);
  const params = state.repair.params?.[action.id] ?? {};
  const solo = repairPlan(group, { ...state.repair, chosen: [action.id] });
  const field = (p) => (p.kind === 'rate'
    ? rateField(p.label, `${action.id}.${p.key}`, params[p.key] ?? p.value, 1, 'repair')
    : numField(p.label, `${action.id}.${p.key}`, params[p.key] ?? p.value, null, 'repair'));

  return `
  <div class="lever ${on ? 'on' : ''}">
    <div class="lever-head" data-act="toggle-repair" data-repair="${action.id}" role="button" tabindex="0">
      <span class="choice-mark" style="${on ? 'border-color:var(--ink);background:var(--ink)' : ''}"></span>
      <span style="min-width:0">
        <span class="lever-name">${esc(action.name)}</span>
        <div class="lever-plain">${esc(action.plain)}</div>
      </span>
      <span class="lever-effect ${solo.after.cover >= config.dscrFloor ? 'is-good' : ''}">${turns(solo.after.cover)}</span>
    </div>
    ${on ? `
      <div class="lever-params">
        ${field(action.param)}
        ${action.param2 ? field(action.param2) : ''}
      </div>` : ''}
    <div class="lever-detail">${esc(action.detail)}</div>
  </div>`;
}

// ── Worked examples ───────────────────────────────────────────────────────
function examplesView() {
  const examples = allExamples(SCENARIOS);
  return `
  <section>
    <p class="eyebrow">Worked examples</p>
    <h1 class="display">Six of them, all the way through.</h1>
    <p class="lede">Real situations, taken from where they walked in to where the arithmetic put them.
    Every figure here is computed by the same engines the rest of the tool uses — change an assumption on
    the Tune screen and these move with it.</p>
  </section>

  ${examples.map((ex, i) => exampleCard(ex, i + 1)).join('')}

  <section>
    <p class="statement">Six different businesses.
    <span class="up">One arithmetic.</span></p>

      <button class="btn" data-act="goto" data-view="cases">Start one of your own</button>
    </div>

function exampleCard(ex, n) {
  const fmt = (v, kind) => {
    if (typeof v !== 'number') return esc(String(v));
    if (kind === 'turns') return turns(v);
    return money(v);
  };
  const improved = (row) => {
    if (typeof row.before !== 'number' || typeof row.after !== 'number') return true;
    return row.label.toLowerCase().includes('overpaid') || row.label.toLowerCase().includes('owed')
      || row.label.toLowerCase().includes('repayments') || row.label.toLowerCase().includes('cash')
      ? row.after <= row.before
      : row.after >= row.before;
  };

  return `
  <section class="example">
    <div class="example-mark">${n}</div>
    <h2 class="headline" style="max-width:22ch">“${esc(ex.voice)}”</h2>
    <p class="lede">${esc(ex.pain)} ${esc(ex.detail)}</p>

    <div class="badge" style="margin-bottom:18px">What changes: ${esc(ex.remedy)}</div>

    ${beforeAfter(ex.rows.map((r) => ({
      label: r.label,
      before: fmt(r.before, r.fmt),
      after: fmt(r.after, r.fmt),
      beforeBad: typeof r.before === 'number' && !improved(r),
      afterGood: improved(r),
    })), { beforeLabel: 'They walked in with', afterLabel: ex.remedy })}

    ${exampleFigure(ex)}

    <div class="note good" style="margin-top:22px">
      <p style="margin:0">${esc(ex.lesson)}</p>
    </div>

    <div class="actions" style="margin-top:20px">
      <button class="btn quiet" data-act="scenario" data-scenario="${ex.id}">Open this as a case</button>
    </div>
  </section>`;
}

/** One picture per example, chosen for what that particular case turns on. */
function exampleFigure(ex) {
  if (ex.kind === 'scale') {
    return `<div style="margin-top:24px">${gapBar({
      asking: ex.audit.askingPrice,
      achievable: ex.audit.achievableValue,
      fundable: ex.audit.dscr.maxFundablePrice,
    })}</div>`;
  }
  if (ex.kind === 'repair') {
    return `<div style="margin-top:24px">${coverWaterfall(ex.plan.steps, config.dscrFloor)}</div>`;
  }
  if (ex.kind === 'build') {
    return `<div style="margin-top:24px">${trajectory(
      [1, Math.ceil(ex.horizon.rows.length / 2), ex.horizon.rows.length].map((y) => {
        const row = ex.horizon.rows[y - 1];
        return { label: `Year ${row.year}`, value: row.groupEquity };
      }),
    )}</div>`;
  }
  if (ex.kind === 'reprice') {
    const max = Math.max(...ex.health.nodes.map((n) => (isFinite(n.dscr) ? n.dscr : 0)), config.dscrFloor * 2);
    return `
    <div class="scroll" style="margin-top:24px">
      <table>
        <thead><tr><th>Business</th><th class="n">Paid</th><th class="n">Cover</th>
          <th style="width:160px"></th><th class="n">Should have paid</th></tr></thead>
        <tbody>
          ${ex.health.worstFirst.map((node) => `
            <tr>
              <td>${esc(node.industry.name)}</td>
              <td class="n">${turns(node.multiple)}</td>
              <td class="n ${node.passes ? 'is-good' : 'is-critical'}"><strong>${turns(node.dscr)}</strong></td>
              <td>${rankBar(Math.min(node.dscr, max), max)}</td>
              <td class="n ${node.passes ? 'muted' : ''}">${node.passes ? '—' : turns(node.maxMultiple)}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  }
  if (ex.kind === 'merge') {
    return `
    <div class="grid g2" style="margin-top:24px">
      <div class="card">
        <p class="eyebrow" style="margin:0 0 10px">What merges</p>
        ${ex.fit.shared.length
          ? `<ul style="margin:0;padding-left:18px;color:var(--ink-2)">${ex.fit.shared.map((id) => `<li>${esc(LEVER_NAMES[id])}</li>`).join('')}</ul>`
          : '<p class="muted" style="margin:0">Nothing, really.</p>'}
      </div>
      <div class="card">
        <p class="eyebrow" style="margin:0 0 10px">What does not</p>
        ${ex.fit.only.length
          ? `<ul style="margin:0;padding-left:18px;color:var(--ink-3)">${ex.fit.only.map((id) => `<li>${esc(LEVER_NAMES[id])}</li>`).join('')}</ul>`
          : '<p class="muted" style="margin:0">Everything carries across.</p>'}
      </div>
    </div>`;
  }
  if (ex.kind === 'structure') {
    return `
    <div class="scroll" style="margin-top:24px">
      <table>
        <thead><tr><th>How you pay</th><th class="n">Your cash</th><th class="n">Most you can pay</th><th>What limits you</th></tr></thead>
        <tbody>
          ${ex.options.map((o) => `
            <tr${o.needsCash ? '' : ' class="row-total"'}>
              <td>${esc(o.structure.name)}</td>
              <td class="n ${o.needsCash ? 'is-critical' : 'is-good'}">${o.needsCash ? '20% of the price' : 'none'}</td>
              <td class="n">${turns(o.maxMultiple)}</td>
              <td class="muted">${esc(o.limitedBy)}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  }
  return '';
}
