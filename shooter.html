<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Overrun</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #06070e;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: none;
  }
  #game { display: block; width: 100vw; height: 100vh; cursor: crosshair; }

  .hud {
    position: fixed; inset: 16px 22px auto 22px; display: flex;
    justify-content: space-between; align-items: flex-start;
    pointer-events: none; font-variant-numeric: tabular-nums;
  }
  .hud span { text-transform: uppercase; letter-spacing: .18em; font-size: 11px; color: #6f7d9c; }
  .hud b { display: block; font-size: 26px; color: #eaf1ff; font-weight: 700; letter-spacing: .02em; }
  .hud .mid { text-align: center; }
  .hud .right { text-align: right; }

  .bar {
    position: fixed; left: 22px; bottom: 22px; width: min(260px, 40vw);
    pointer-events: none;
  }
  .bar .track { height: 10px; border-radius: 6px; background: #171d33; overflow: hidden; border: 1px solid #232c4a; }
  .bar .fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff5470, #ffa24d); transition: width .12s linear; }
  .bar .lbl { margin-top: 7px; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: #6f7d9c; }
  .bar .lbl em { font-style: normal; color: #ffd166; }

  .toast {
    position: fixed; top: 34%; left: 0; right: 0; text-align: center;
    pointer-events: none; color: #eaf1ff; letter-spacing: .35em; text-indent: .35em;
    font-size: clamp(26px, 6vw, 54px); font-weight: 800; opacity: 0;
    text-shadow: 0 0 28px rgba(90,160,255,.45);
  }

  .overlay {
    position: fixed; inset: 0; display: grid; place-content: center; gap: 14px;
    text-align: center; color: #eaf1ff;
    background: radial-gradient(ellipse at 50% 40%, rgba(22,28,58,.74), rgba(4,5,13,.95));
    backdrop-filter: blur(3px);
  }
  .overlay.hidden { display: none; }
  .overlay h1 { margin: 0; font-size: clamp(40px, 11vw, 84px); font-weight: 800; letter-spacing: .26em; text-indent: .26em; }
  .overlay h1 span { color: #4dd6ff; }
  .overlay p { margin: 0; color: #8b99b8; font-size: 15px; line-height: 1.8; }
  .overlay .score { font-size: 19px; color: #eaf1ff; }
  .overlay .score b { color: #4dd6ff; }
  .key {
    display: inline-block; min-width: 24px; padding: 2px 7px; margin: 0 2px;
    border: 1px solid #2c3760; border-radius: 5px; background: #151c33; color: #cfe0ff; font-size: 13px;
  }
  .hint { margin-top: 8px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: #5c6a8c;
          animation: blink 1.5s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div><span>Score</span><b id="score">0</b></div>
  <div class="mid"><span>Wave</span><b id="wave">1</b></div>
  <div class="right"><span>Best</span><b id="best">0</b></div>
</div>

<div class="bar">
  <div class="track"><div class="fill" id="hpfill"></div></div>
  <div class="lbl" id="weapon">Blaster</div>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="overlay">
  <h1>OVERR<span>U</span>N</h1>
  <p>Survive the waves. Enemies keep coming, and they get worse.</p>
  <p>
    <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> move
    &middot; mouse to aim &middot; hold <span class="key">click</span> to fire
    &middot; <span class="key">Shift</span> to dash
  </p>
  <div class="hint" id="hint">Click to start</div>
</div>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const els = {
  score: document.getElementById("score"),
  wave: document.getElementById("wave"),
  best: document.getElementById("best"),
  hp: document.getElementById("hpfill"),
  weapon: document.getElementById("weapon"),
  toast: document.getElementById("toast"),
  overlay: document.getElementById("overlay"),
  hint: document.getElementById("hint")
};

let W = 0, H = 0;
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", resize);
resize();

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist2 = (a, b) => { const dx = a.x - b.x, dy = a.y - b.y; return dx * dx + dy * dy; };

/* ----------------------------------------------------------- game state */

const WEAPONS = {
  blaster: { name: "Blaster", cooldown: 0.14, spread: 0.05, shots: 1, speed: 720, dmg: 1 },
  rapid:   { name: "Rapid",   cooldown: 0.06, spread: 0.10, shots: 1, speed: 820, dmg: 1 },
  triple:  { name: "Triple",  cooldown: 0.20, spread: 0.06, shots: 3, arc: 0.30, speed: 700, dmg: 1 }
};

let player, bullets, foes, foeShots, pickups, bits;
let state, wave, waveTimer, spawnQueue, score, shake, elapsed;
let best = Number(localStorage.getItem("overrun.best") || 0);
els.best.textContent = best;

function newGame() {
  player = {
    x: W / 2, y: H / 2, r: 13, vx: 0, vy: 0, aim: 0,
    hp: 100, maxHp: 100, iframe: 0, fireTimer: 0,
    weapon: "blaster", weaponTimer: 0, dash: 0, dashCd: 0, flash: 0
  };
  bullets = []; foes = []; foeShots = []; pickups = []; bits = [];
  score = 0; wave = 0; waveTimer = 1.2; spawnQueue = []; shake = 0; elapsed = 0;
  state = "play";
  els.score.textContent = "0";
  els.overlay.classList.add("hidden");
  updateHud();
}

function updateHud() {
  els.hp.style.width = clamp(player.hp / player.maxHp, 0, 1) * 100 + "%";
  els.wave.textContent = Math.max(wave, 1);
  const w = WEAPONS[player.weapon];
  els.weapon.innerHTML = player.weapon === "blaster"
    ? w.name
    : `${w.name} <em>${player.weaponTimer.toFixed(1)}s</em>`;
}

let toastTimer = 0;
function toast(text) {
  els.toast.textContent = text;
  toastTimer = 1.6;
}

/* --------------------------------------------------------------- input */

const keys = new Set();
const mouse = { x: W / 2, y: H / 2, down: false };

addEventListener("keydown", (e) => {
  keys.add(e.code);
  if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); tryStart(); }
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
});
addEventListener("keyup", (e) => keys.delete(e.code));
addEventListener("blur", () => { keys.clear(); mouse.down = false; });

canvas.addEventListener("pointerdown", (e) => {
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.down = true;
  canvas.setPointerCapture(e.pointerId);
  tryStart();
});
canvas.addEventListener("pointermove", (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener("pointerup", () => { mouse.down = false; });
canvas.addEventListener("pointercancel", () => { mouse.down = false; });
els.overlay.addEventListener("pointerdown", tryStart);
addEventListener("contextmenu", (e) => e.preventDefault());

let deadFor = 0;
function tryStart() {
  if (state === "play") return;
  if (state === "over" && deadFor < 0.8) return;   // ignore mashing through death
  newGame();
}

/* ------------------------------------------------------------- spawning */

// Each wave is a shopping list of enemy types, drained a few at a time so
// they trickle in from the edges instead of appearing all at once.
function startWave(n) {
  wave = n;
  const list = [];
  const grunts = 5 + Math.round(n * 2.5);
  for (let i = 0; i < grunts; i++) list.push("grunt");
  for (let i = 0; i < Math.floor(n / 2); i++) list.push("darter");
  for (let i = 0; i < Math.floor((n - 1) / 3); i++) list.push("turret");
  for (let i = 0; i < Math.floor(n / 4); i++) list.push("tank");
  spawnQueue = list.sort(() => Math.random() - 0.5);
  toast("WAVE " + n);
  updateHud();
}

const FOE = {
  grunt:  { r: 13, hp: 2,  speed: 96,  color: "#ff5470", score: 10 },
  darter: { r: 10, hp: 1,  speed: 215, color: "#ffa24d", score: 15 },
  turret: { r: 15, hp: 4,  speed: 52,  color: "#c46bff", score: 25 },
  tank:   { r: 26, hp: 12, speed: 44,  color: "#ff3b3b", score: 60 }
};

function spawnFoe(type, at) {
  const def = FOE[type];
  let x, y;
  if (at) { x = at.x; y = at.y; }
  else {
    // just outside a random edge, so they walk into view
    const m = 40;
    if (Math.random() < 0.5) { x = Math.random() < 0.5 ? -m : W + m; y = rand(0, H); }
    else { x = rand(0, W); y = Math.random() < 0.5 ? -m : H + m; }
  }
  const hpScale = 1 + (wave - 1) * 0.12;
  foes.push({
    type, x, y, r: def.r, hp: Math.ceil(def.hp * hpScale), maxHp: Math.ceil(def.hp * hpScale),
    speed: def.speed * (1 + (wave - 1) * 0.03), color: def.color, hit: 0,
    cd: rand(0.6, 1.8), wobble: rand(0, TAU)
  });
}

/* -------------------------------------------------------------- effects */

function burst(x, y, color, count, power) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * TAU, s = rand(0.3, 1) * power;
    bits.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.25, 0.6), max: 0.6, color, r: rand(1.2, 3) });
  }
}

function dropPickup(x, y) {
  const r = Math.random();
  const kind = r < 0.4 ? "heal" : r < 0.72 ? "rapid" : "triple";
  pickups.push({ x, y, kind, life: 12, bob: rand(0, TAU) });
}

/* -------------------------------------------------------------- updates */

function update(dt) {
  elapsed += dt;
  if (toastTimer > 0) {
    toastTimer -= dt;
    els.toast.style.opacity = String(clamp(Math.min(toastTimer, 0.35) / 0.35, 0, 1) * 0.95);
  }
  shake = Math.max(0, shake - dt * 2.4);

  if (state === "play") updatePlay(dt);
  else if (state === "over") { deadFor += dt; updateBits(dt); }
  else if (state === "menu") {
    // idle drift behind the title screen, no damage
    for (const f of foes) {
      f.wobble += dt;
      f.x += Math.cos(f.wobble * 0.7) * 22 * dt;
      f.y += Math.sin(f.wobble * 0.5) * 22 * dt;
    }
    updateBits(dt);
  }
}

function updatePlay(dt) {
  const p = player;

  // movement
  let mx = 0, my = 0;
  if (keys.has("KeyA") || keys.has("ArrowLeft")) mx -= 1;
  if (keys.has("KeyD") || keys.has("ArrowRight")) mx += 1;
  if (keys.has("KeyW") || keys.has("ArrowUp")) my -= 1;
  if (keys.has("KeyS") || keys.has("ArrowDown")) my += 1;
  const len = Math.hypot(mx, my) || 1;
  mx /= len; my /= len;

  p.dashCd = Math.max(0, p.dashCd - dt);
  if ((keys.has("ShiftLeft") || keys.has("ShiftRight")) && p.dashCd === 0 && (mx || my)) {
    p.dash = 0.16; p.dashCd = 1.1;
    burst(p.x, p.y, "#4dd6ff", 12, 180);
  }
  if (p.dash > 0) p.dash -= dt;

  const accel = p.dash > 0 ? 4200 : 2600;
  p.vx += mx * accel * dt;
  p.vy += my * accel * dt;
  const drag = Math.pow(p.dash > 0 ? 0.35 : 0.0009, dt);
  p.vx *= drag; p.vy *= drag;
  const maxSpeed = p.dash > 0 ? 760 : 300;
  const sp = Math.hypot(p.vx, p.vy);
  if (sp > maxSpeed) { p.vx = p.vx / sp * maxSpeed; p.vy = p.vy / sp * maxSpeed; }
  p.x = clamp(p.x + p.vx * dt, p.r, W - p.r);
  p.y = clamp(p.y + p.vy * dt, p.r, H - p.r);

  p.aim = Math.atan2(mouse.y - p.y, mouse.x - p.x);
  p.iframe = Math.max(0, p.iframe - dt);
  p.flash = Math.max(0, p.flash - dt * 4);

  // weapon timeout back to the default
  if (p.weapon !== "blaster") {
    p.weaponTimer -= dt;
    if (p.weaponTimer <= 0) { p.weapon = "blaster"; toast("BLASTER"); }
  }

  // firing
  p.fireTimer -= dt;
  const w = WEAPONS[p.weapon];
  if (mouse.down && p.fireTimer <= 0) {
    p.fireTimer = w.cooldown;
    for (let i = 0; i < w.shots; i++) {
      const off = w.shots === 1 ? 0 : (i - (w.shots - 1) / 2) * w.arc;
      const a = p.aim + off + rand(-w.spread, w.spread);
      bullets.push({
        x: p.x + Math.cos(p.aim) * 16, y: p.y + Math.sin(p.aim) * 16,
        vx: Math.cos(a) * w.speed, vy: Math.sin(a) * w.speed, r: 3.4, dmg: w.dmg, life: 1.4
      });
    }
    p.vx -= Math.cos(p.aim) * 26; p.vy -= Math.sin(p.aim) * 26;   // recoil
    shake = Math.min(shake + 0.09, 0.5);
    burst(p.x + Math.cos(p.aim) * 20, p.y + Math.sin(p.aim) * 20, "#9fe4ff", 3, 90);
  }

  // waves
  if (spawnQueue.length === 0 && foes.length === 0) {
    waveTimer -= dt;
    if (waveTimer <= 0) { startWave(wave + 1); waveTimer = 1.6; }
  } else if (spawnQueue.length) {
    waveTimer -= dt;
    if (waveTimer <= 0) {
      const n = Math.min(spawnQueue.length, 2 + Math.floor(wave / 2));
      for (let i = 0; i < n; i++) spawnFoe(spawnQueue.pop());
      waveTimer = rand(0.25, 0.6);
    }
  }

  updateFoes(dt);
  updateBullets(dt);
  updatePickups(dt);
  updateBits(dt);
  updateHud();
}

function updateFoes(dt) {
  const p = player;
  for (const f of foes) {
    const dx = p.x - f.x, dy = p.y - f.y;
    const d = Math.hypot(dx, dy) || 1;
    f.hit = Math.max(0, f.hit - dt * 6);
    f.wobble += dt * 3;

    if (f.type === "turret") {
      // keeps its distance and shoots
      const want = 260;
      const dir = d > want + 30 ? 1 : d < want - 30 ? -1 : 0;
      f.x += dx / d * f.speed * dir * dt;
      f.y += dy / d * f.speed * dir * dt;
      f.cd -= dt;
      if (f.cd <= 0 && d < 620) {
        f.cd = rand(1.5, 2.6);
        const a = Math.atan2(dy, dx);
        foeShots.push({ x: f.x, y: f.y, vx: Math.cos(a) * 260, vy: Math.sin(a) * 260, r: 5, life: 4 });
      }
    } else {
      // darters weave, everything else beelines
      const weave = f.type === "darter" ? Math.sin(f.wobble) * 0.6 : 0;
      const a = Math.atan2(dy, dx) + weave;
      f.x += Math.cos(a) * f.speed * dt;
      f.y += Math.sin(a) * f.speed * dt;
    }

    // separation, so a pack does not collapse into one dot
    for (const g of foes) {
      if (g === f) continue;
      const ddx = f.x - g.x, ddy = f.y - g.y;
      const min = f.r + g.r;
      const dd = Math.hypot(ddx, ddy);
      if (dd > 0 && dd < min) {
        const push = (min - dd) / min * 60 * dt;
        f.x += ddx / dd * push; f.y += ddy / dd * push;
      }
    }

    if (d < f.r + p.r && p.iframe === 0) hurtPlayer(f.type === "tank" ? 22 : 11);
  }

  for (let i = foeShots.length - 1; i >= 0; i--) {
    const s = foeShots[i];
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (s.life <= 0 || s.x < -30 || s.y < -30 || s.x > W + 30 || s.y > H + 30) { foeShots.splice(i, 1); continue; }
    if (dist2(s, p) < (s.r + p.r) ** 2 && p.iframe === 0) { hurtPlayer(9); foeShots.splice(i, 1); }
  }
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.x < -20 || b.y < -20 || b.x > W + 20 || b.y > H + 20) { bullets.splice(i, 1); continue; }

    for (let j = foes.length - 1; j >= 0; j--) {
      const f = foes[j];
      if (dist2(b, f) > (b.r + f.r) ** 2) continue;
      f.hp -= b.dmg; f.hit = 1;
      burst(b.x, b.y, f.color, 4, 130);
      bullets.splice(i, 1);
      if (f.hp <= 0) killFoe(j);
      break;
    }
  }
}

function killFoe(j) {
  const f = foes[j];
  foes.splice(j, 1);
  score += FOE[f.type].score;
  els.score.textContent = score;
  burst(f.x, f.y, f.color, f.type === "tank" ? 40 : 16, 240);
  shake = Math.min(shake + (f.type === "tank" ? 0.6 : 0.16), 1);
  if (f.type === "tank") {
    for (let i = 0; i < 3; i++) {
      const a = Math.random() * TAU;
      spawnFoe("grunt", { x: f.x + Math.cos(a) * 30, y: f.y + Math.sin(a) * 30 });
    }
  }
  if (Math.random() < (f.type === "grunt" ? 0.07 : 0.22)) dropPickup(f.x, f.y);
}

function updatePickups(dt) {
  for (let i = pickups.length - 1; i >= 0; i--) {
    const u = pickups[i];
    u.life -= dt; u.bob += dt * 4;
    if (u.life <= 0) { pickups.splice(i, 1); continue; }
    if (dist2(u, player) < (14 + player.r) ** 2) {
      pickups.splice(i, 1);
      if (u.kind === "heal") {
        player.hp = Math.min(player.maxHp, player.hp + 30);
        toast("REPAIR"); burst(player.x, player.y, "#5ef2a0", 18, 160);
      } else {
        player.weapon = u.kind;
        player.weaponTimer = 9;
        toast(WEAPONS[u.kind].name.toUpperCase());
        burst(player.x, player.y, "#ffd166", 18, 160);
      }
      updateHud();
    }
  }
}

function updateBits(dt) {
  for (let i = bits.length - 1; i >= 0; i--) {
    const b = bits[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.vx *= Math.pow(0.02, dt); b.vy *= Math.pow(0.02, dt);
    b.life -= dt;
    if (b.life <= 0) bits.splice(i, 1);
  }
}

function hurtPlayer(amount) {
  const p = player;
  p.hp -= amount;
  p.iframe = 0.55;
  p.flash = 1;
  shake = Math.min(shake + 0.5, 1.2);
  burst(p.x, p.y, "#ff5470", 14, 200);
  if (p.hp <= 0) gameOver();
  updateHud();
}

function gameOver() {
  state = "over";
  deadFor = 0;
  player.hp = 0;
  burst(player.x, player.y, "#4dd6ff", 60, 320);
  shake = 1.4;
  if (score > best) { best = score; localStorage.setItem("overrun.best", String(best)); els.best.textContent = best; }
  els.overlay.querySelector("h1").innerHTML = 'GAME <span>OVER</span>';
  const old = els.overlay.querySelector(".score");
  if (old) old.remove();
  const s = document.createElement("p");
  s.className = "score";
  s.innerHTML = `Score <b>${score}</b> &nbsp;&middot;&nbsp; Wave <b>${wave}</b> &nbsp;&middot;&nbsp; Best <b>${best}</b>`;
  els.overlay.querySelector("p").after(s);
  els.hint.textContent = "Click to play again";
  setTimeout(() => { if (state === "over") els.overlay.classList.remove("hidden"); }, 700);
}

/* -------------------------------------------------------------- drawing */

function drawGrid() {
  ctx.fillStyle = "#080a14";
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(70,95,160,.14)";
  ctx.lineWidth = 1;
  const step = 48;
  ctx.beginPath();
  for (let x = 0; x <= W; x += step) { ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); }
  for (let y = 0; y <= H; y += step) { ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); }
  ctx.stroke();

  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.15, W / 2, H / 2, Math.max(W, H) * 0.7);
  g.addColorStop(0, "rgba(60,110,220,.10)");
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function glowCircle(x, y, r, color, glow) {
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = glow;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function drawFoe(f) {
  const flash = f.hit > 0;
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.rotate(Math.atan2(player.y - f.y, player.x - f.x));
  ctx.shadowColor = f.color;
  ctx.shadowBlur = 14;
  ctx.fillStyle = flash ? "#ffffff" : f.color;

  if (f.type === "tank") {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * TAU;
      ctx[i ? "lineTo" : "moveTo"](Math.cos(a) * f.r, Math.sin(a) * f.r);
    }
    ctx.closePath(); ctx.fill();
  } else if (f.type === "darter") {
    ctx.beginPath();
    ctx.moveTo(f.r * 1.6, 0); ctx.lineTo(-f.r, f.r * 0.8); ctx.lineTo(-f.r * 0.4, 0); ctx.lineTo(-f.r, -f.r * 0.8);
    ctx.closePath(); ctx.fill();
  } else if (f.type === "turret") {
    ctx.fillRect(-f.r, -f.r, f.r * 2, f.r * 2);
    ctx.fillStyle = "#1a1030";
    ctx.fillRect(f.r * 0.2, -3, f.r, 6);
  } else {
    ctx.beginPath(); ctx.arc(0, 0, f.r, 0, TAU); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.beginPath(); ctx.arc(f.r * 0.3, 0, f.r * 0.4, 0, TAU); ctx.fill();
  }
  ctx.restore();

  if (f.maxHp > 3 && f.hp < f.maxHp) {
    const w = f.r * 2;
    ctx.fillStyle = "rgba(0,0,0,.5)";
    ctx.fillRect(f.x - w / 2, f.y - f.r - 9, w, 3);
    ctx.fillStyle = "#ff5470";
    ctx.fillRect(f.x - w / 2, f.y - f.r - 9, w * (f.hp / f.maxHp), 3);
  }
}

function drawPlayer() {
  const p = player;
  if (state === "over") return;
  const blink = p.iframe > 0 && Math.floor(p.iframe * 20) % 2 === 0;
  ctx.save();
  ctx.globalAlpha = blink ? 0.35 : 1;
  ctx.translate(p.x, p.y);
  ctx.rotate(p.aim);

  ctx.shadowColor = "#4dd6ff";
  ctx.shadowBlur = 18;
  ctx.fillStyle = p.flash > 0 ? "#ffffff" : "#cfe9ff";
  ctx.beginPath(); ctx.arc(0, 0, p.r, 0, TAU); ctx.fill();

  ctx.shadowBlur = 0;
  ctx.fillStyle = "#2c66a8";
  ctx.fillRect(p.r * 0.3, -4, p.r * 1.1, 8);      // barrel
  ctx.restore();

  // dash cooldown ring
  if (p.dashCd > 0) {
    ctx.strokeStyle = "rgba(77,214,255,.55)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r + 6, -Math.PI / 2, -Math.PI / 2 + (1 - p.dashCd / 1.1) * TAU);
    ctx.stroke();
  }
}

function drawPickup(u) {
  const y = u.y + Math.sin(u.bob) * 3;
  const color = u.kind === "heal" ? "#5ef2a0" : u.kind === "rapid" ? "#ffd166" : "#4dd6ff";
  const fade = u.life < 3 && Math.floor(u.life * 6) % 2 === 0 ? 0.3 : 1;
  ctx.save();
  ctx.globalAlpha = fade;
  glowCircle(u.x, y, 9, color, 16);
  ctx.fillStyle = "#06070e";
  ctx.font = "bold 11px system-ui, sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(u.kind === "heal" ? "+" : u.kind === "rapid" ? "R" : "T", u.x, y + 0.5);
  ctx.restore();
}

function render() {
  ctx.save();
  if (shake > 0) {
    const m = shake * 9;
    ctx.translate(rand(-m, m), rand(-m, m));
  }
  drawGrid();

  for (const u of pickups) drawPickup(u);

  for (const b of bits) {
    ctx.globalAlpha = clamp(b.life / b.max, 0, 1);
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x - b.r / 2, b.y - b.r / 2, b.r, b.r);
  }
  ctx.globalAlpha = 1;

  for (const f of foes) drawFoe(f);
  for (const s of foeShots) glowCircle(s.x, s.y, s.r, "#c46bff", 14);
  for (const b of bullets) {
    ctx.strokeStyle = "#9fe4ff";
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - b.vx * 0.012, b.y - b.vy * 0.012);
    ctx.stroke();
  }
  drawPlayer();
  ctx.restore();

  if (player && player.hp / player.maxHp < 0.34 && state === "play") {
    const pulse = 0.18 + Math.sin(elapsed * 6) * 0.08;
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.65);
    g.addColorStop(0, "rgba(255,40,70,0)");
    g.addColorStop(1, `rgba(255,40,70,${pulse})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
}

/* ----------------------------------------------------------- main  loop */

let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  dt = Math.min(dt, 1 / 30);
  update(dt);
  render();
  requestAnimationFrame(frame);
}

// menu state: an idle arena with a few drifting enemies behind the overlay
newGame();
state = "menu";
els.overlay.classList.remove("hidden");
for (let i = 0; i < 5; i++) spawnFoe("grunt");
requestAnimationFrame(frame);
</script>
</body>
